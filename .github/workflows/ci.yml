name: engine-ci

# Gate engine changes before any vault adopts them: a broken engine HEAD would break
# every consuming vault's next `adopt`. Runs the same deterministic checks the tools
# ship with — no LLM, no `claude`, plain scripts only.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Shell syntax (bash -n)
        run: |
          for f in bin/*.sh adopt.d/*.sh; do
            [ -e "$f" ] || continue   # adopt.d/ may be absent/empty on older trees
            bash -n "$f"
          done

      - name: Python syntax (py_compile)
        run: python3 -m py_compile bin/*.py

      - name: Workflow steps must not write the real global git config
        run: |
          # These `run` blocks get extracted and executed locally to verify them — that is
          # a deliberate practice here. `git config --global` then writes the DEVELOPER's
          # ~/.gitconfig, which silently replaced a machine's git identity and misattributed
          # two release commits. Any step using --global must first redirect it to a
          # throwaway file, so the recipe is safe to run anywhere.
          # Deliberately dependency-free: PyYAML is not guaranteed on the runner, and a
          # guard that cannot run is worth nothing. Steps are split on the `- name:` key
          # at the steps indent, which is enough to attribute each --global to its step.
          python3 - <<'PY'
          import sys
          steps, cur = [], ['<preamble>', []]
          for line in open('.github/workflows/ci.yml'):
              if line.startswith('      - name:'):
                  steps.append(cur)
                  cur = [line.split(':', 1)[1].strip(), []]
              else:
                  cur[1].append(line)
          steps.append(cur)

          bad = []
          for name, body in steps:
              # The exemption marker is itself a comment, so look for it BEFORE stripping
              # comments — otherwise this step flags itself for naming the pattern it
              # detects.
              if 'GUARD-SELF-EXEMPT' in ''.join(body):
                  continue
              # Comments legitimately DISCUSS the forbidden command — including the ones
              # explaining why it is forbidden — so scan executable lines only. Without
              # this the guard fails on a healthy tree, and a check that is always red is
              # a check that gets bypassed.
              text = ''.join(l for l in body if not l.lstrip().startswith('#'))
              if 'git config --global' not in text:
                  continue
              if 'GIT_CONFIG_GLOBAL' not in text:
                  bad.append(name)
              elif text.index('GIT_CONFIG_GLOBAL') > text.index('git config --global'):
                  bad.append(name + ' (redirect comes after the first --global write)')
          if bad:
              print('these steps write the REAL global git config:')
              for b in bad:
                  print('  -', b)
              sys.exit(1)
          print('ok: every --global write is redirected to a throwaway GIT_CONFIG_GLOBAL')
          PY
          # GUARD-SELF-EXEMPT

      - name: Status line renders and degrades
        run: |
          # The status line is always on screen, so a crash or a wrong number is worse
          # than no status line at all. Assert the CONTEXT BANDS (they drive the
          # checkpoint-before-compaction nudge) and that every malformed input still
          # exits 0 with a usable line.
          mk() { printf '{"workspace":{"current_dir":"/w"},"model":{"display_name":"M"},"context_window":{"used_percentage":%s}}' "$1"; }
          out() { mk "$1" | ./bin/statusline.sh; }
          out 42 | grep -q 'ctx 42%'            || { echo "normal band missing"; exit 1; }
          out 42 | grep -q 'checkpoint'         && { echo "nudged too early at 42%"; exit 1; }
          out 70 | grep -q 'checkpoint soon'    || { echo "no soon-nudge at 70%"; exit 1; }
          out 85 | grep -q 'checkpoint now'     || { echo "no now-nudge at 85%"; exit 1; }
          # truncate, never round: 84.9 is not 85 and must not escalate the nudge
          out 84.9 | grep -q 'checkpoint soon'  || { echo "84.9 mis-banded"; exit 1; }
          # degradation: absent field, null, non-numeric, and non-JSON all exit 0
          for bad in '{"model":{"display_name":"M"}}' '{"context_window":{"used_percentage":null}}' \
                     '{"context_window":{"used_percentage":"abc"}}' 'not json'; do
            printf '%s' "$bad" | ./bin/statusline.sh >/dev/null 2>&1 \
              || { echo "status line failed on input: $bad"; exit 1; }
            printf '%s' "$bad" | ./bin/statusline.sh | grep -q 'ctx ' \
              && { echo "printed a context figure it does not have: $bad"; exit 1; }
          done
          echo "ok: bands correct, degrades cleanly"

      - name: Engine docs are soft-wrapped
        run: ./bin/reflow.sh --check $(find . -type d -name .git -prune -o \( -name '*.md' -o -name '*.tmpl' \) -print)

      - name: Usage docs cover all skills + no stale command refs
        run: ./bin/lint-docs.sh

      - name: Crossover fail-closed smoke test
        run: |
          # crossover's safety property is that a LOSSY PASTE CAN NEVER AUTHORIZE A DELETE:
          # integrity rides on the per-item sha256 + batch bundle hash, never on the
          # block's framing. Pin that here — the last-item flush used to depend on the
          # trailing ##END, so dropping that one optional-looking line lost the item and
          # aborted under `set -u` (#19, fixed incidentally by the #30 split-export rework).
          O="$RUNNER_TEMP/xo/origin"; mkdir -p "$O/memory"
          printf -- '---\ntitle: Test note\nboundary: work\n---\n\nBody text.\n' > "$O/memory/test-note.md"
          ./bin/crossover.sh export --vault "$O" --batch CI1 memory/test-note.md > "$RUNNER_TEMP/xo/block.txt"

          # (a) intact block round-trips and verifies
          D="$RUNNER_TEMP/xo/d-intact"; mkdir -p "$D"
          ./bin/crossover.sh import --vault "$D" < "$RUNNER_TEMP/xo/block.txt" | grep -qx 'status all-verified' \
            || { echo "intact block did not verify"; exit 1; }

          # (b) trailing ##END dropped — the payload is unchanged, so it must STILL verify
          #     (and must not abort): the terminator is framing, not integrity.
          grep -v '^##END$' "$RUNNER_TEMP/xo/block.txt" > "$RUNNER_TEMP/xo/no-end.txt"
          D="$RUNNER_TEMP/xo/d-noend"; mkdir -p "$D"
          ./bin/crossover.sh import --vault "$D" < "$RUNNER_TEMP/xo/no-end.txt" | grep -qx 'status all-verified' \
            || { echo "block without trailing ##END failed to import"; exit 1; }

          # (c) truncated payload — must fail CLOSED: incomplete receipt, item named as
          #     hash-mismatch, and nothing written into the destination vault.
          N=$(wc -l < "$RUNNER_TEMP/xo/no-end.txt")
          sed -n "1,$((N-1))p" "$RUNNER_TEMP/xo/no-end.txt" > "$RUNNER_TEMP/xo/cut.txt"
          D="$RUNNER_TEMP/xo/d-cut"; mkdir -p "$D"
          ./bin/crossover.sh import --vault "$D" < "$RUNNER_TEMP/xo/cut.txt" > "$RUNNER_TEMP/xo/receipt.txt"
          grep -qx 'status incomplete' "$RUNNER_TEMP/xo/receipt.txt" \
            || { echo "truncated payload did not fail closed"; exit 1; }
          grep -q 'status hash-mismatch' "$RUNNER_TEMP/xo/receipt.txt" \
            || { echo "truncated payload was not diagnosed as hash-mismatch"; exit 1; }
          [ ! -e "$D/memory/test-note.md" ] \
            || { echo "truncated payload wrote a file into the destination"; exit 1; }

      - name: Link-integrity gate behaviour
        run: |
          # The gate's value is entirely in WHICH links it errors on, so pin both
          # directions: a near-miss must fail, a genuine stub must not, and a link
          # inside a code span of any backtick width must be invisible.
          V="$RUNNER_TEMP/lg"; mkdir -p "$V/notes" "$V/memory"
          mk() { printf -- '---\ntitle: %s\nboundary: personal\n---\n%s\n' "$1" "$2" > "$V/$3"; }
          mk real  'real page'                                    memory/pi-cluster.md
          mk real2 'real page'                                    memory/machine-sync.md

          # (a) rename shape: edit distance alone does NOT catch this (~0.71 similarity)
          mk t 'see [[project-pi-cluster]] and [[machine-sync]]'  notes/t.md
          ./bin/lint-links.sh --wiki "$V" | grep -q 'project-pi-cluster.*rename' \
            || { echo "near-miss (rename shape) not detected"; exit 1; }
          ./bin/lint-links.sh --wiki "$V" >/dev/null 2>&1 \
            && { echo "near-miss did not fail the gate"; exit 1; } || true

          # (b) a genuine stub must stay a warning, not an error
          mk t 'see [[machine-sync]] and [[an-unwritten-note]]'   notes/t.md
          ./bin/lint-links.sh --wiki "$V" >/dev/null 2>&1 \
            || { echo "a genuine stub wrongly failed the gate"; exit 1; }

          # (c) code spans of 1/2/3 backticks are documentation, not links
          mk t 'a `[[zzz-one]]` b ``[[zzz-two]]`` c ```[[zzz-three]]``` d [[machine-sync]]' notes/t.md
          if ./bin/lint-links.sh --wiki "$V" | grep -q 'zzz-'; then
            echo "a wikilink inside a code span was treated as a link"; exit 1
          fi

      - name: Concurrency model (isolation, guard, serialization)
        run: |
          # Two sessions writing one vault. The property under test is that BOTH sets of
          # work survive and land in a linear history — the failure this exists to stop
          # is one session's `git add -A` sweeping up a peer's uncommitted work.
          # Isolate git config to a throwaway file. `git config --global` writes to the
          # REAL ~/.gitconfig, which is harmless on a runner that is destroyed minutes
          # later and decidedly not harmless when this block is extracted and executed on
          # a workstation to verify it — that silently replaced a machine's git identity
          # and misattributed two release commits. Keep this export when copying locally.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-cc"
          git config --global user.email ci@example.com
          git config --global user.name CI
          V="$RUNNER_TEMP/cc"; mkdir -p "$V/notes"
          git -C "$V" init -q .
          printf 'seed\n' > "$V/notes/seed.md"
          git -C "$V" add -A && git -C "$V" commit -qm seed && git -C "$V" branch -M main
          export WIKI_PATH="$V"
          A="$(WIKI_WT_SESSION=sess-A ./bin/vault-worktree.sh ensure 2>/dev/null)"
          B="$(WIKI_WT_SESSION=sess-B ./bin/vault-worktree.sh ensure 2>/dev/null)"
          [ "$A" != "$B" ] || { echo "two sessions got the same worktree"; exit 1; }

          # guard: canonical refused, worktree allowed
          (cd "$V" && WIKI_WT_SESSION=sess-A "$GITHUB_WORKSPACE/bin/vault-worktree.sh" guard) \
            && { echo "guard did not refuse a commit in canonical"; exit 1; } || true
          (cd "$A" && WIKI_WT_SESSION=sess-A "$GITHUB_WORKSPACE/bin/vault-worktree.sh" guard) \
            || { echo "guard wrongly refused a commit inside a worktree"; exit 1; }

          # both sessions commit independently, then integrate through the lock
          printf 'A work\n' > "$A/notes/a.md"; git -C "$A" add -A; git -C "$A" commit -qm "A work"
          printf 'B work\n' > "$B/notes/b.md"; git -C "$B" add -A; git -C "$B" commit -qm "B work"
          (cd "$A" && WIKI_WT_SESSION=sess-A "$GITHUB_WORKSPACE/bin/vault-worktree.sh" integrate >/dev/null 2>&1) \
            || { echo "A failed to integrate"; exit 1; }
          (cd "$B" && WIKI_WT_SESSION=sess-B "$GITHUB_WORKSPACE/bin/vault-worktree.sh" integrate >/dev/null 2>&1) \
            || { echo "B failed to integrate"; exit 1; }
          # NEITHER may be lost — this is the whole point
          [ -f "$V/notes/a.md" ] || { echo "session A's work was lost"; exit 1; }
          [ -f "$V/notes/b.md" ] || { echo "session B's work was lost"; exit 1; }

          # a real conflict must fail closed: canonical untouched, worktree recoverable
          printf 'A v2\n' > "$A/notes/x.md"; git -C "$A" add -A; git -C "$A" commit -qm "A x"
          (cd "$A" && WIKI_WT_SESSION=sess-A "$GITHUB_WORKSPACE/bin/vault-worktree.sh" integrate >/dev/null 2>&1)
          printf 'B v2\n' > "$B/notes/x.md"; git -C "$B" add -A; git -C "$B" commit -qm "B x"
          before="$(git -C "$V" rev-parse HEAD)"
          # `|| rc=$?`, not a bare call then `$?` — this step runs under `bash -e`, which
          # would abort on the expected non-zero before the status could be read.
          rc=0
          (cd "$B" && WIKI_WT_SESSION=sess-B "$GITHUB_WORKSPACE/bin/vault-worktree.sh" integrate >/dev/null 2>&1) || rc=$?
          [ "$rc" -eq 3 ] || { echo "expected exit 3 on rebase conflict, got $rc"; exit 1; }
          [ "$(git -C "$V" rev-parse HEAD)" = "$before" ] \
            || { echo "a failed integrate moved canonical HEAD"; exit 1; }
          git -C "$B" log --oneline -1 | grep -q "B x" \
            || { echo "the conflicting session lost its commit"; exit 1; }

          # integrate must not treat UNTRACKED files in canonical as dirty. Adoption
          # leaves empty node folders and the RAG index untracked there by design, so a
          # check that counted them would refuse every integrate — and a check that is
          # always red is a check that gets bypassed.
          mkdir -p "$V/untracked-dir" && printf 'x\n' > "$V/untracked-dir/x.md"
          printf 'C work\n' > "$A/notes/c.md"; git -C "$A" add -A; git -C "$A" commit -qm "A c"
          (cd "$A" && WIKI_WT_SESSION=sess-A "$GITHUB_WORKSPACE/bin/vault-worktree.sh" integrate >/dev/null 2>&1) \
            || { echo "integrate wrongly refused over untracked files in canonical"; exit 1; }
          # ...but a TRACKED modification in canonical must still block it
          printf 'edited\n' >> "$V/notes/seed.md"
          printf 'D work\n' > "$A/notes/d.md"; git -C "$A" add -A; git -C "$A" commit -qm "A d"
          rc=0
          (cd "$A" && WIKI_WT_SESSION=sess-A "$GITHUB_WORKSPACE/bin/vault-worktree.sh" integrate >/dev/null 2>&1) || rc=$?
          [ "$rc" -eq 1 ] || { echo "integrate ignored a tracked modification in canonical (rc=$rc)"; exit 1; }
          git -C "$V" checkout -- notes/seed.md

      - name: Vault gate runs from a worktree, not just canonical
        run: |
          # REGRESSION: a hook that resolves engine/ from `--show-toplevel` is silently
          # inert inside a worktree, because a linked worktree carries no submodule. Since
          # checkpoint commits from a worktree by design, that made the gate skip exactly
          # the commits it was meant to cover. Assert the shipped hook resolves the
          # CANONICAL root and therefore actually runs there.
          V="$RUNNER_TEMP/wg"; mkdir -p "$V/memory"
          git -C "$V" init -q .
          mkdir -p "$V/engine/bin" "$V/.githooks"
          # stand in for the engine submodule: a lint that always fails, so "did the gate
          # run?" is observable as a refused commit rather than inferred from silence
          printf '#!/usr/bin/env bash\necho "GATE RAN"; exit 1\n' > "$V/engine/bin/lint.sh"
          printf '#!/usr/bin/env bash\nexit 0\n' > "$V/engine/bin/vault-worktree.sh"
          chmod +x "$V/engine/bin/lint.sh" "$V/engine/bin/vault-worktree.sh"
          cp scaffold/pre-commit "$V/.githooks/pre-commit"; chmod +x "$V/.githooks/pre-commit"
          git -C "$V" config core.hooksPath .githooks
          # engine/ must be ABSENT from the worktree, which is the whole point: a real
          # vault carries it as a submodule and `git worktree add` never populates it.
          # Ignoring it here reproduces that. Without this the fixture commits engine/ as
          # tracked content, the worktree gets a copy, and the test passes even with the
          # bug reinstated — which is exactly what happened on the first attempt.
          printf 'engine/\n' > "$V/.gitignore"
          printf 'seed\n' > "$V/memory/seed.md"
          git -C "$V" -c core.hooksPath=/dev/null add -A
          git -C "$V" -c core.hooksPath=/dev/null commit -qm seed
          git -C "$V" branch -M main
          git -C "$V" worktree add -q "$V/../wg-wt" -b wt/probe main
          printf 'more\n' > "$RUNNER_TEMP/wg-wt/memory/more.md"
          git -C "$RUNNER_TEMP/wg-wt" add -A
          out="$(git -C "$RUNNER_TEMP/wg-wt" commit -m "from worktree" 2>&1 || true)"
          printf '%s\n' "$out" | grep -q "GATE RAN" \
            || { echo "the vault gate did NOT run from inside a worktree:"; printf '%s\n' "$out"; exit 1; }

      - name: Scaffolder + lint smoke test
        run: |
          # Isolate git config (see the concurrency step above) so extracting this block
          # and running it locally cannot touch the real ~/.gitconfig.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-scaffold"
          git config --global user.email ci@example.com
          git config --global user.name CI
          # NOTE: no `protocol.file.allow=always` here any more. new-wiki.sh now scopes
          # that exception to its own submodule-add when --engine-url is a local path, so
          # neither CI nor a developer's machine needs the global loosening.
          # Isolate settings so the wire/adopt path never mutates the real ~/.claude/settings.json.
          # ensure-hook keys the boot hook on WIKI_PATH; a throwaway vault would otherwise leave a
          # permanent, un-dedupable SessionStart hook. Keep this export when copying the recipe locally.
          export CLAUDE_SETTINGS="$RUNNER_TEMP/settings.json"
          VAULT="$RUNNER_TEMP/testvault"
          ./bin/new-wiki.sh --path "$VAULT" --boundary personal \
            --email ci@example.com --git-name CI --engine-url "$PWD" --no-link-skills --no-rag
          ./bin/lint.sh --wiki "$VAULT"
          ./bin/adopt.sh --check --wiki "$VAULT"
