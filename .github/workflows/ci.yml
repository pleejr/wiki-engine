name: engine-ci

# Gate engine changes before any vault adopts them: a broken engine HEAD would break
# every consuming vault's next `adopt`. Runs the same deterministic checks the tools
# ship with — no LLM, no `claude`, plain scripts only.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Shell syntax (bash -n)
        run: |
          for f in bin/*.sh adopt.d/*.sh; do
            [ -e "$f" ] || continue   # adopt.d/ may be absent/empty on older trees
            bash -n "$f"
          done

      - name: Python syntax (py_compile)
        run: python3 -m py_compile bin/*.py

      - name: The pinned-dep remedy addresses the reader who can act on it
        run: |
          # One report, two audiences. In an engine checkout `rag-requirements.txt` is an
          # ordinary tracked file and "bump it" is the whole remedy. In a consumer vault
          # the same path sits inside the PINNED submodule, where the edit has no durable
          # home — so the tool would be steering the reader into the hazard that
          # engine-proposal.sh's own comment calls "the time bomb the skill exists to warn
          # against". Fail-open: every step of following it succeeds.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-remedy"
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main
          git config --global protocol.file.allow always   # local-path submodule add, this repo only
          T="$RUNNER_TEMP/remedy"; rm -rf "$T"; mkdir -p "$T"; fail=0
          PY="$GITHUB_WORKSPACE/bin/rag_deps_check.py"

          # an engine checkout, and a vault that PINS it as a submodule
          git init -q "$T/engine"; cp "$PY" "$T/engine/rag_deps_check.py"
          printf 'x\n' > "$T/engine/seed"; git -C "$T/engine" add -A
          git -C "$T/engine" commit -qm seed
          git init -q "$T/vault"; printf 'v\n' > "$T/vault/seed"
          git -C "$T/vault" add -A; git -C "$T/vault" commit -qm seed
          git -C "$T/vault" submodule add -q "$T/engine" engine
          git -C "$T/vault" commit -qm "pin engine"

          probe() { python3 -c "
          import sys; sys.path.insert(0, '$1')
          import rag_deps_check as r
          print(r.pinning_superproject('$2') or 'NONE')
          "; }
          # `|| echo PROBE-FAILED`: a missing predicate must read as a FAIL line, not as a
          # traceback that kills the step at the assignment under `bash -e`.
          out_engine="$(probe "$T/engine" "$T/engine/rag_deps_check.py" 2>/dev/null || echo PROBE-FAILED)"
          out_vault="$(probe "$T/engine" "$T/vault/engine/rag_deps_check.py" 2>/dev/null || echo PROBE-FAILED)"
          printf 'engine=%s vault=%s\n' "$out_engine" "$out_vault"

          [ "$out_engine" = "NONE" ] \
            && echo "  ok   an engine checkout keeps the bump-it-here remedy" \
            || { echo "  FAIL an engine checkout was mistaken for a consumer vault"; fail=1; }
          case "$out_vault" in
            */vault) echo "  ok   a pinned submodule resolves to the vault that pins it" ;;
            *) echo "  FAIL a consumer vault was told to edit its own pinned submodule"; fail=1 ;;
          esac
          # degrades to the generic wording rather than to no wording at all
          [ "$(probe "$T/engine" "$RUNNER_TEMP/not-a-repo/reqs.txt" 2>/dev/null || echo PROBE-FAILED)" = "NONE" ] \
            && echo "  ok   outside a repository it degrades to the generic remedy" \
            || { echo "  FAIL a non-repository path claimed a superproject"; fail=1; }

          exit "$fail"

      - name: Workflow steps must not write the real global git config
        run: |
          # These `run` blocks get extracted and executed locally to verify them — that is
          # a deliberate practice here. `git config --global` then writes the DEVELOPER's
          # ~/.gitconfig, which silently replaced a machine's git identity and misattributed
          # two release commits. Any step using --global must first redirect it to a
          # throwaway file, so the recipe is safe to run anywhere.
          # Deliberately dependency-free: PyYAML is not guaranteed on the runner, and a
          # guard that cannot run is worth nothing. Steps are split on the `- name:` key
          # at the steps indent, which is enough to attribute each --global to its step.
          python3 - <<'PY'
          import sys
          steps, cur = [], ['<preamble>', []]
          for line in open('.github/workflows/ci.yml'):
              if line.startswith('      - name:'):
                  steps.append(cur)
                  cur = [line.split(':', 1)[1].strip(), []]
              else:
                  cur[1].append(line)
          steps.append(cur)

          bad = []
          for name, body in steps:
              # The exemption marker is itself a comment, so look for it BEFORE stripping
              # comments — otherwise this step flags itself for naming the pattern it
              # detects.
              if 'GUARD-SELF-EXEMPT' in ''.join(body):
                  continue
              # Comments legitimately DISCUSS the forbidden command — including the ones
              # explaining why it is forbidden — so scan executable lines only. Without
              # this the guard fails on a healthy tree, and a check that is always red is
              # a check that gets bypassed.
              text = ''.join(l for l in body if not l.lstrip().startswith('#'))
              if 'git config --global' not in text:
                  continue
              if 'GIT_CONFIG_GLOBAL' not in text:
                  bad.append(name)
              elif text.index('GIT_CONFIG_GLOBAL') > text.index('git config --global'):
                  bad.append(name + ' (redirect comes after the first --global write)')
          if bad:
              print('these steps write the REAL global git config:')
              for b in bad:
                  print('  -', b)
              sys.exit(1)
          print('ok: every --global write is redirected to a throwaway GIT_CONFIG_GLOBAL')
          PY
          # GUARD-SELF-EXEMPT

      - name: Status line renders and degrades
        run: |
          # The status line is always on screen, so a crash or a wrong number is worse
          # than no status line at all. Assert the CONTEXT BANDS (they drive the
          # checkpoint-before-compaction nudge) and that every malformed input still
          # exits 0 with a usable line.
          mk() { printf '{"workspace":{"current_dir":"/w"},"model":{"display_name":"M"},"context_window":{"used_percentage":%s}}' "$1"; }
          out() { mk "$1" | ./bin/statusline.sh; }
          out 42 | grep -q 'ctx 42%'            || { echo "normal band missing"; exit 1; }
          out 42 | grep -q 'checkpoint'         && { echo "nudged too early at 42%"; exit 1; }
          out 70 | grep -q 'checkpoint soon'    || { echo "no soon-nudge at 70%"; exit 1; }
          out 85 | grep -q 'checkpoint now'     || { echo "no now-nudge at 85%"; exit 1; }
          # truncate, never round: 84.9 is not 85 and must not escalate the nudge
          out 84.9 | grep -q 'checkpoint soon'  || { echo "84.9 mis-banded"; exit 1; }
          # degradation: absent field, null, non-numeric, and non-JSON all exit 0
          for bad in '{"model":{"display_name":"M"}}' '{"context_window":{"used_percentage":null}}' \
                     '{"context_window":{"used_percentage":"abc"}}' 'not json'; do
            printf '%s' "$bad" | ./bin/statusline.sh >/dev/null 2>&1 \
              || { echo "status line failed on input: $bad"; exit 1; }
            printf '%s' "$bad" | ./bin/statusline.sh | grep -q 'ctx ' \
              && { echo "printed a context figure it does not have: $bad"; exit 1; }
          done
          echo "ok: bands correct, degrades cleanly"

      - name: Status-line segments compose, and cannot drift from the full row
        run: |
          # The host allows exactly ONE status line, so a vault with its own row could not
          # adopt any element of this one without abandoning theirs — every feature shipped
          # to the status line was permanently unreachable for them, and nothing reported
          # it. The property that matters is ONE implementation: a segment path duplicating
          # the renderer's logic just relocates the drift it exists to prevent, so the
          # composed row and the full row must be character-identical.
          fail=0
          CFG="$RUNNER_TEMP/slcfg"; rm -rf "$CFG"; mkdir -p "$CFG"
          printf 'engine v1.0.0 -> v2.0.0 (MAJOR)\n' > "$CFG/.wiki-engine-status"
          export CLAUDE_CONFIG_DIR="$CFG"
          J='{"workspace":{"current_dir":"/w"},"model":{"display_name":"M"},"context_window":{"used_percentage":88},"rate_limits":{"five_hour":{"used_percentage":81}}}'
          seg() { printf '%s' "$J" | ./bin/statusline.sh --segment "$1"; }

          full="$(printf '%s' "$J" | ./bin/statusline.sh)"
          DIM=$'\033[2m'; RESET=$'\033[0m'
          comp="$(seg dir) ${DIM}·${RESET} $(seg model) ${DIM}·${RESET} $(seg ctx) ${DIM}·${RESET} $(seg rl)  $(seg stale)"
          [ "$full" = "$comp" ] \
            && echo "  ok   the full row IS the composition of its segments" \
            || { echo "  FAIL segment path has drifted from the renderer"; printf '%s\n%s\n' "$full" "$comp" | cat -v; fail=1; }

          # a segment prints only its own fragment (uncolored, so the assertion is about
          # the text rather than about where the escape sequences sit)
          plain="$(printf '%s' "$J" | NO_COLOR=1 ./bin/statusline.sh --segment ctx)"
          case "$plain" in
            'ctx 88'*) echo "  ok   a segment prints only its fragment" ;;
            *) echo "  FAIL segment carried more than itself: $plain"; fail=1 ;;
          esac
          case "$plain" in
            *M*|*/w*) echo "  FAIL segment leaked another element's text: $plain"; fail=1 ;;
            *) echo "  ok   ...with no other element's text" ;;
          esac

          # nothing to say = NOTHING, exit 0. Never a placeholder like "ctx 0%".
          for bad in '{"model":{"display_name":"M"}}' '{"context_window":{"used_percentage":null}}' \
                     '{"context_window":{"used_percentage":"abc"}}' 'not json'; do
            o="$(printf '%s' "$bad" | ./bin/statusline.sh --segment ctx)"; rc=$?
            [ "$rc" = "0" ] && [ -z "$o" ] \
              || { echo "  FAIL ctx segment misbehaved on: $bad (rc=$rc out=$o)"; fail=1; }
          done
          echo "  ok   an absent, null or non-numeric field yields silence and exit 0"

          # an unknown name must not corrupt a consuming row, but must be visible by hand
          o="$(printf '%s' "$J" | ./bin/statusline.sh --segment nope 2>/dev/null)"
          [ -z "$o" ] && echo "  ok   an unknown segment prints nothing to stdout" \
                      || { echo "  FAIL unknown segment wrote to a row"; fail=1; }
          printf '%s' "$J" | ./bin/statusline.sh --segment nope 2>&1 >/dev/null | grep -q 'no such segment' \
            && echo "  ok   ...and says so on stderr" \
            || { echo "  FAIL unknown segment failed silently"; fail=1; }

          # NO_COLOR, and exit 0 on every path
          printf '%s' "$J" | NO_COLOR=1 ./bin/statusline.sh --segment ctx | grep -q $'\033' \
            && { echo "  FAIL segment emitted color under NO_COLOR"; fail=1; } \
            || echo "  ok   NO_COLOR is honored by the segment path"

          # the healthy band must be readable in its calm state — dim made "everything is
          # fine" look like "this indicator is not working", which is also how the absent
          # case renders. Colors asserted per band so a future edit cannot quietly collapse
          # two of them into one.
          band() { printf '{"context_window":{"used_percentage":%s}}' "$1" | ./bin/statusline.sh --segment ctx | cat -v; }
          # 92m, the palette's BRIGHT green slot — not 32m, which several themes bind to a
          # muted olive that reads closer to the dim it replaced than to a signal
          band 42 | grep -q '\^\[\[92m' \
            && echo "  ok   the healthy band is bright green, not dim or standard green" \
            || { echo "  FAIL healthy band is not bright green: $(band 42)"; fail=1; }
          # every band is bold — escalation is carried by hue and by the action text the calm
          # band lacks, so a partially-bold gauge just makes one band the odd one out
          for pct in 42 72 88; do
            band "$pct" | grep -q '\^\[\[1m' \
              && echo "  ok   the $pct% band is bold" \
              || { echo "  FAIL $pct% band is not bold: $(band "$pct")"; fail=1; }
          done
          band 72 | grep -q '\^\[\[33m' \
            && echo "  ok   the soon-band is still amber" \
            || { echo "  FAIL soon-band colour changed"; fail=1; }
          band 88 | grep -q '\^\[\[31m' \
            && echo "  ok   the now-band is still red" \
            || { echo "  FAIL now-band colour changed"; fail=1; }
          # the rate limit is threshold-gated, so it only ever appears when it is actionable —
          # it must not then be the quietest thing on the row. Still amber, and still silent
          # below the threshold, which is the property that earns it the space at all.
          rl() { printf '{"rate_limits":{"five_hour":{"used_percentage":%s}}}' "$1" | ./bin/statusline.sh --segment rl | cat -v; }
          rl 81 | grep -q '\^\[\[1m' \
            && echo "  ok   the rate limit is bold, like the gauge" \
            || { echo "  FAIL rate limit is not bold: $(rl 81)"; fail=1; }
          rl 81 | grep -q '\^\[\[33m' \
            && echo "  ok   ...and still amber" \
            || { echo "  FAIL rate limit colour changed: $(rl 81)"; fail=1; }
          [ -z "$(rl 79)" ] \
            && echo "  ok   ...and still silent below the threshold" \
            || { echo "  FAIL rate limit printed below its threshold: $(rl 79)"; fail=1; }
          # the staleness verdict is bold on both its paths — MAJOR reads red, anything else
          # amber — since every coloured element on this row is now bold and a plain one would
          # read as the exception. $CFG is still exported from above.
          stale_frag() { printf '%s\n' "$1" > "$CFG/.wiki-engine-status"; ./bin/statusline.sh --segment stale | cat -v; }
          stale_frag 'engine v1.0.0 -> v2.0.0 (MAJOR)' | grep -q '\^\[\[1m\^\[\[31m' \
            && echo "  ok   the MAJOR staleness verdict is bold red" \
            || { echo "  FAIL MAJOR verdict is not bold red: $(stale_frag 'engine v1.0.0 -> v2.0.0 (MAJOR)')"; fail=1; }
          stale_frag 'engine v1.0.0 -> v1.1.0' | grep -q '\^\[\[1m\^\[\[33m' \
            && echo "  ok   ...and a non-MAJOR one is bold amber" \
            || { echo "  FAIL non-MAJOR verdict is not bold amber: $(stale_frag 'engine v1.0.0 -> v1.1.0')"; fail=1; }
          printf 'engine v1.0.0 -> v2.0.0 (MAJOR)\n' > "$CFG/.wiki-engine-status"

          printf '{"context_window":{"used_percentage":42}}' | NO_COLOR=1 ./bin/statusline.sh --segment ctx | grep -q $'\033' \
            && { echo "  FAIL the new colour leaks escapes under NO_COLOR"; fail=1; } \
            || echo "  ok   the new colour is blanked under NO_COLOR too"
          NO_COLOR=1 ./bin/statusline.sh --segment stale | grep -q $'\033' \
            && { echo "  FAIL the staleness verdict leaks escapes under NO_COLOR"; fail=1; } \
            || echo "  ok   ...and so is the staleness verdict"

          ./bin/statusline.sh --segments | grep -qx 'stale' \
            && echo "  ok   the available segments are discoverable" \
            || { echo "  FAIL --segments does not list them"; fail=1; }

          # the refusal to clobber a foreign row must name the alternative, or "we will not
          # touch your row" keeps meaning "and therefore you get none of this"
          if command -v jq >/dev/null 2>&1; then
            S="$RUNNER_TEMP/foreign-settings.json"
            printf '{"statusLine":{"type":"command","command":"/my/own/row.sh"}}\n' > "$S"
            o="$(./bin/ensure-statusline.sh --command "/eng/bin/statusline.sh" --marker 'eng/bin/statusline.sh' --settings "$S")"
            printf '%s' "$o" | grep -q -- '--segment' \
              && echo "  ok   a foreign row is left alone AND told about segments" \
              || { echo "  FAIL the refusal is still a dead end"; fail=1; }
            grep -q '/my/own/row.sh' "$S" \
              && echo "  ok   ...and the foreign row is untouched" \
              || { echo "  FAIL the foreign statusLine was modified"; fail=1; }
          fi

          exit "$fail"

      - name: Engine docs are soft-wrapped
        run: |
          # proposals/ is EXCLUDED: those files are consumer-authored payloads, not engine
          # documentation. A submitter writes them in their own vault and has no reason to
          # know this repo's soft-wrap convention — so applying it here made every arrival
          # redden main for a rule that should not govern incoming content at all. Same
          # class as the ledger-staleness failure: the merge that RECORDS arrival must not
          # be the thing that breaks the build.
          ./bin/reflow.sh --check $(find . -type d \( -name .git -o -name proposals \) -prune -o \( -name '*.md' -o -name '*.tmpl' \) -print)

      - name: Usage docs cover all skills + no stale command refs
        run: ./bin/lint-docs.sh


      - name: A stale doc pointer is caught wherever the docs write it
        run: |
          # REGRESSION: check 2 read USAGE.md only and matched a BARE `<name>.sh` only, so a
          # reference written with its directory produced no match at all — `adopt.d/40-session-
          # banner-hook.sh` (deleted at v1.13.0) sat in USAGE.md through 58 releases with this gate
          # green every time, and `SCHEMA.md`, which documents the same bin/ surface in more depth,
          # was never opened. Fail-open and self-concealing: the success line reads the same whether
          # a reference was checked or never seen.
          fail=0
          D="$RUNNER_TEMP/docrefs"; rm -rf "$D"; mkdir -p "$D"
          # Every directory the docs can name has to come along, or the fixture goes red for a
          # reason that has nothing to do with the probes — the same completeness the check itself
          # demands. `.github` included: SCHEMA.md names the workflow file.
          cp -R "$GITHUB_WORKSPACE"/bin "$GITHUB_WORKSPACE"/skills "$GITHUB_WORKSPACE"/scaffold \
                "$GITHUB_WORKSPACE"/adopt.d "$GITHUB_WORKSPACE"/.github "$GITHUB_WORKSPACE"/USAGE.md \
                "$GITHUB_WORKSPACE"/SCHEMA.md "$GITHUB_WORKSPACE"/README.md "$D/"

          # PRECONDITION: the fixture is green before anything is broken in it. Every assertion
          # below reads a transition, and a fixture that starts red cannot show one.
          "$D/bin/lint-docs.sh" >/dev/null 2>&1 \
            && echo "  ok   the shipped docs pass their own gate" \
            || { echo "  FAIL the fixture is red before the probes — the rest proves nothing"; fail=1; }

          # The exact shape that escaped: a path-shaped reference in USAGE.md.
          probe() {   # $1 = file to append to, $2 = markdown line, $3 = string the finding must name
            printf '\n%s\n' "$2" >> "$D/$1"
            rc=0; out="$("$D/bin/lint-docs.sh" 2>&1)" || rc=$?
            # `|| rc=$?` because this step runs under `bash -e`: a bare assignment from a failing
            # command substitution aborts the step at the very failure being asserted.
            if [ "$rc" -ne 0 ] && printf '%s' "$out" | grep -q -- "$3"; then
              echo "  ok   caught: $2"
            else
              echo "  FAIL not caught (rc=$rc): $2"; fail=1
            fi
            # restore, and require the gate to go GREEN again — a check stuck red proves nothing either
            cp "$GITHUB_WORKSPACE/$1" "$D/$1"
            "$D/bin/lint-docs.sh" >/dev/null 2>&1 \
              || { echo "  FAIL the gate stayed red after the probe was removed"; fail=1; }
          }
          probe USAGE.md  '- `adopt.d/99-not-a-step.sh`'        'adopt.d/99-not-a-step.sh'
          probe SCHEMA.md '- `not-a-step.sh`'                   'bin/not-a-step.sh'
          probe README.md '- `skills/no-such-skill/SKILL.md`'   'skills/no-such-skill/SKILL.md'
          probe USAGE.md  '- `bin/also-not-here.sh`'            'bin/also-not-here.sh'

          # NEAR-MISS: the check must not fail closed on prose that is CORRECT. Consumer-side,
          # templated and globbed paths do not resolve in this repo and never should — a gate that
          # rejects them gets weakened back out, which is worse than the gap it replaced.
          printf '\n%s\n' '- `~/.claude/spawn-session`, `$WIKI/.wiki-gates.conf`, `bin/*.sh`, `engine/bin/doctor.sh`' >> "$D/USAGE.md"
          "$D/bin/lint-docs.sh" >/dev/null 2>&1 \
            && echo "  ok   consumer-side, templated and globbed paths are left alone" \
            || { echo "  FAIL the gate rejected paths that correctly do not exist here"; fail=1; }
          cp "$GITHUB_WORKSPACE/USAGE.md" "$D/USAGE.md"
          exit "$fail"

      - name: A worktree-taking skill cannot aim a step at git-ignored state
        run: |
          # The gate has to FAIL on the shape it exists for, or it is decoration. The shape:
          # a skill that takes a worktree tells the agent to touch a git-ignored path
          # without naming canonical. In the worktree that path is empty, so the step
          # reports nothing to do and passes — fail-open, and unobservable afterwards
          # because git-ignored growth shows up in no status, diff, or gate.
          fail=0
          T="$RUNNER_TEMP/lintdocs"; rm -rf "$T"; mkdir -p "$T"
          # adopt.d comes along because check 2 resolves USAGE.md's path-shaped references
          # from the root it is given: a fixture missing a directory the docs name would go
          # red on this step for a reason that has nothing to do with what it asserts.
          cp -R bin scaffold skills adopt.d USAGE.md "$T/"
          # a step that names the tree it means: clean
          "$T/bin/lint-docs.sh" >/dev/null 2>&1 \
            && echo "  ok   the shipped skills pass" \
            || { echo "  FAIL the shipped skills do not pass their own gate"; fail=1; }
          # the same step with canonical stripped: caught
          S="$T/skills/checkpoint/SKILL.md"
          printf '%s\n' '- prune `raw/sessions/` blocks once promoted' >> "$S"
          # `|| rc=$?`, not a bare assignment: this step runs under `bash -e`, where a
          # command substitution that exits non-zero aborts the step at the assignment —
          # so the failure this test is asserting would kill the test instead.
          rc=0; out="$("$T/bin/lint-docs.sh" 2>&1)" || rc=$?
          [ "$rc" -ne 0 ] \
            && echo "  ok   a step aimed at git-ignored state without canonical fails the gate" \
            || { echo "  FAIL the gate passed a step pointed at the wrong tree"; fail=1; }
          printf '%s' "$out" | grep -q 'raw/sessions/' \
            && echo "  ok   ...naming the path it caught" \
            || { echo "  FAIL the finding does not say which path"; fail=1; }
          exit "$fail"

      - name: Crossover fail-closed smoke test
        run: |
          # crossover's safety property is that a LOSSY PASTE CAN NEVER AUTHORIZE A DELETE:
          # integrity rides on the per-item sha256 + batch bundle hash, never on the
          # block's framing. Pin that here — the last-item flush used to depend on the
          # trailing ##END, so dropping that one optional-looking line lost the item and
          # aborted under `set -u` (#19, fixed incidentally by the #30 split-export rework).
          O="$RUNNER_TEMP/xo/origin"; mkdir -p "$O/memory"
          printf -- '---\ntitle: Test note\nboundary: work\n---\n\nBody text.\n' > "$O/memory/test-note.md"
          ./bin/crossover.sh export --vault "$O" --batch CI1 memory/test-note.md > "$RUNNER_TEMP/xo/block.txt"

          # (a) intact block round-trips and verifies
          D="$RUNNER_TEMP/xo/d-intact"; mkdir -p "$D"
          ./bin/crossover.sh import --vault "$D" < "$RUNNER_TEMP/xo/block.txt" | grep -qx 'status all-verified' \
            || { echo "intact block did not verify"; exit 1; }

          # (b) trailing ##END dropped — the payload is unchanged, so it must STILL verify
          #     (and must not abort): the terminator is framing, not integrity.
          grep -v '^##END$' "$RUNNER_TEMP/xo/block.txt" > "$RUNNER_TEMP/xo/no-end.txt"
          D="$RUNNER_TEMP/xo/d-noend"; mkdir -p "$D"
          ./bin/crossover.sh import --vault "$D" < "$RUNNER_TEMP/xo/no-end.txt" | grep -qx 'status all-verified' \
            || { echo "block without trailing ##END failed to import"; exit 1; }

          # (c) truncated payload — must fail CLOSED: incomplete receipt, item named as
          #     hash-mismatch, and nothing written into the destination vault.
          N=$(wc -l < "$RUNNER_TEMP/xo/no-end.txt")
          sed -n "1,$((N-1))p" "$RUNNER_TEMP/xo/no-end.txt" > "$RUNNER_TEMP/xo/cut.txt"
          D="$RUNNER_TEMP/xo/d-cut"; mkdir -p "$D"
          ./bin/crossover.sh import --vault "$D" < "$RUNNER_TEMP/xo/cut.txt" > "$RUNNER_TEMP/xo/receipt.txt"
          grep -qx 'status incomplete' "$RUNNER_TEMP/xo/receipt.txt" \
            || { echo "truncated payload did not fail closed"; exit 1; }
          grep -q 'status hash-mismatch' "$RUNNER_TEMP/xo/receipt.txt" \
            || { echo "truncated payload was not diagnosed as hash-mismatch"; exit 1; }
          [ ! -e "$D/memory/test-note.md" ] \
            || { echo "truncated payload wrote a file into the destination"; exit 1; }

      - name: Link-integrity gate behaviour
        run: |
          # The gate's value is entirely in WHICH links it errors on, so pin both
          # directions: a near-miss must fail, a genuine stub must not, and a link
          # inside a code span of any backtick width must be invisible.
          V="$RUNNER_TEMP/lg"; mkdir -p "$V/notes" "$V/memory"
          mk() { printf -- '---\ntitle: %s\nboundary: personal\n---\n%s\n' "$1" "$2" > "$V/$3"; }
          mk real  'real page'                                    memory/pi-cluster.md
          mk real2 'real page'                                    memory/machine-sync.md

          # (a) rename shape: edit distance alone does NOT catch this (~0.71 similarity)
          mk t 'see [[project-pi-cluster]] and [[machine-sync]]'  notes/t.md
          ./bin/lint-links.sh --wiki "$V" | grep -q 'project-pi-cluster.*rename' \
            || { echo "near-miss (rename shape) not detected"; exit 1; }
          ./bin/lint-links.sh --wiki "$V" >/dev/null 2>&1 \
            && { echo "near-miss did not fail the gate"; exit 1; } || true

          # (b) a genuine stub must stay a warning, not an error
          mk t 'see [[machine-sync]] and [[an-unwritten-note]]'   notes/t.md
          ./bin/lint-links.sh --wiki "$V" >/dev/null 2>&1 \
            || { echo "a genuine stub wrongly failed the gate"; exit 1; }

          # (c) code spans of 1/2/3 backticks are documentation, not links
          mk t 'a `[[zzz-one]]` b ``[[zzz-two]]`` c ```[[zzz-three]]``` d [[machine-sync]]' notes/t.md
          if ./bin/lint-links.sh --wiki "$V" | grep -q 'zzz-'; then
            echo "a wikilink inside a code span was treated as a link"; exit 1
          fi

      - name: A vault walk never descends into a session worktree
        run: |
          # REGRESSION: five tools walk "the vault's pages"; four carried their own prune
          # list and only one of the five excluded `.worktrees` — the root holding full
          # checkouts of OTHER BRANCHES, put there by the isolation feature itself. So with
          # any session open, the verified-status report double-counted every repo page (the
          # duplicate reporting that BRANCH's state), the umbrella lint ran its per-page
          # gates against a tree the commit was not about, a memory [[link]] resolved
          # because some other branch had the target, and the crossover sweep would have
          # REWRITTEN files in a checkout its session did not author.
          #
          # None of it reproduces in a quiet vault, which is exactly why it survived: the
          # affected runs are the ones made during a session that took isolation. The
          # fixture therefore has to hold a worktree open while it measures.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-walk"
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main
          T="$RUNNER_TEMP/walk"; rm -rf "$T"; mkdir -p "$T"; fail=0
          V="$T/v"; mkdir -p "$V/memory" "$V/repos" "$V/projects"
          printf -- '---\nboundary: personal\n---\n\n# v\n' > "$V/CLAUDE.md"
          mk() { printf -- '---\ntitle: %s\ntype: memory\nboundary: personal\nupdated: 2026-01-01\n---\n%s\n' "$1" "$2" > "$V/memory/$1.md"; }
          mk alpha 'links [[beta]] and [[gamma]]'
          mk beta  'links [[alpha]] and [[gamma]]'
          mk gamma 'links [[alpha]] and [[beta]]'
          git -C "$V" init -q .; git -C "$V" add -A; git -C "$V" commit -qm seed

          # a linked worktree standing in for a live session, holding a page that exists
          # ONLY there — the discriminating case: if a walk sees it, a dead link resolves
          git -C "$V" worktree add -q -b wt/probe "$V/.worktrees/probe" >/dev/null 2>&1
          printf -- '---\ntitle: only-on-branch\ntype: memory\nboundary: personal\nupdated: 2026-01-01\n---\nlinks [[alpha]] and [[beta]]\n' > "$V/.worktrees/probe/memory/only-on-branch.md"
          [ "$(find "$V/.worktrees" -name '*.md' | wc -l | tr -d ' ')" -gt 0 ] \
            && echo "  ok   fixture: the worktree holds pages for the walk to trip over" \
            || { echo "  FAIL fixture built no worktree pages, so this step proves nothing"; fail=1; }

          # 1. the page walk itself excludes the worktree root
          n="$(. "$GITHUB_WORKSPACE/bin/wiki-root-lib.sh"; vault_pages "$V" | grep -c '\.worktrees/' || true)"
          [ "$n" = "0" ] \
            && echo "  ok   vault_pages excludes the worktree root" \
            || { echo "  FAIL vault_pages returned $n page(s) from a session worktree"; fail=1; }

          # 2. a link that resolves ONLY on the branch must still read as a stub
          out="$("$GITHUB_WORKSPACE/bin/lint-memory.sh" --wiki "$V" 2>&1 || true)"
          printf '%s' "$out" | grep -q 'only-on-branch' \
            && { echo "  FAIL the memory lint saw a page that exists only on a branch"; fail=1; } \
            || echo "  ok   a branch-only page is not vault content"

          # 3. the grep excludes are non-empty and name the worktree root
          ex="$(. "$GITHUB_WORKSPACE/bin/wiki-root-lib.sh"; vault_grep_excludes)"
          printf '%s' "$ex" | grep -q '\-\-exclude-dir=\.worktrees' \
            && echo "  ok   the recursive-grep excludes cover it too (the write-side sweep)" \
            || { echo "  FAIL vault_grep_excludes omits .worktrees: [$ex]"; fail=1; }

          # 4. the gate that keeps the class closed must FAIL on a reintroduced private list
          cp "$GITHUB_WORKSPACE/bin/lint-docs.sh" "$T/lint-docs.sh"
          printf '#!/usr/bin/env bash\nfind "$WIKI" -type d \\( -name .git -o -name engine -o -name .obsidian -o -name .rag \\) -prune -o -type f -name "*.md" -print\n' > "$GITHUB_WORKSPACE/bin/_probe_walk.sh"
          "$GITHUB_WORKSPACE/bin/lint-docs.sh" >/dev/null 2>&1 \
            && { echo "  FAIL lint-docs passed a hand-rolled vault walk"; fail=1; } \
            || echo "  ok   lint-docs refuses a private prune list"
          rm -f "$GITHUB_WORKSPACE/bin/_probe_walk.sh"
          "$GITHUB_WORKSPACE/bin/lint-docs.sh" >/dev/null 2>&1 \
            && echo "  ok   ...and passes again once it is removed" \
            || { echo "  FAIL lint-docs stayed red after the probe was removed"; fail=1; }

          git -C "$V" worktree remove --force "$V/.worktrees/probe" >/dev/null 2>&1 || true
          exit "$fail"

      - name: A lint reports every note, and cannot end quietly short of its summary
        run: |
          # REGRESSION, and the SECOND instance of one pattern: an assignment from a
          # pipeline whose first command may legitimately match nothing, under `set -euo
          # pipefail`. `grep` exits 1 on no-match, pipefail carries it out, -e aborts the
          # assignment, and the loop stops there — so the FIRST note with no wikilinks
          # ended the run and every note sorting after it went unchecked.
          #
          # It is fail-OPEN despite exiting non-zero, because a lint already exits 1
          # whenever it finds an error: the status carries no news. What the abort takes
          # away is the summary line — the only statement of how many notes were checked —
          # so a truncated report reads exactly like a vault that got cleaner. And the note
          # that silences the linter is itself a note the linter wanted to complain about.
          #
          # Two properties are pinned here: zero wikilinks is REPORTED (not refused, not
          # fatal), and a run that dies mid-loop for any other reason says so on stderr
          # rather than ending with a shorter, clean-looking report.
          V="$RUNNER_TEMP/lm"; rm -rf "$V"; mkdir -p "$V/memory"; fail=0
          mk() { printf -- '---\ntitle: %s\ntype: memory\nboundary: personal\nupdated: 2026-01-01\n---\n%s\n' "$1" "$2" > "$V/memory/$1.md"; }
          mk aaa-linkless 'no links at all in this note'
          mk zzz-linked   'see [[aaa-linkless]] and [[some-stub]]'

          out="$(./bin/lint-memory.sh --wiki "$V" 2>&1 || true)"
          printf '%s\n' "$out"
          printf '%s' "$out" | grep -q 'only 0 outbound' \
            && echo "  ok   a linkless note is REPORTED, not fatal" \
            || { echo "  FAIL the linkless note produced no finding"; fail=1; }
          printf '%s' "$out" | grep -q '^zzz-linked$' \
            && echo "  ok   ...and the note sorting after it is still checked" \
            || { echo "  FAIL the run stopped at the linkless note"; fail=1; }
          printf '%s' "$out" | grep -q 'memory lint: 2 notes' \
            && echo "  ok   ...and the summary states the count that was checked" \
            || { echo "  FAIL no summary line — a truncated report reads as a clean one"; fail=1; }

          # the class, not the instance: force an abort mid-loop and require it to announce
          # itself. Without this, the next `set -e` abort in this family is silent again.
          # the copy needs the lib beside it: lint-memory sources wiki-root-lib.sh and
          # fails closed without it, which is correct for the tool and fatal for a fixture
          # that runs it out of tree.
          cp ./bin/wiki-root-lib.sh "$V/wiki-root-lib.sh"
          sed 's@^  # valid type$@  [ "$slug" != aaa-linkless ] || false@' ./bin/lint-memory.sh > "$V/aborting.sh"
          aout="$(bash "$V/aborting.sh" --wiki "$V" 2>&1 || true)"
          printf '%s' "$aout" | grep -qi 'ABORTED' \
            && echo "  ok   a run that dies mid-loop says the report is incomplete" \
            || { echo "  FAIL a truncated run ended quietly: [$aout]"; fail=1; }

          exit "$fail"

      - name: The run that adopts a release applies with THAT release's updater
        run: |
          # REGRESSION: update.sh checks out the new tag from the checkout it is executing
          # from, then runs another ~250 lines — adopt, the RAG re-sync, the repo page,
          # every printed remedy — as the PRE-UPDATE text. `git checkout` renames a temp
          # file over the path, so the path gets a new inode while the running shell keeps
          # its descriptor on the old one. Nothing is garbled (an in-place rewrite WOULD
          # splice; a rename does not), which is exactly why it went unnoticed: the run
          # reports the new version and behaves as the old one.
          #
          # The class it hides is self-referential and was met in the field — a defect in
          # update.sh is not exercised by the run that installs its fix, so the operator
          # meets the bug one more time with the release notes in hand saying it was fixed.
          #
          # The fixture puts a marker in ONLY the newer tag's update.sh, which is the one
          # assertion that cannot be satisfied by the old copy.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-reexec"
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main
          git config --global protocol.file.allow always
          T="$RUNNER_TEMP/reexec"; rm -rf "$T"; mkdir -p "$T"; fail=0

          git init -q "$T/e"; E="$T/e"
          cp -R "$GITHUB_WORKSPACE/bin" "$GITHUB_WORKSPACE/adopt.d" "$GITHUB_WORKSPACE/scaffold" "$E/"
          git -C "$E" add -A; git -C "$E" commit -qm v1; git -C "$E" tag v1.0.0
          printf 'echo "APPLY-PHASE-MARKER: v1.1.0 copy did the applying"\n' >> "$E/bin/update.sh"
          git -C "$E" add -A; git -C "$E" commit -qm v2; git -C "$E" tag v1.1.0

          V="$T/v"; git init -q "$V"; mkdir -p "$V/repos"
          printf -- '---\ntype: repo\nsources:\n  - repo: e\n    ref: v1.0.0\n    sha: 0000000\n    ingested: 2026-01-01\nboundary: personal\n---\n' > "$V/repos/e.md"
          git -C "$V" add -A; git -C "$V" commit -qm seed
          git -C "$V" submodule add -q "$E" engine; git -C "$V" commit -qm pin
          git -C "$V/engine" checkout -q v1.0.0; git -C "$V" add engine
          git -C "$V" commit -qm "pin v1.0.0" --no-verify

          # 1. the default: the adopted copy applies, once, and says so
          out="$(WIKI_PATH="$V" "$V/engine/bin/update.sh" 2>&1)"
          printf '%s\n' "$out" | grep -q 'APPLY-PHASE-MARKER' \
            && echo "  ok   the newly checked-out copy ran the apply phase" \
            || { echo "  FAIL the pre-update copy applied"; fail=1; }
          printf '%s\n' "$out" | grep -q "applying with v1.1.0's own tools" \
            && echo "  ok   ...and the hand-off is stated, not silent" \
            || { echo "  FAIL the hand-off is silent"; fail=1; }
          [ "$(printf '%s\n' "$out" | grep -c 'APPLY-PHASE-MARKER')" = "1" ] \
            && echo "  ok   ...exactly once — the sentinel stops a second re-exec" \
            || { echo "  FAIL the apply phase ran more than once"; fail=1; }

          # 2. the escape hatch preserves the old behaviour, and says which copy acted
          git -C "$V/engine" checkout -q v1.0.0
          out2="$(WIKI_PATH="$V" UPDATE_REEXEC=0 "$V/engine/bin/update.sh" 2>&1)"
          printf '%s\n' "$out2" | grep -q 'APPLY-PHASE-MARKER' \
            && { echo "  FAIL UPDATE_REEXEC=0 still re-exec'd"; fail=1; } \
            || echo "  ok   UPDATE_REEXEC=0 applies with the pre-update copy"
          printf '%s\n' "$out2" | grep -q "NOTE — the steps below ran from v1.0.0's copy" \
            && echo "  ok   ...and a stale applier is never silent again" \
            || { echo "  FAIL the run does not say which copy acted"; fail=1; }

          # 3. a release whose updater does not parse must not strand a half-updated vault:
          #    the pin is ALREADY advanced by then, so refusing to apply at all is worse
          #    than applying with the old text. Fall through, loudly.
          git -C "$E" checkout -q main
          printf 'if [ unterminated\n' >> "$E/bin/update.sh"
          git -C "$E" add -A; git -C "$E" commit -qm broken; git -C "$E" tag v1.2.0
          git -C "$V/engine" fetch -q origin --tags; git -C "$V/engine" checkout -q v1.0.0
          out3="$(WIKI_PATH="$V" "$V/engine/bin/update.sh" 2>&1)"
          printf '%s\n' "$out3" | grep -q 'does not parse' \
            && echo "  ok   an unparseable release is refused, loudly" \
            || { echo "  FAIL it was exec'd, or skipped in silence"; fail=1; }
          printf '%s\n' "$out3" | grep -q 'Staged: engine -> v1.2.0' \
            && echo "  ok   ...and the apply phase still ran from the old copy" \
            || { echo "  FAIL the vault was left mid-update"; fail=1; }

          exit "$fail"

      - name: The updater obeys the convention the engine mandates
        run: |
          # update.sh must touch canonical for the SUBMODULE (a gitlink cannot live in a
          # worktree) and must not touch it for TRACKED PAGES (which is what worktrees
          # exist to protect). It did both there, and printed a `commit -am` remedy that
          # the engine's own guard refuses — so the documented route was unfollowable and
          # its workaround, WIKI_WORKTREE=0, turns isolation off for the whole command.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-upd"
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main
          git config --global protocol.file.allow always   # local-path submodule add
          T="$RUNNER_TEMP/upd"; rm -rf "$T"; mkdir -p "$T"; fail=0
          VW="$GITHUB_WORKSPACE/bin/vault-worktree.sh"

          # (1) the guard judges the STAGED SET, not the tree
          git init -q "$T/g"; G="$T/g"; export WIKI_PATH="$G"
          git init -q "$T/sub"; printf 's\n' > "$T/sub/f"; git -C "$T/sub" add -A
          git -C "$T/sub" commit -qm s
          printf 'page\n' > "$G/page.md"; git -C "$G" add -A; git -C "$G" commit -qm seed
          git -C "$G" submodule add -q "$T/sub" engine; git -C "$G" commit -qm pin
          git -C "$T/sub" commit -q --allow-empty -m s2
          git -C "$G/engine" fetch -q origin; git -C "$G/engine" reset -q --hard origin/main

          git -C "$G" add engine
          ( cd "$G" && "$VW" guard >/dev/null 2>&1 ) \
            && echo "  ok   a submodule-pointer-only commit is allowed in canonical" \
            || { echo "  FAIL the one commit a worktree cannot make was refused"; fail=1; }
          printf 'peer edit\n' >> "$G/page.md"; git -C "$G" add page.md
          ( cd "$G" && "$VW" guard >/dev/null 2>&1 ) \
            && { echo "  FAIL a tracked file rode along with the pointer"; fail=1; } \
            || echo "  ok   ...and anything else staged beside it still refuses"
          git -C "$G" restore --staged page.md; git -C "$G" checkout -- page.md

          # (1b) THE REFUSAL NAMES A NON-LOSSY CARRY FOR THE WORK IT JUST STRANDED.
          # The guard can only decide once the work is STAGED — it reads the staged set to
          # permit the gitlink-only commit above — and `ensure` cuts a fresh branch off
          # origin/main carrying no working state. So the refusal leaves the operator holding
          # staged edits with no named way to move them, and the reflex rescue
          # (`git diff > patch`) reports UNSTAGED changes only: a 0-byte file, exit 0, and the
          # discard that follows takes the only copy, which was never a git object. Asserted
          # by RUNNING the line the guard prints, not by matching its wording — the property
          # is that the carry is non-lossy, and a better-worded fix must still pass.
          # `|| true` throughout this block: GitHub runs `run:` steps as `bash -e {0}`, so any
          # bare non-zero command aborts the STEP — including `msg="$(guard)"`, whose whole
          # point is a non-zero exit. An aborted step prints no assertion at all, which reads
          # as a silent pass on every check below it.
          git -C "$G" restore --staged engine || true   # clean index: only the operator's page
          printf 'PEER\n' > "$G/peer-untracked.txt"  # a concurrent session's work, untracked
          printf 'peer edit\n' >> "$G/page.md"       # ...and the operator's own edit, re-made
          git -C "$G" add page.md
          # PRECONDITIONS, asserted rather than assumed. The line above restored page.md, so
          # a fixture that forgot to re-make the edit stages NOTHING — and the guard still
          # refuses (rc=1) on an empty index, so rc alone cannot tell "feature missing" from
          # "fixture never armed". Both halves are checked, or this whole block reports a
          # uniform red that means neither.
          [ -n "$(git -C "$G" diff --cached --name-only)" ] \
            || { echo "  FAIL precondition: the fixture staged nothing — the subject was never armed"; fail=1; }
          rc=0; msg="$( cd "$G" && "$VW" guard 2>&1 )" || rc=$?
          [ "$rc" = 1 ] \
            || { echo "  FAIL precondition: guard exited $rc, not 1 — the fixture never armed it"; fail=1; }
          grep -q 'page\.md' <<<"$msg" \
            && echo "  ok   the refusal names the staged path the operator must carry" \
            || { echo "  FAIL the refusal never names the staged path"; fail=1; }
          grep -q 'git diff' <<<"$msg" \
            && echo "  ok   ...and warns off the empty-patch reflex" \
            || { echo "  FAIL the empty-patch reflex is never named"; fail=1; }
          # The `--` is not cosmetic: it is what makes the stash path-scoped. An unscoped
          # `git stash push` reads as a fix and passes every other check here, so require
          # the pathspec separator explicitly or the near-miss ships.
          line="$(grep -Eo 'git stash push[^#]*--[[:space:]][^#]*' <<<"$msg" | head -1)"
          if [ -z "$line" ]; then
            echo "  FAIL no runnable path-scoped stash line in the refusal"; fail=1
          else
            ( cd "$G" && eval "$line" >/dev/null 2>&1 ) \
              || { echo "  FAIL the stash line the guard printed did not run"; fail=1; }
            # Scoping is the whole point: `stash push --include-untracked` would take this
            # file and remove it from the peer's tree — the clobber the guard exists to
            # refuse, reintroduced by its own remedy.
            [ -f "$G/peer-untracked.txt" ] \
              && echo "  ok   running it leaves a peer's untracked file alone" \
              || { echo "  FAIL the carry it printed swept up a peer's work"; fail=1; }
            git -C "$G" worktree add -q -b wt/carry "$T/carry" 2>/dev/null || true
            git -C "$T/carry" stash pop --index -q 2>/dev/null || true
            grep -q 'peer edit' "$T/carry/page.md" 2>/dev/null \
              && echo "  ok   ...and the staged work arrives in the worktree" \
              || { echo "  FAIL the work did not survive the carry"; fail=1; }
            git -C "$G" worktree remove --force "$T/carry" 2>/dev/null || true
          fi
          rm -f "$G/peer-untracked.txt"
          git -C "$G" restore --staged page.md 2>/dev/null || true
          git -C "$G" checkout -- page.md 2>/dev/null || true
          # CONTROL: with nothing staged the advice must NOT appear, or it is boilerplate
          # rather than a reading of the state the guard actually found. `git commit <path>`
          # reaches this guard with an empty index, and there the work is NOT staged — so
          # `git diff` would in fact capture it and the warning would be wrong.
          printf 'unstaged\n' >> "$G/page.md"
          msg2="$( cd "$G" && "$VW" guard 2>&1 )" || true
          grep -q 'stash push' <<<"$msg2" \
            && { echo "  FAIL carry advice printed with nothing staged"; fail=1; } \
            || echo "  ok   control: no carry advice when nothing is staged"
          git -C "$G" checkout -- page.md || true

          # (2) update.sh does not write a tracked page into a shared checkout
          git init -q "$T/e"; E="$T/e"
          cp -R "$GITHUB_WORKSPACE/bin" "$GITHUB_WORKSPACE/adopt.d" "$GITHUB_WORKSPACE/scaffold" "$E/"
          git -C "$E" add -A; git -C "$E" commit -qm v1; git -C "$E" tag v1.0.0
          git -C "$E" commit -q --allow-empty -m v2; git -C "$E" tag v1.1.0
          V="$T/v"; git init -q "$V"; mkdir -p "$V/repos"
          printf -- '---\ntype: repo\nsources:\n  - repo: e\n    ref: v1.0.0\n    sha: 0000000\n    ingested: 2026-01-01\nboundary: personal\n---\n' > "$V/repos/e.md"
          git -C "$V" add -A; git -C "$V" commit -qm seed
          git -C "$V" submodule add -q "$E" engine; git -C "$V" commit -qm pin
          git -C "$V/engine" checkout -q v1.0.0; git -C "$V" add engine
          git -C "$V" commit -qm "pin v1.0.0" --no-verify
          before="$(git -C "$V" rev-parse HEAD:repos/e.md)"

          WIKI_PATH="$V" "$VW" ensure >/dev/null 2>&1        # a live session worktree
          out="$(WIKI_PATH="$V" "$V/engine/bin/update.sh" 2>&1 || true)"
          printf '%s\n' "$out" | tail -14
          [ "$(git -C "$V" hash-object repos/e.md)" = "$before" ] \
            && echo "  ok   the tracked page is untouched in the shared checkout" \
            || { echo "  FAIL update.sh wrote tracked content into canonical"; fail=1; }
          git -C "$V" diff --cached --name-only | grep -qx 'repos/e.md' \
            && { echo "  FAIL update.sh staged a tracked page in canonical"; fail=1; } \
            || echo "  ok   ...and nothing but the pointer is staged"
          printf '%s' "$out" | grep -q 'ref: v1.1.0' \
            && echo "  ok   the deferred edit is printed so it can be applied in the worktree" \
            || { echo "  FAIL the operator is not told what to apply"; fail=1; }
          printf '%s' "$out" | grep -q 'commit engine -m' \
            && echo "  ok   the remedy commits the pointer by path" \
            || { echo "  FAIL the remedy does not name the path"; fail=1; }
          # every surface that prints this instruction, not just the one that was reported:
          # update.sh, engine-version.sh, and the session banner all said `commit -am`.
          grep -rn "commit -am ['\"]*Bump engine" "$GITHUB_WORKSPACE/bin" \
            && { echo "  FAIL a remedy still says -am, which sweeps a peer's work"; fail=1; } \
            || echo "  ok   no tool prints a -am pin-bump remedy"

          # (2b) THE SAME VAULT WITH NOTHING OPEN must behave identically. The deferral was
          # keyed on linked worktrees EXISTING, but isolation being configured and a
          # worktree being open are different states — and between sessions the second is
          # false while the first stays true. In that ordinary state the page was written
          # and staged in canonical, where the guard then refused the only commit that
          # would land it, and the printed remedy was WIKI_WORKTREE=0: the workaround
          # v1.52.0 removed for the pin, reappearing one component over for the page. The
          # two runs must differ in nothing the caller did not ask about.
          for w in $(git -C "$V" worktree list --porcelain | awk '/^worktree /{print substr($0,10)}' | tail -n +2); do
            git -C "$V" worktree remove --force "$w" >/dev/null 2>&1 || true
          done
          git -C "$V" worktree prune >/dev/null 2>&1 || true
          [ "$(git -C "$V" worktree list --porcelain | grep -c '^worktree ')" = "1" ] \
            && echo "  ok   fixture now has no linked worktrees" \
            || { echo "  FAIL could not clear the fixture's worktrees"; fail=1; }
          [ -x "$V/.githooks/pre-commit" ] \
            && echo "  ok   ...and its gate is armed, as adoption leaves it" \
            || { echo "  FAIL fixture gate is not wired; the case under test cannot arise"; fail=1; }
          git -C "$V/engine" checkout -q v1.0.0
          before2="$(git -C "$V" hash-object repos/e.md)"
          out3="$(WIKI_PATH="$V" "$V/engine/bin/update.sh" 2>&1 || true)"
          [ "$(git -C "$V" hash-object repos/e.md)" = "$before2" ] \
            && echo "  ok   with isolation on and NO worktree open, the page is still deferred" \
            || { echo "  FAIL update.sh wrote into canonical because no worktree happened to be open"; fail=1; }
          git -C "$V" diff --cached --name-only | grep -qx 'repos/e.md' \
            && { echo "  FAIL ...and staged it in the tree whose gate refuses to commit it"; fail=1; } \
            || echo "  ok   ...and staged nothing but the pointer"
          printf '%s' "$out3" | grep -q 'ref: v1.1.0' \
            && echo "  ok   ...and told the operator what to apply" \
            || { echo "  FAIL the deferred values are not printed"; fail=1; }
          printf '%s' "$out3" | grep -q 'WIKI_WORKTREE=0' \
            && { echo "  FAIL the remedy tells the operator to turn the gate off"; fail=1; } \
            || echo "  ok   ...without recommending that isolation be disabled"

          # (2c) the deferral predicate itself, at both ends. It must follow the GATE, not
          # the worktree count: a vault that never wired one, or whose core.hooksPath
          # resolves to a missing directory (git treats that as "no hooks" and commits
          # without a word), can commit in canonical and must not have writes deferred
          # away from it.
          (
            . "$GITHUB_WORKSPACE/bin/wiki-root-lib.sh"
            g_armed="$(canonical_commit_gated "$V")"
            # a subshell, not a `VAR=x func` prefix: bash keeps such an assignment in
            # effect after a FUNCTION returns, which would silently disarm the next case
            g_off="$(WIKI_WORKTREE=0; canonical_commit_gated "$V")"
            hp_was="$(git -C "$V" config --local core.hooksPath)"
            git -C "$V" config --local core.hooksPath "$V/.nonexistent-hooks"
            g_inert="$(canonical_commit_gated "$V")"
            git -C "$V" config --local core.hooksPath "$hp_was"
            rc=0
            [ "$g_armed" = "1" ] || { echo "  FAIL an armed gate reads as ungated"; rc=1; }
            [ -z "$g_off" ]      || { echo "  FAIL WIKI_WORKTREE=0 still reads as gated"; rc=1; }
            [ -z "$g_inert" ]    || { echo "  FAIL an INERT hooksPath reads as gated"; rc=1; }
            [ "$rc" = "0" ] && echo "  ok   the predicate follows the gate: armed / opted-out / inert"
            exit "$rc"
          ) || fail=1

          # (3) NO REGRESSION for a vault without worktrees: canonical IS its working tree
          W="$(WIKI_PATH="$V" "$VW" ensure 2>/dev/null)"
          WIKI_PATH="$V" "$VW" gc "$W" >/dev/null 2>&1 || true
          git -C "$V/engine" checkout -q v1.0.0
          out2="$(WIKI_PATH="$V" WIKI_WORKTREE=0 "$V/engine/bin/update.sh" 2>&1 || true)"
          [ "$(git -C "$V" hash-object repos/e.md)" != "$before" ] \
            && echo "  ok   with no worktrees in play the page is written as before" \
            || { echo "  FAIL isolation-off lost the provenance bump"; fail=1; }

          exit "$fail"

      - name: Concurrency model (isolation, guard, serialization)
        run: |
          # Two sessions writing one vault. The property under test is that BOTH sets of
          # work survive and land in a linear history — the failure this exists to stop
          # is one session's `git add -A` sweeping up a peer's uncommitted work.
          # Isolate git config to a throwaway file. `git config --global` writes to the
          # REAL ~/.gitconfig, which is harmless on a runner that is destroyed minutes
          # later and decidedly not harmless when this block is extracted and executed on
          # a workstation to verify it — that silently replaced a machine's git identity
          # and misattributed two release commits. Keep this export when copying locally.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-cc"
          git config --global user.email ci@example.com
          git config --global user.name CI
          V="$RUNNER_TEMP/cc"; mkdir -p "$V/notes"
          git -C "$V" init -q .
          printf 'seed\n' > "$V/notes/seed.md"
          git -C "$V" add -A && git -C "$V" commit -qm seed && git -C "$V" branch -M main
          export WIKI_PATH="$V"
          A="$(WIKI_WT_SESSION=sess-A ./bin/vault-worktree.sh ensure 2>/dev/null)"
          B="$(WIKI_WT_SESSION=sess-B ./bin/vault-worktree.sh ensure 2>/dev/null)"
          [ "$A" != "$B" ] || { echo "two sessions got the same worktree"; exit 1; }

          # guard: canonical refused, worktree allowed
          (cd "$V" && WIKI_WT_SESSION=sess-A "$GITHUB_WORKSPACE/bin/vault-worktree.sh" guard) \
            && { echo "guard did not refuse a commit in canonical"; exit 1; } || true
          (cd "$A" && WIKI_WT_SESSION=sess-A "$GITHUB_WORKSPACE/bin/vault-worktree.sh" guard) \
            || { echo "guard wrongly refused a commit inside a worktree"; exit 1; }

          # both sessions commit independently, then integrate through the lock
          printf 'A work\n' > "$A/notes/a.md"; git -C "$A" add -A; git -C "$A" commit -qm "A work"
          printf 'B work\n' > "$B/notes/b.md"; git -C "$B" add -A; git -C "$B" commit -qm "B work"
          (cd "$A" && WIKI_WT_SESSION=sess-A "$GITHUB_WORKSPACE/bin/vault-worktree.sh" integrate >/dev/null 2>&1) \
            || { echo "A failed to integrate"; exit 1; }
          (cd "$B" && WIKI_WT_SESSION=sess-B "$GITHUB_WORKSPACE/bin/vault-worktree.sh" integrate >/dev/null 2>&1) \
            || { echo "B failed to integrate"; exit 1; }
          # NEITHER may be lost — this is the whole point
          [ -f "$V/notes/a.md" ] || { echo "session A's work was lost"; exit 1; }
          [ -f "$V/notes/b.md" ] || { echo "session B's work was lost"; exit 1; }

          # a real conflict must fail closed: canonical untouched, worktree recoverable
          printf 'A v2\n' > "$A/notes/x.md"; git -C "$A" add -A; git -C "$A" commit -qm "A x"
          (cd "$A" && WIKI_WT_SESSION=sess-A "$GITHUB_WORKSPACE/bin/vault-worktree.sh" integrate >/dev/null 2>&1)
          printf 'B v2\n' > "$B/notes/x.md"; git -C "$B" add -A; git -C "$B" commit -qm "B x"
          before="$(git -C "$V" rev-parse HEAD)"
          # `|| rc=$?`, not a bare call then `$?` — this step runs under `bash -e`, which
          # would abort on the expected non-zero before the status could be read.
          rc=0
          (cd "$B" && WIKI_WT_SESSION=sess-B "$GITHUB_WORKSPACE/bin/vault-worktree.sh" integrate >/dev/null 2>&1) || rc=$?
          [ "$rc" -eq 3 ] || { echo "expected exit 3 on rebase conflict, got $rc"; exit 1; }
          [ "$(git -C "$V" rev-parse HEAD)" = "$before" ] \
            || { echo "a failed integrate moved canonical HEAD"; exit 1; }
          git -C "$B" log --oneline -1 | grep -q "B x" \
            || { echo "the conflicting session lost its commit"; exit 1; }

          # integrate must not treat UNTRACKED files in canonical as dirty. Adoption
          # leaves empty node folders and the RAG index untracked there by design, so a
          # check that counted them would refuse every integrate — and a check that is
          # always red is a check that gets bypassed.
          mkdir -p "$V/untracked-dir" && printf 'x\n' > "$V/untracked-dir/x.md"
          printf 'C work\n' > "$A/notes/c.md"; git -C "$A" add -A; git -C "$A" commit -qm "A c"
          (cd "$A" && WIKI_WT_SESSION=sess-A "$GITHUB_WORKSPACE/bin/vault-worktree.sh" integrate >/dev/null 2>&1) \
            || { echo "integrate wrongly refused over untracked files in canonical"; exit 1; }
          # ...and a TRACKED modification blocks it only when the fast-forward would
          # actually CHANGE that path. This assertion used to be categorical — any tracked
          # dirt refused — which is broader than the danger and was guaranteed to fire,
          # because rag-capture.sh writes to canonical at SessionEnd. Same "always red"
          # failure as the untracked case just above, one notch deeper.
          # (a) NON-overlapping: must proceed, and must not disturb the edit.
          printf 'edited\n' >> "$V/notes/seed.md"
          printf 'D work\n' > "$A/notes/d.md"; git -C "$A" add -A; git -C "$A" commit -qm "A d"
          (cd "$A" && WIKI_WT_SESSION=sess-A "$GITHUB_WORKSPACE/bin/vault-worktree.sh" integrate >/dev/null 2>&1) \
            || { echo "integrate refused over tracked dirt on a path it does not touch"; exit 1; }
          grep -q 'edited' "$V/notes/seed.md" \
            || { echo "integrate clobbered an uncommitted canonical edit"; exit 1; }
          # (b) OVERLAPPING: must still refuse — narrowing the check must not disarm it.
          printf 'E work\n' >> "$A/notes/seed.md"; git -C "$A" add -A; git -C "$A" commit -qm "A seed"
          rc=0
          (cd "$A" && WIKI_WT_SESSION=sess-A "$GITHUB_WORKSPACE/bin/vault-worktree.sh" integrate >/dev/null 2>&1) || rc=$?
          [ "$rc" -eq 1 ] || { echo "integrate ignored an OVERLAPPING tracked modification (rc=$rc)"; exit 1; }
          grep -q 'edited' "$V/notes/seed.md" \
            || { echo "a refused integrate still clobbered the canonical edit"; exit 1; }
          git -C "$V" checkout -- notes/seed.md

      - name: ensure never silently hands back the canonical checkout
        run: |
          # The isolation is worthless if it can turn itself off quietly. Two regressions
          # are pinned here: an orphaned worktree dir (checkout survives, gitdir gone) used
          # to make `worktree add` fail and `ensure` return CANONICAL with exit 0 — the
          # shared tree, reported as success; and adoption's .gitkeep placeholders made
          # every worktree permanently un-retirable, which is what produced the orphans.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-en"
          git config --global user.email ci@example.com
          git config --global user.name CI
          V="$RUNNER_TEMP/en"; mkdir -p "$V/notes"
          git -C "$V" init -q .; printf 'seed\n' > "$V/notes/seed.md"
          git -C "$V" add -A; git -C "$V" commit -qm seed; git -C "$V" branch -M main
          export WIKI_PATH="$V"

          # (a) a .gitkeep placeholder must not block retirement
          W="$(WIKI_WT_SESSION=s1 ./bin/vault-worktree.sh ensure 2>/dev/null)"
          mkdir -p "$W/queries"; touch "$W/queries/.gitkeep"
          WIKI_WT_SESSION=s1 ./bin/vault-worktree.sh gc "$W" 2>&1 | grep -q 'gc removed 1' \
            || { echo ".gitkeep placeholder blocked retirement"; exit 1; }

          # (b) real untracked work must still block it
          W="$(WIKI_WT_SESSION=s2 ./bin/vault-worktree.sh ensure 2>/dev/null)"
          printf 'work\n' > "$W/notes/unsaved.md"
          WIKI_WT_SESSION=s2 ./bin/vault-worktree.sh gc "$W" 2>&1 | grep -q 'keeping' \
            || { echo "retired a worktree holding untracked work"; exit 1; }

          # (c) an orphaned dir is recovered, not fallen back from
          W="$(WIKI_WT_SESSION=s3 ./bin/vault-worktree.sh ensure 2>/dev/null)"
          printf 'precious\n' > "$W/notes/precious.md"
          rm -rf "$V/.git/worktrees/s3"; git -C "$V" worktree prune
          NEW="$(WIKI_WT_SESSION=s3 ./bin/vault-worktree.sh ensure 2>/dev/null)"; rc=$?
          [ "$rc" -eq 0 ] || { echo "orphan recovery failed (rc=$rc)"; exit 1; }
          [ "$NEW" != "$V" ] || { echo "ensure fell back to canonical instead of recovering"; exit 1; }
          ls "$V"/.worktrees/s3.orphaned-*/notes/precious.md >/dev/null 2>&1 \
            || { echo "orphan was discarded instead of moved aside"; exit 1; }

          # (d) a genuine failure exits NON-ZERO while still printing a usable path
          chmod 500 "$V/.worktrees"
          set +e
          OUT="$(WIKI_WT_SESSION=blocked ./bin/vault-worktree.sh ensure 2>/dev/null)"; rc=$?
          set -e
          chmod 755 "$V/.worktrees"
          [ "$rc" -ne 0 ] || { echo "ensure reported SUCCESS while handing back the shared tree"; exit 1; }
          [ "$OUT" = "$V" ] || { echo "fallback should still print the canonical path"; exit 1; }

      - name: queue surfaces pushed-but-unmerged proposal pull requests
        run: |
          # Proposal: queue-cannot-see-unmerged-proposal-prs — arrival is the MERGED file,
          # so between push and merge a proposal was visible to the consumer (SUBMITTED)
          # and invisible here. When it comes from a fork, only this end can merge it, so
          # it can sit forever with both ends behaving correctly.
          set -x
          STUB="$RUNNER_TEMP/ghstub"; mkdir -p "$STUB"
          cat > "$STUB/gh" <<'STUBEOF'
          #!/usr/bin/env bash
          cat <<'JSON'
          [{"number":101,"title":"proposal: brand-new-thing","headRefName":"proposal/brand-new-thing",
            "files":[{"path":"proposals/brand-new-thing.md"},{"path":"PROPOSALS.md"}]},
           {"number":103,"title":"chore: unrelated","headRefName":"y","files":[{"path":"bin/foo.sh"}]}]
          JSON
          STUBEOF
          sed -i 's/^          //' "$STUB/gh"; chmod +x "$STUB/gh"

          # (a) an open proposal PR is listed, and an unrelated PR is not
          out="$(PATH="$STUB:$PATH" ./bin/engine-proposal.sh queue 2>&1)"
          printf '%s\n' "$out" | grep -q "AWAITING MERGE — pushed" || { echo "no awaiting-merge section"; exit 1; }
          printf '%s\n' "$out" | grep -q "brand-new-thing" || { echo "open proposal PR not listed"; exit 1; }
          printf '%s\n' "$out" | grep -q "unrelated" && { echo "unrelated PR leaked into the queue"; exit 1; }

          # (b) a PR whose slug is ALREADY merged must not double-report
          cat > "$STUB/gh" <<'STUBEOF2'
          #!/usr/bin/env bash
          cat <<'JSON'
          [{"number":102,"title":"already merged","headRefName":"x",
            "files":[{"path":"proposals/SLUG.md"}]}]
          JSON
          STUBEOF2
          sed -i 's/^          //' "$STUB/gh"
          MERGED="$(basename "$(ls proposals/*.md | head -1)" .md)"
          sed -i "s/SLUG/$MERGED/" "$STUB/gh"; chmod +x "$STUB/gh"
          PATH="$STUB:$PATH" ./bin/engine-proposal.sh queue 2>&1 | grep -q "AWAITING MERGE — pushed" \
            && { echo "a merged slug was re-reported as awaiting merge"; exit 1; }

          # (c) it must say it could not look, never render an empty list as complete
          env PATH=/usr/bin:/bin ./bin/engine-proposal.sh queue 2>&1 \
            | grep -q "could not check" || { echo "missing-gh case did not say so"; exit 1; }
          QUEUE_NO_REMOTE=1 ./bin/engine-proposal.sh queue 2>&1 \
            | grep -q "may be incomplete" || { echo "skipped case did not warn"; exit 1; }
          echo "queue remote surface: lists, dedups, and degrades loudly — OK"

      - name: integrate reconciles canonical with origin before choosing a rebase base
        run: |
          # REGRESSION (proposal: vault-worktree-integrate-rebases-onto-stale-local-main):
          # integrate fetched origin/<main> and then rebased onto the LOCAL <main>, never
          # consulting what it fetched. A vault publishing by branch -> PR -> squash-merge
          # gets a NEW object on origin its local <main> is not an ancestor of, so every
          # integrate based work on a superseded history and printed success — leaving
          # canonical divergent and the NEXT publication unmergeable, far from the cause.
          #
          # No prior fixture involved a remote whose <main> moved independently, which is
          # why this shipped: the fixtures encoded a push-to-main consumer only.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-int"
          git config --global user.email ci@example.com
          git config --global user.name CI
          # Pin the default branch. Without it `git init --bare` leaves HEAD on `master`,
          # so a clone of that remote lands on an unborn `master` and `push origin main`
          # fails with "src refspec main does not match any". It passed locally only
          # because the author's global config sets init.defaultBranch — the fixture was
          # reading a setting from the developer's machine that CI's clean config lacks.
          git config --global init.defaultBranch main
          set -x   # fixture-heavy step: trace it, or a swallowed failure costs a run to locate
          VW="$GITHUB_WORKSPACE/bin/vault-worktree.sh"
          setup() {
            # Build the working repo with `init` + `remote add`, NOT by cloning the empty
            # bare one: a clone of an empty repository leaves an unborn HEAD, and whether
            # the later `branch -M main` yields a pushable ref depends on the git version.
            # It worked on the author's machine and failed on the runner, which is the
            # whole reason a fixture gets built from explicit state rather than inference.
            rm -rf "$RUNNER_TEMP/i9"; mkdir -p "$RUNNER_TEMP/i9"
            git init -q --bare "$RUNNER_TEMP/i9/remote"
            git init -q "$RUNNER_TEMP/i9/v"
            printf 'base\n' > "$RUNNER_TEMP/i9/v/index.md"
            git -C "$RUNNER_TEMP/i9/v" add -A
            git -C "$RUNNER_TEMP/i9/v" commit -qm init
            git -C "$RUNNER_TEMP/i9/v" branch -M main
            git -C "$RUNNER_TEMP/i9/v" remote add origin "$RUNNER_TEMP/i9/remote"
            if ! git -C "$RUNNER_TEMP/i9/v" push -q -u origin main; then
              echo "--- fixture diagnostics ---"
              git --version
              echo "GIT_CONFIG_GLOBAL=$GIT_CONFIG_GLOBAL"
              git -C "$RUNNER_TEMP/i9/v" status --porcelain -b || true
              git -C "$RUNNER_TEMP/i9/v" log --oneline -3 || echo "(no commits)"
              git -C "$RUNNER_TEMP/i9/v" branch -a || true
              exit 1
            fi
            export WIKI_PATH="$RUNNER_TEMP/i9/v"
          }
          squash_publish() {  # publish current main as a NEW object, as a squash-merge does
            git -C "$WIKI_PATH" push -q origin main:refs/heads/f1
            git clone -q "$RUNNER_TEMP/i9/remote" "$RUNNER_TEMP/i9/pub" 2>/dev/null
            git -C "$RUNNER_TEMP/i9/pub" checkout -q main
            git -C "$RUNNER_TEMP/i9/pub" merge --squash -q origin/f1 >/dev/null 2>&1
            git -C "$RUNNER_TEMP/i9/pub" commit -qm "squashed (#1)"
            git -C "$RUNNER_TEMP/i9/pub" push -q origin main
          }
          commit_in_wt() {    # $1 = session id; echoes the worktree path
            W="$(WIKI_WT_SESSION="$1" "$VW" ensure | tail -1)"
            printf '%s\n' "$1" >> "$W/notes.md"
            git -C "$W" add notes.md; git -C "$W" commit -qm "$1"
            echo "$W"
          }
          behind_count() { git -C "$WIKI_PATH" fetch -q origin main; git -C "$WIKI_PATH" rev-list --count HEAD..origin/main; }

          # (a) squash divergence: content-equal, history republished -> adopt and succeed
          setup
          W="$(commit_in_wt s1)"; (cd "$W" && WIKI_WT_SESSION=s1 "$VW" integrate >/dev/null)
          squash_publish
          W="$(commit_in_wt s2)"; (cd "$W" && WIKI_WT_SESSION=s2 "$VW" integrate >/dev/null) \
            || { echo "integrate refused a content-equal squash divergence"; exit 1; }
          [ "$(behind_count)" = "0" ] \
            || { echo "canonical still behind origin after integrate — stale base bug is back"; exit 1; }

          # (b) REAL divergence (content differs) must refuse, not silently pick a side
          setup
          git clone -q "$RUNNER_TEMP/i9/remote" "$RUNNER_TEMP/i9/o" 2>/dev/null
          git -C "$RUNNER_TEMP/i9/o" checkout -q -B main origin/main
          printf 'theirs\n' > "$RUNNER_TEMP/i9/o/up.md"
          git -C "$RUNNER_TEMP/i9/o" add -A; git -C "$RUNNER_TEMP/i9/o" commit -qm theirs
          git -C "$RUNNER_TEMP/i9/o" push -q origin main
          printf 'ours\n' > "$WIKI_PATH/local.md"
          git -C "$WIKI_PATH" add -A; git -C "$WIKI_PATH" commit -qm ours
          W="$(commit_in_wt s3)"; rc=0
          (cd "$W" && WIKI_WT_SESSION=s3 "$VW" integrate >/dev/null) || rc=$?
          [ "$rc" = "3" ] || { echo "expected exit 3 on real divergence, got $rc"; exit 1; }

          # (c) squash divergence with a DIRTY canonical must refuse — reset --hard would
          #     discard the uncommitted edit without complaint, so both guards are required
          setup
          W="$(commit_in_wt s4)"; (cd "$W" && WIKI_WT_SESSION=s4 "$VW" integrate >/dev/null)
          squash_publish
          printf 'UNCOMMITTED\n' >> "$WIKI_PATH/index.md"
          W="$(commit_in_wt s5)"; rc=0
          (cd "$W" && WIKI_WT_SESSION=s5 "$VW" integrate >/dev/null) || rc=$?
          [ "$rc" = "3" ] || { echo "expected exit 3 when canonical is dirty, got $rc"; exit 1; }
          grep -q UNCOMMITTED "$WIKI_PATH/index.md" \
            || { echo "uncommitted canonical edit was destroyed"; exit 1; }
          # (d) an UNTRACKED file in canonical must NOT block the adopt path: reset --hard
          #     leaves untracked files alone, so counting them would make this check
          #     permanently red in any vault that ever leaves a stray file behind.
          setup
          W="$(commit_in_wt s6)"; (cd "$W" && WIKI_WT_SESSION=s6 "$VW" integrate >/dev/null)
          squash_publish
          printf 'stray\n' > "$WIKI_PATH/untracked.txt"
          W="$(commit_in_wt s7)"; (cd "$W" && WIKI_WT_SESSION=s7 "$VW" integrate >/dev/null) \
            || { echo "an untracked file blocked the adopt path"; exit 1; }
          [ -f "$WIKI_PATH/untracked.txt" ] || { echo "untracked file was destroyed"; exit 1; }

          echo "integrate reconcile: squash-adopt, real-divergence refusal, dirty refusal, untracked-tolerated all OK"

      - name: Vault gate runs from a worktree, not just canonical
        run: |
          # REGRESSION: a hook that resolves engine/ from `--show-toplevel` is silently
          # inert inside a worktree, because a linked worktree carries no submodule. Since
          # checkpoint commits from a worktree by design, that made the gate skip exactly
          # the commits it was meant to cover. Assert the shipped hook resolves the
          # CANONICAL root and therefore actually runs there.
          # Own identity, isolated. This step used to work only because an earlier step's
          # `git config --global` leaked across the whole runner — precisely the cross-step
          # contamination the redirect removes. Depending on it was invisible until it went.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-wg"
          git config --global user.email ci@example.com
          git config --global user.name CI
          V="$RUNNER_TEMP/wg"; mkdir -p "$V/memory"
          git -C "$V" init -q .
          mkdir -p "$V/engine/bin" "$V/.githooks"
          # stand in for the engine submodule: a lint that always fails, so "did the gate
          # run?" is observable as a refused commit rather than inferred from silence
          printf '#!/usr/bin/env bash\necho "GATE RAN"; exit 1\n' > "$V/engine/bin/lint.sh"
          printf '#!/usr/bin/env bash\nexit 0\n' > "$V/engine/bin/vault-worktree.sh"
          chmod +x "$V/engine/bin/lint.sh" "$V/engine/bin/vault-worktree.sh"
          cp scaffold/pre-commit "$V/.githooks/pre-commit"; chmod +x "$V/.githooks/pre-commit"
          # Absolute, exactly as adopt.d/30 now writes it. Setting the old relative
          # `.githooks` here is what makes this step go red — see the reinstatement
          # check below, which proves that rather than asserting it.
          git -C "$V" config core.hooksPath "$V/.githooks"
          # engine/ must be ABSENT from the worktree, which is the whole point: a real
          # vault carries it as a submodule and `git worktree add` never populates it.
          # Ignoring it here reproduces that. Without this the fixture commits engine/ as
          # tracked content, the worktree gets a copy, and the test passes even with the
          # bug reinstated — which is exactly what happened on the first attempt.
          #
          # .githooks/ must be UNTRACKED for the same reason, one layer up. Adoption
          # creates it and never commits it (the engine does not commit into a consumer's
          # vault), so on a real vault it exists only in the canonical checkout. This
          # fixture used to leave it tracked, the worktree therefore got a copy, and a
          # relative core.hooksPath resolved there — so this test passed for two releases
          # while the shipped wiring was inert in every real worktree. Same false-fixture
          # shape as the engine/ line above, which is the point worth noticing.
          printf 'engine/\n.githooks/\n' > "$V/.gitignore"
          printf 'seed\n' > "$V/memory/seed.md"
          git -C "$V" -c core.hooksPath=/dev/null add -A
          git -C "$V" -c core.hooksPath=/dev/null commit -qm seed
          git -C "$V" branch -M main
          git -C "$V" worktree add -q "$V/../wg-wt" -b wt/probe main
          printf 'more\n' > "$RUNNER_TEMP/wg-wt/memory/more.md"
          git -C "$RUNNER_TEMP/wg-wt" add -A
          out="$(git -C "$RUNNER_TEMP/wg-wt" commit -m "from worktree" 2>&1 || true)"
          printf '%s\n' "$out" | grep -q "GATE RAN" \
            || { echo "the vault gate did NOT run from inside a worktree:"; printf '%s\n' "$out"; exit 1; }
          echo "ok: gate runs from a linked worktree with .githooks/ untracked"

          # LOAD-BEARING, PROVEN — not asserted. Each of the three shipped instances of
          # "the gate is inert and nothing says so" is reinstated in turn; every one must
          # make a worktree commit succeed ungated. A regression test for this class is
          # worth nothing unless it goes red for the bugs that actually happened, and the
          # v1.28.1 test's first version did not.
          probe() {  # $1 = label; commits in a fresh worktree, echoes whether the gate ran
            git -C "$V" worktree add -q "$RUNNER_TEMP/probe-$1" -b "wt/$1" main
            printf '%s\n' "$1" > "$RUNNER_TEMP/probe-$1/memory/$1.md"
            git -C "$RUNNER_TEMP/probe-$1" add -A
            git -C "$RUNNER_TEMP/probe-$1" commit -m "$1" 2>&1 || true
          }

          # (1) v1.34.0 — relative core.hooksPath, inert in every worktree
          git -C "$V" config core.hooksPath .githooks
          probe relhooks | grep -q "GATE RAN" \
            && { echo "FAIL: relative hooksPath did not disarm the gate — test is blind"; exit 1; } \
            || echo "ok: red when core.hooksPath is relative (v1.34.0 bug)"
          git -C "$V" config core.hooksPath "$V/.githooks"

          # (2) v1.28.1 — hook resolves engine/ from the WORKTREE root, which has no submodule
          sed 's#^CANON=.*#CANON="$ROOT"#' scaffold/pre-commit > "$V/.githooks/pre-commit"
          chmod +x "$V/.githooks/pre-commit"
          probe showtop | grep -q "GATE RAN" \
            && { echo "FAIL: worktree-root engine resolution did not disarm the gate"; exit 1; } \
            || echo "ok: red when the hook resolves engine/ from the worktree root (v1.28.1 bug)"

          # (3) v1.32.0 — the hook was never installed anywhere
          rm -f "$V/.githooks/pre-commit"
          probe nohook | grep -q "GATE RAN" \
            && { echo "FAIL: a missing hook did not disarm the gate"; exit 1; } \
            || echo "ok: red when no hook is installed at all (v1.32.0 bug)"
          cp scaffold/pre-commit "$V/.githooks/pre-commit"; chmod +x "$V/.githooks/pre-commit"

      - name: A generator writes the tree it is invoked from, never the shared canonical one
        run: |
          # REGRESSION: the index generators resolved their target as WIKI="$WIKI_PATH"
          # and never consulted cwd. $WIKI_PATH is a machine-global constant naming the
          # CANONICAL checkout, while vault-worktree.sh exists so a writing session never
          # touches that tree — so a bare invocation from inside a session worktree
          # regenerated the CANONICAL index.md, with exit 0 and a success line. Two
          # consequences: the regenerated index landed outside the branch whose page edit
          # required it, and the shared tree acquired an uncommitted modification that a
          # concurrent session's `git add -A` sweeps into a foreign commit — the exact
          # clobber worktrees prevent. Fail-open, so nothing surfaced it.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-gwt"
          git config --global user.email ci@example.com
          git config --global user.name CI
          ENGINE="$PWD"
          V="$RUNNER_TEMP/gwt"; rm -rf "$V"; mkdir -p "$V/projects"
          git -C "$V" init -q -b main .
          printf -- '---\nslug: alpha\nstatus: active\nsummary: canonical-only project\n---\n' > "$V/projects/alpha.md"
          printf -- '# index\n\n<!-- projects:start -->\n<!-- projects:end -->\n' > "$V/index.md"
          git -C "$V" add -A && git -C "$V" commit -qm seed
          WT="$V/.worktrees/sess"
          git -C "$V" worktree add -q -b wt/sess "$WT" main
          # A page that exists ONLY in the worktree, so "which tree did it scan?" is
          # observable in the output rather than inferred.
          printf -- '---\nslug: beta\nstatus: active\nsummary: worktree-only project\n---\n' > "$WT/projects/beta.md"

          run_gen() { ( cd "$1" && shift && WIKI_PATH="$V" bash "$@" ); }

          # (1) bare, from the worktree -> the WORKTREE's index, canonical untouched
          run_gen "$WT" "$ENGINE/bin/gen-projects-index.sh"
          grep -q 'beta' "$WT/index.md" \
            || { echo "FAIL: worktree index.md was not regenerated from the worktree's projects/"; exit 1; }
          [ -z "$(git -C "$V" status --porcelain -- index.md)" ] \
            || { echo "FAIL: the shared canonical tree was modified by a worktree invocation"; git -C "$V" status --short; exit 1; }
          echo "ok: bare invocation targets the worktree and leaves canonical clean"

          # (2) LOAD-BEARING, PROVEN — reinstate the pre-fix resolution and require the
          # assertions above to go RED. A regression test for a fail-open bug is worth
          # nothing unless it fails for the bug that actually happened.
          BUG="$RUNNER_TEMP/gwt-buggy"; rm -rf "$BUG"; cp -R "$ENGINE/bin" "$BUG"
          cat > "$BUG/wiki-root-lib.sh" <<'OLD'
          resolve_wiki_root() {
            [ -n "${1:-}" ] && { printf '%s\n' "$1"; return 0; }
            [ -n "${WIKI_PATH:-}" ] || { echo "error: set \$WIKI_PATH or pass --wiki DIR" >&2; return 1; }
            printf '%s\n' "$WIKI_PATH"
          }
          OLD
          git -C "$V" checkout -q -- index.md 2>/dev/null || true
          run_gen "$WT" "$BUG/gen-projects-index.sh" >/dev/null
          if [ -z "$(git -C "$V" status --porcelain -- index.md)" ]; then
            echo "FAIL: the old \$WIKI_PATH-only resolution did NOT dirty canonical — this test is blind"; exit 1
          fi
          echo "ok: red when the generator resolves \$WIKI_PATH regardless of cwd (the reported bug)"
          git -C "$V" checkout -q -- index.md

          # (3) the escape hatch still reaches canonical deliberately, from the worktree
          run_gen "$WT" "$ENGINE/bin/gen-projects-index.sh" --wiki "$V" >/dev/null
          [ -n "$(git -C "$V" status --porcelain -- index.md)" ] \
            || { echo "FAIL: --wiki \$WIKI_PATH no longer targets canonical"; exit 1; }
          git -C "$V" checkout -q -- index.md
          echo "ok: --wiki still overrides, so the old behaviour is preserved, not removed"

          # (4) cwd in an UNRELATED repository must NOT retarget. Engine development
          # happens inside other repos with $WIKI_PATH still exported; retargeting on
          # `--show-toplevel` alone would try to generate an index into whichever repo
          # the caller happened to be standing in. This is why the resolver compares
          # git-common-dir instead of trusting the toplevel.
          run_gen "$ENGINE" "$ENGINE/bin/gen-projects-index.sh" --check 2>&1 \
            | grep -q "$V/index.md" \
            || { echo "FAIL: an unrelated repo retargeted the generator away from \$WIKI_PATH"; exit 1; }
          echo "ok: an unrelated repository falls through to \$WIKI_PATH"

          # (5) cwd outside any repository falls through too (cron, a bare hook env)
          run_gen "$RUNNER_TEMP" "$ENGINE/bin/gen-projects-index.sh" --check 2>&1 \
            | grep -q "$V/index.md" \
            || { echo "FAIL: a non-repo cwd did not fall through to \$WIKI_PATH"; exit 1; }
          echo "ok: a cwd outside any repository falls through to \$WIKI_PATH"

          # (6) neither --wiki nor $WIKI_PATH still fails with the historical message,
          # rather than silently resolving something from cwd.
          out="$( cd "$WT" && env -u WIKI_PATH bash "$ENGINE/bin/gen-projects-index.sh" --check 2>&1 || true )"
          printf '%s\n' "$out" | grep -q 'set \$WIKI_PATH or pass --wiki' \
            || { echo "FAIL: unset \$WIKI_PATH no longer fails closed:"; printf '%s\n' "$out"; exit 1; }
          echo "ok: unset \$WIKI_PATH still fails closed"

          # (7) --stdout needs no vault at all, which the resolver must not have broken.
          env -u WIKI_PATH bash "$ENGINE/bin/gen-skills-index.sh" --stdout >/dev/null \
            || { echo "FAIL: gen-skills-index.sh --stdout now requires a vault"; exit 1; }
          echo "ok: --stdout still needs no vault"

      - name: A per-machine gate keeps its rules when the lint runs from a worktree
        run: |
          # REGRESSION: the foreign-boundary gate read its patterns from "$WIKI/<file>",
          # where $WIKI is the tree being linted. That file is git-ignored BY DESIGN —
          # tracking the identifiers a vault must reject would commit the very strings
          # the gate exists to keep out — and a git-ignored file is structurally absent
          # from every linked worktree. Meanwhile pre-commit lints the WORKTREE and
          # `vault-worktree.sh guard` refuses canonical commits, so every commit an
          # adopted vault makes was gated by a gate reading its rules from the one tree
          # that cannot hold them. It printed `not armed` and exited 0 — a deliberately
          # armed vault and an unconfigured one produced identical output. Vault CI could
          # not backstop it either: a fresh clone has no copy of an ignored file.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-seam"
          git config --global user.email ci@example.com
          git config --global user.name CI
          export CLAUDE_SETTINGS="$RUNNER_TEMP/settings-seam.json"
          ENGINE="$PWD"
          V="$RUNNER_TEMP/seamvault"; rm -rf "$V"
          ./bin/new-wiki.sh --path "$V" --boundary personal \
            --email ci@example.com --git-name CI --engine-url "$PWD" --no-link-skills --no-rag >/dev/null

          # Arm the gate the way a real vault does: a TRACKED seam declaring where the
          # patterns live, and a GIT-IGNORED patterns file that names them.
          printf 'foreign_boundary_patterns = .wiki-gates.local\n' > "$V/.wiki-gates.conf"
          printf '.wiki-gates.local\n.seam-ignored\n' >> "$V/.gitignore"
          printf 'ACME-INTERNAL\n' > "$V/.wiki-gates.local"
          # Two probes for the ignored-vs-tracked rule in (3), so that assertion depends
          # on files THIS step creates rather than on how the scaffolded .gitignore
          # happens to treat a seam file — which is what made an earlier version of this
          # test pass locally and die on the runner with an opaque `git rm` pathspec error.
          printf 'tracked\n'  > "$V/.seam-tracked"
          printf 'ignored\n'  > "$V/.seam-ignored"
          git -C "$V" check-ignore -q .wiki-gates.local \
            || { echo "FAIL: fixture is wrong — the patterns file is not git-ignored"; exit 1; }
          git -C "$V" check-ignore -q .seam-ignored \
            || { echo "FAIL: fixture is wrong — .seam-ignored is not git-ignored"; exit 1; }
          # A page that violates the pattern, committed like any other content.
          printf -- '---\ntitle: t\ntype: note\nboundary: personal\n---\n\nrefers to ACME-INTERNAL systems.\n\n[[a]] [[b]]\n' \
            > "$V/notes/offender.md"
          git -C "$V" add -A
          git -C "$V" -c core.hooksPath=/dev/null commit -qm "seam fixture"
          git -C "$V" ls-files --error-unmatch .seam-tracked >/dev/null 2>&1 \
            || { echo "FAIL: fixture is wrong — .seam-tracked was not committed"; exit 1; }
          WT="$RUNNER_TEMP/seam-wt"; rm -rf "$WT"
          git -C "$V" worktree add -q "$WT" -b wt/seam HEAD
          [ -f "$WT/.wiki-gates.local" ] \
            && { echo "FAIL: fixture is wrong — the ignored file reached the worktree"; exit 1; }
          [ -f "$WT/.seam-ignored" ] \
            && { echo "FAIL: fixture is wrong — .seam-ignored reached the worktree"; exit 1; }

          gate() { ./bin/lint.sh --wiki "$1" 2>&1 | sed -n '/=== foreign boundary ===/,/^$/p'; }

          # (1) linting the WORKTREE must arm the gate and catch the offender
          out="$(gate "$WT")"
          printf '%s\n' "$out" | grep -q 'not armed' \
            && { echo "FAIL: the gate is still unarmed when linting a worktree:"; printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out" | grep -q 'matches foreign-boundary pattern' \
            || { echo "FAIL: the gate armed but did not catch the offending page:"; printf '%s\n' "$out"; exit 1; }
          ./bin/lint.sh --wiki "$WT" >/dev/null 2>&1 \
            && { echo "FAIL: lint.sh exited 0 with a foreign-boundary violation present"; exit 1; }
          echo "ok: a worktree lint reads the canonical per-machine patterns and fails on a violation"

          # (2) LOAD-BEARING, PROVEN — reinstate the pre-fix lookup (seam files read from
          # $WIKI only) and require (1) to go RED. A regression test for a fail-open bug
          # is worth nothing unless it fails for the bug that actually happened.
          # A whole engine LAYOUT, not just bin/: lint.sh resolves scaffold/node-dirs.txt
          # and skills/ relative to its own directory, so a bin-only copy dies on an
          # unbound NODE_DIRS long before the gate runs — and that reads as "the bug did
          # not reproduce" when in truth nothing was tested. Exactly the blind-test shape
          # this assertion exists to prevent, met while writing the assertion.
          BUGROOT="$RUNNER_TEMP/seam-buggy"; rm -rf "$BUGROOT"; mkdir -p "$BUGROOT"
          cp -R "$ENGINE/bin" "$BUGROOT/bin"
          ln -s "$ENGINE/skills" "$BUGROOT/skills"
          ln -s "$ENGINE/scaffold" "$BUGROOT/scaffold"
          python3 - "$BUGROOT/bin/wiki-root-lib.sh" <<'PY'
          import sys
          p = sys.argv[1]; s = open(p).read()
          i = s.index('resolve_seam_file() {'); j = s.index('\n}\n', i) + 3
          s = s[:i] + 'resolve_seam_file() {\n  [ -f "$1/$2" ] && printf \'%s\\n\' "$1/$2"\n  return 0\n}\n' + s[j:]
          open(p, 'w').write(s)
          PY
          bug_out="$("$BUGROOT/bin/lint.sh" --wiki "$WT" 2>&1 | sed -n '/=== foreign boundary ===/,/^$/p')"
          printf '%s\n' "$bug_out" | grep -q 'not armed' \
            || { echo "FAIL: the old \$WIKI-only lookup did NOT disarm the gate — this test is blind:"; printf '%s\n' "$bug_out"; exit 1; }
          echo "ok: red when seam files are read from the linted tree only (the reported bug)"

          # (3) the fallback is gated on git-ignored-ness, NOT on mere absence — asserted
          # against the resolver directly, because the gate's own output cannot isolate
          # it: deleting .wiki-gates.conf only falls back to the ENGINE default filename,
          # which is the ignored file, so the gate stays armed for a reason that has
          # nothing to do with this rule. A TRACKED seam file a branch deleted must stay
          # deleted (or no branch could ever remove one), and — the case that matters most
          # — a file a tool is about to CREATE must not resolve to canonical and get
          # written outside the branch, which is the bug the generator fix just removed.
          . "$ENGINE/bin/wiki-root-lib.sh"
          git -C "$WT" rm -q .seam-tracked
          got="$(resolve_seam_file "$WT" .seam-tracked)"
          [ -z "$got" ] \
            || { echo "FAIL: a tracked seam file deleted on the branch resolved to $got"; exit 1; }
          got="$(resolve_seam_file "$WT" .seam-ignored)"
          [ "$got" = "$V/.seam-ignored" ] \
            || { echo "FAIL: an ignored-and-absent seam file did not resolve to canonical (got '$got')"; exit 1; }
          echo "ok: only ignored-and-absent falls back to canonical; tracked-and-deleted stays deleted"

          # (4) absent from BOTH trees is still honestly reported as unarmed
          mv "$V/.wiki-gates.local" "$V/.wiki-gates.local.bak"
          out="$(gate "$WT")"
          printf '%s\n' "$out" | grep -q 'not armed' \
            || { echo "FAIL: a genuinely absent patterns file was not reported unarmed:"; printf '%s\n' "$out"; exit 1; }
          echo "ok: absent from both trees still reports 'not armed' rather than passing silently"
          mv "$V/.wiki-gates.local.bak" "$V/.wiki-gates.local"

          # (5) the summary baseline is WRITTEN, so it must stay in the linted tree. If it
          # ever resolved to canonical, --seed-baseline would write outside the branch and
          # dirty a tree other sessions share — the bug the generator fix just removed.
          rm -f "$WT/.wiki-gates-summary-baseline" "$V/.wiki-gates-summary-baseline"
          printf -- '---\ntitle: p\ntype: project\nstatus: active\nsummary: still blocked on inputs\n---\n\n[[a]] [[b]]\n' \
            > "$WT/projects/vol.md"
          ./bin/lint-summary-volatility.sh --wiki "$WT" --seed-baseline >/dev/null 2>&1 || true
          [ -f "$WT/.wiki-gates-summary-baseline" ] \
            || { echo "FAIL: --seed-baseline did not write the linted tree"; exit 1; }
          [ -f "$V/.wiki-gates-summary-baseline" ] \
            && { echo "FAIL: --seed-baseline wrote the CANONICAL tree instead of the branch"; exit 1; }
          echo "ok: the written baseline stays in the linted tree, never canonical"

      - name: Adoption repairs a vault wired by an earlier release
        run: |
          # The upgrade path, end to end through the real adoption entry point: a vault
          # carrying the OLD relative core.hooksPath must come out of adoption armed, with
          # no manual step. Without this, every already-adopted vault keeps the broken
          # wiring forever — adoption only ever set hooksPath when it was UNSET, and on
          # these vaults it is set, to exactly the wrong value.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-upgrade"
          git config --global user.email ci@example.com
          git config --global user.name CI
          export CLAUDE_SETTINGS="$RUNNER_TEMP/settings-upgrade.json"
          V="$RUNNER_TEMP/upg"; mkdir -p "$V/memory"
          git -C "$V" init -q .
          printf 'engine/\n.githooks/\n' > "$V/.gitignore"
          printf 'seed\n' > "$V/memory/seed.md"
          git -C "$V" add -A && git -C "$V" commit -qm seed && git -C "$V" branch -M main
          # the state an earlier release left behind
          mkdir -p "$V/.githooks"
          cp scaffold/pre-commit "$V/.githooks/pre-commit"; chmod +x "$V/.githooks/pre-commit"
          git -C "$V" config core.hooksPath .githooks

          WIKI="$V" ENGINE="$PWD" ADOPT_LIB="$PWD/bin/adopt-lib.sh" ADOPT_CHECK="" \
            bash adopt.d/30-vault-git-hooks.sh
          got="$(git -C "$V" config --local core.hooksPath)"
          [ "$got" = "$V/.githooks" ] \
            || { echo "adoption did not repair the relative hooksPath (got '$got')"; exit 1; }
          echo "ok: relative hooksPath repaired to absolute"

          # ...and a foreign hooksPath is still never stolen (v1.28.0 property).
          git -C "$V" config core.hooksPath .myhooks
          WIKI="$V" ENGINE="$PWD" ADOPT_LIB="$PWD/bin/adopt-lib.sh" ADOPT_CHECK="" \
            bash adopt.d/30-vault-git-hooks.sh >/dev/null
          [ "$(git -C "$V" config --local core.hooksPath)" = ".myhooks" ] \
            || { echo "a foreign core.hooksPath was stolen"; exit 1; }
          echo "ok: a foreign hooksPath is left alone"

      - name: Ephemeral vaults must not touch the machine's real config
        run: |
          # A throwaway vault (test / CI / scratchpad) must never wire itself into the
          # machine's real settings.json or repoint its real skills dir — those outlive it: a
          # permanent SessionStart hook, or skill symlinks aimed at a directory that later
          # disappears (they keep resolving until it is cleaned, so nothing announces it).
          #
          # Drives apply-adopt.sh, NOT the steps directly, because that is where the
          # decision now lives. Two earlier in-step guards each failed silently: one tested
          # `[ -n "$CLAUDE_SETTINGS" ]`, which apply-adopt makes permanently true; the other
          # enumerated macOS-shaped temp prefixes and did not match this runner's own
          # temp dir — caught only because this test runs on a path neither author had.
          #
          # NOTE ON THE FIXTURE: $HOME is overridden here, which is what let the third bug
          # hide (see the per-surface step below). Every assertion in THIS step is about a
          # vault with NOTHING redirected, so the override is harmless — but it is exactly
          # why the next step deliberately does not override it.
          export HOME="$RUNNER_TEMP/fakehome"; mkdir -p "$HOME/.claude/skills"
          echo '{}' > "$HOME/.claude/settings.json"
          ln -sfn /real/engine/skills/checkpoint "$HOME/.claude/skills/checkpoint"
          V="$RUNNER_TEMP/ephem"; mkdir -p "$V"; ln -sfn "$GITHUB_WORKSPACE" "$V/engine"
          before_settings="$(cat "$HOME/.claude/settings.json")"
          before_link="$(readlink "$HOME/.claude/skills/checkpoint")"

          ./bin/apply-adopt.sh --wiki "$V" --force >/dev/null 2>&1 || true

          [ "$(cat "$HOME/.claude/settings.json")" = "$before_settings" ] \
            || { echo "an ephemeral vault wrote the real settings.json"; exit 1; }
          [ "$(readlink "$HOME/.claude/skills/checkpoint")" = "$before_link" ] \
            || { echo "an ephemeral vault repointed the machine's skill symlinks"; exit 1; }

          # ...but with BOTH surfaces redirected, wiring must STILL happen. A guard that is
          # merely broad is the same defect facing the other way.
          ./bin/apply-adopt.sh --wiki "$V" --force --settings "$RUNNER_TEMP/iso.json" >/dev/null 2>&1 || true
          [ -f "$RUNNER_TEMP/iso.json" ] \
            || { echo "isolated wiring was skipped too — the guard is too broad"; exit 1; }
          grep -q "$V" "$RUNNER_TEMP/iso.json" \
            || { echo "isolated wiring did not record the vault"; exit 1; }
          echo "ok: ephemeral vault contained; isolated wiring still works"

      - name: Containing one surface must not license writing the other
        run: |
          # REGRESSION: redirecting --settings is the DOCUMENTED way to contain a throwaway
          # vault, and it used to flip a single shared "may wire this machine" flag — which
          # licensed the skills step to repoint the machine's REAL skills dir at the
          # throwaway engine. The settings redirect isolates settings.json; nothing about it
          # isolates the skills directory. Hit live on a developer machine, not in CI,
          # because the step above overrides $HOME and so is more isolated than any real
          # invocation. THIS step deliberately leaves the real skills path in place.
          #
          # One flag per surface; each gated on ITS OWN redirect.
          export HOME="$RUNNER_TEMP/surfhome"; mkdir -p "$HOME/.claude/skills"
          ln -sfn /real/engine/skills/checkpoint "$HOME/.claude/skills/checkpoint"
          V="$RUNNER_TEMP/surfvault"; mkdir -p "$V"; ln -sfn "$GITHUB_WORKSPACE" "$V/engine"

          # (a) settings redirected, skills NOT — settings wiring proceeds, skills contained
          ./bin/apply-adopt.sh --wiki "$V" --force --settings "$RUNNER_TEMP/surf.json" >/dev/null 2>&1 || true
          [ "$(readlink "$HOME/.claude/skills/checkpoint")" = "/real/engine/skills/checkpoint" ] \
            || { echo "a settings redirect licensed repointing the machine's REAL skills dir"; exit 1; }
          [ -f "$RUNNER_TEMP/surf.json" ] \
            || { echo "settings wiring was skipped — per-surface gating is too broad"; exit 1; }

          # (b) both redirected — skills linking happens, into the REDIRECTED dir only
          D="$RUNNER_TEMP/surfskills"; mkdir -p "$D"
          CLAUDE_SKILLS_DIR="$D" ./bin/apply-adopt.sh --wiki "$V" --force \
            --settings "$RUNNER_TEMP/surf2.json" >/dev/null 2>&1 || true
          [ -L "$D/checkpoint" ] \
            || { echo "skills were not linked even with the skills dir redirected"; exit 1; }
          [ "$(readlink "$HOME/.claude/skills/checkpoint")" = "/real/engine/skills/checkpoint" ] \
            || { echo "the real skills dir was touched despite a redirect"; exit 1; }
          echo "ok: each surface gated on its own redirect, both directions"

      - name: A finished session must not be reported as a live peer
        run: |
          # REGRESSION: lease liveness was purely time-based (WIKI_LEASE_STALE_MIN, default
          # 120), so a session that had cleanly integrated and been gc'd still showed in
          # `peers` for up to two hours — and `gc` reported "reaped 0 dead lease(s)" with a
          # provably dead lease sitting right there. A registry that shows ghosts stops
          # being read. A session that finished leaves PROOF: worktree and branch both gone.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-lease"
          git config --global user.email ci@example.com
          git config --global user.name CI
          V="$RUNNER_TEMP/leasevault"; mkdir -p "$V/memory"; git -C "$V" init -q .
          printf 'seed\n' > "$V/memory/seed.md"
          git -C "$V" -c core.hooksPath=/dev/null add -A
          git -C "$V" -c core.hooksPath=/dev/null commit -qm seed
          git -C "$V" branch -M main
          WT="$GITHUB_WORKSPACE/bin/vault-worktree.sh"

          W="$(WIKI_PATH="$V" WIKI_WT_SESSION=ghost "$WT" ensure)"
          WIKI_PATH="$V" WIKI_WT_SESSION=ghost "$WT" lease memory/ >/dev/null 2>&1
          WIKI_PATH="$V" WIKI_WT_SESSION=ghost "$WT" peers | grep -q ghost \
            || { echo "a live session was not listed as a peer"; exit 1; }

          # Retire it exactly as a finished session does, then look again from ANOTHER
          # session. The heartbeat is seconds old, so only the structural test can catch it.
          WIKI_PATH="$V" WIKI_WT_SESSION=ghost "$WT" gc "$W" >/dev/null 2>&1 || true
          out="$(WIKI_PATH="$V" WIKI_WT_SESSION=observer "$WT" peers)"
          printf '%s\n' "$out" | grep -q ghost \
            && { echo "a finished session is still reported as a live peer:"; printf '%s\n' "$out"; exit 1; }

          # ...and gc must actually reap it rather than counting zero.
          gcout="$(WIKI_PATH="$V" WIKI_WT_SESSION=observer "$WT" gc 2>&1)"
          [ -e "$V/.worktrees/.leases/ghost.lease" ] \
            && { echo "gc left the dead lease on disk: $gcout"; exit 1; }

          # The OTHER direction: a session whose worktree still exists (crashed, not
          # finished) must STILL be treated as live, or the guard is too broad and the
          # whole point — warning about a real concurrent writer — is lost.
          W2="$(WIKI_PATH="$V" WIKI_WT_SESSION=crashed "$WT" ensure)"
          WIKI_PATH="$V" WIKI_WT_SESSION=crashed "$WT" lease memory/ >/dev/null 2>&1
          WIKI_PATH="$V" WIKI_WT_SESSION=observer "$WT" peers | grep -q crashed \
            || { echo "a session with a live worktree was wrongly reaped as finished"; exit 1; }
          echo "ok: finished sessions reaped immediately, crashed ones still reported live"

      - name: The session banner and the peers verb agree about who is live
        run: |
          # REGRESSION: session-banner.sh inlined its own walk over the lease files applying
          # the HEARTBEAT test alone, so a session whose worktree and branch were both gone
          # — the proof lease_finished() reads — was announced at session start as a live
          # peer while `peers`, run against the same directory seconds later, reported none.
          # Fail-open: nothing refuses and nothing is lost, but a warning that shows ghosts
          # stops being read, and the cost lands on the NEXT, genuine one. Both surfaces now
          # source bin/lease-lib.sh, so liveness is decided in one place for all of them.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-banner"
          git config --global user.email ci@example.com
          git config --global user.name CI
          V="$RUNNER_TEMP/bannervault"; mkdir -p "$V/memory"; git -C "$V" init -q .
          printf 'seed\n' > "$V/memory/seed.md"
          git -C "$V" -c core.hooksPath=/dev/null add memory/seed.md
          git -C "$V" -c core.hooksPath=/dev/null commit -qm seed
          git -C "$V" branch -M main
          WT="$GITHUB_WORKSPACE/bin/vault-worktree.sh"
          BAN="$GITHUB_WORKSPACE/bin/session-banner.sh"
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/bannercfg"   # no staleness cache: bare banner
          banner() { WIKI_PATH="$V" WIKI_WT_SESSION=observer "$BAN"; }

          W="$(WIKI_PATH="$V" WIKI_WT_SESSION=ghost "$WT" ensure)"
          WIKI_PATH="$V" WIKI_WT_SESSION=ghost "$WT" lease memory/ >/dev/null 2>&1

          # PRECONDITION, asserted rather than assumed: with a genuinely live peer the
          # banner MUST warn. Without this, the "no warning" assertions below pass just as
          # well on a banner that can never warn at all.
          out="$(banner)"
          if ! grep -q 'other session(s) writing' <<<"$out"; then
            echo "the banner did not warn about a LIVE peer — the fixture proves nothing: $out"; exit 1
          fi

          # Retire the worktree and the branch but LEAVE the lease file: what a session
          # leaves when it stops before releasing, and the state `gc` has not swept yet.
          # Its heartbeat is seconds old, so only the structural test can catch it.
          git -C "$V" worktree remove --force "$W"
          git -C "$V" branch -D wt/ghost >/dev/null
          if [ ! -f "$V/.worktrees/.leases/ghost.lease" ]; then
            echo "the fixture removed the lease itself — nothing left for the two to disagree about"; exit 1
          fi
          pout="$(WIKI_PATH="$V" WIKI_WT_SESSION=observer "$WT" peers)"
          if grep -q ghost <<<"$pout"; then echo "peers reported a finished session as live: $pout"; exit 1; fi
          out="$(banner)"
          if grep -q 'other session(s) writing' <<<"$out"; then
            echo "the banner disagrees with peers about a finished session: $out"; exit 1
          fi

          # The other direction, or the agreement is worthless: a CRASHED session (worktree
          # still on disk, fresh heartbeat) must still be counted by the banner.
          WIKI_PATH="$V" WIKI_WT_SESSION=crashed "$WT" ensure >/dev/null
          WIKI_PATH="$V" WIKI_WT_SESSION=crashed "$WT" lease memory/ >/dev/null 2>&1
          out="$(banner)"
          if ! grep -q '1 other session(s) writing' <<<"$out"; then
            echo "the banner lost a live peer: $out"; exit 1
          fi

          # ...and the clock still decides the leases the structural test cannot judge.
          lf="$V/.worktrees/.leases/crashed.lease"
          sed -i.bak 's/^heartbeat=.*/heartbeat=1/' "$lf"; rm -f "$lf.bak"
          out="$(banner)"
          if grep -q 'other session(s) writing' <<<"$out"; then
            echo "the banner counted a lease stale by the clock: $out"; exit 1
          fi
          echo "ok: banner and peers agree — finished, crashed and stale all decided in one place"

      - name: Adoption steps resolve their own engine assets
        run: |
          # REGRESSION (v1.28.0 -> v1.31.0): 30-vault-git-hooks.sh resolved its template as
          # "$ENGINE/../scaffold/pre-commit" — one directory too high, since ENGINE is the
          # engine ROOT — so it probed the CONSUMER's vault root, found nothing, and took
          # its `|| exit 0` branch. The pre-commit gate installed on NO vault for four
          # minor releases while every reporting surface said adopted.
          ./bin/lint-adopt-paths.sh

          # ...and the check must be capable of being RED, or it is decoration. Drive it
          # against fixtures it MUST reject — the original bad path, and a literal engine
          # path that does not resolve. Asserted every run, not once by whoever wrote it.
          F="$RUNNER_TEMP/adoptfix"; mkdir -p "$F/adopt.d" "$F/scaffold"
          printf '#!/usr/bin/env bash\nTMPL="$ENGINE/../scaffold/pre-commit"\n' > "$F/adopt.d/99-regress.sh"
          if ./bin/lint-adopt-paths.sh --engine "$F" >/dev/null 2>&1; then
            echo "the path checker ACCEPTED the original bug — it is not load-bearing"; exit 1
          fi
          printf '#!/usr/bin/env bash\nSRC="$ENGINE/scaffold/nope"\n' > "$F/adopt.d/99-regress.sh"
          if ./bin/lint-adopt-paths.sh --engine "$F" >/dev/null 2>&1; then
            echo "the path checker ACCEPTED an unresolvable engine path"; exit 1
          fi
          echo "ok: adopt.d paths resolve, and the checker rejects both failure shapes"

      - name: A bundled asset is installed, not silently skipped
        run: |
          # The behavioural half of the step above: assert the gate ACTUALLY LANDS on a
          # vault, and that a missing template FAILS LOUDLY instead of reporting adopted.
          # Presence and exit-0 both looked fine while the step did nothing, so this
          # asserts observable effects on disk, never the step's own silence.
          export HOME="$RUNNER_TEMP/hookhome"; mkdir -p "$HOME/.claude/skills"
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-hooks"
          git config --global user.email ci@example.com
          git config --global user.name CI

          V="$RUNNER_TEMP/hookvault"; mkdir -p "$V"; git -C "$V" init -q .
          ./bin/apply-adopt.sh --wiki "$V" --force --settings "$RUNNER_TEMP/hook.json" >/dev/null 2>&1 || true
          [ -x "$V/.githooks/pre-commit" ] \
            || { echo "the pre-commit gate was NOT installed"; exit 1; }
          cmp -s scaffold/pre-commit "$V/.githooks/pre-commit" \
            || { echo "the installed hook does not match the shipped template"; exit 1; }
          # ABSOLUTE, not the relative `.githooks` this asserted until v1.35.0. A relative
          # hooksPath is resolved against the working tree making the commit, so it meant
          # `<worktree>/.githooks` — a directory that does not exist, because .githooks/ is
          # never committed. This assertion passing was compatible with the gate running in
          # no worktree at all, which is where every permitted commit is made.
          [ "$(git -C "$V" config --local core.hooksPath)" = "$V/.githooks" ] \
            || { echo "core.hooksPath is not the vault's absolute .githooks: $(git -C "$V" config --local core.hooksPath)"; exit 1; }

          # ADD-ONLY, both halves: a hook the vault wrote is never overwritten, and a
          # hooksPath deliberately aimed elsewhere is never stolen.
          W="$RUNNER_TEMP/ownhook"; mkdir -p "$W/.githooks"; git -C "$W" init -q .
          printf '#!/usr/bin/env bash\n# mine\nexit 0\n' > "$W/.githooks/pre-commit"
          chmod +x "$W/.githooks/pre-commit"
          git -C "$W" config core.hooksPath .myhooks
          ./bin/apply-adopt.sh --wiki "$W" --force --settings "$RUNNER_TEMP/hook2.json" >/dev/null 2>&1 || true
          grep -q '# mine' "$W/.githooks/pre-commit" \
            || { echo "an existing hook was overwritten"; exit 1; }
          [ "$(git -C "$W" config --local core.hooksPath)" = ".myhooks" ] \
            || { echo "a foreign core.hooksPath was stolen"; exit 1; }

          # NEGATIVE: with the template gone the step must exit non-zero, NAME the path it
          # looked for, and leave .engine-adopted unwritten so the next session retries.
          # Run from a COPY — a recipe that renames a file in the checkout is not safe to
          # run on a developer's machine, only on a disposable runner.
          E="$RUNNER_TEMP/engbroken"; cp -R "$GITHUB_WORKSPACE" "$E"
          mv "$E/scaffold/pre-commit" "$E/scaffold/pre-commit.moved"
          B="$RUNNER_TEMP/brokenvault"; mkdir -p "$B"; git -C "$B" init -q .
          out="$("$E/bin/apply-adopt.sh" --wiki "$B" --force --settings "$RUNNER_TEMP/hook3.json" 2>&1 || true)"
          printf '%s\n' "$out" | grep -q '! step 30-vault-git-hooks.sh failed' \
            || { echo "a missing bundled asset did NOT fail the step:"; printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out" | grep -q "$E/scaffold/pre-commit" \
            || { echo "the failure did not name the resolved path:"; printf '%s\n' "$out"; exit 1; }
          [ ! -f "$B/.engine-adopted" ] \
            || { echo "the adoption marker was written despite a failed step"; exit 1; }

          # ...and the failure must reach the USER. apply-adopt always exits 0 and its
          # output goes to additionalContext (model-only), so without this a broken engine
          # still renders the ordinary green banner and the human hears nothing.
          if command -v jq >/dev/null 2>&1; then
            sm="$(WIKI_PATH="$B" CLAUDE_SETTINGS="$RUNNER_TEMP/hook3.json" "$E/bin/session-boot.sh" | jq -r '.systemMessage // ""')"
            printf '%s\n' "$sm" | grep -q 'engine adopt: .* FAILED' \
              || { echo "a failed adoption step never reached the user banner: [$sm]"; exit 1; }
          fi
          echo "ok: gate installs, add-only holds, a missing asset fails loudly and visibly"

      - name: Adoption marker stays keyed to the pinned version
        run: |
          # The property that makes the fix self-healing WITHOUT any epoch/marker-format
          # machinery: a corrected step can only reach a vault by moving the pin, and a
          # moved pin busts the fast path. Asserted behaviourally (does the hook come
          # back?) rather than by grepping for a flag name.
          export HOME="$RUNNER_TEMP/markhome"; mkdir -p "$HOME/.claude/skills"
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-mark"
          git config --global user.email ci@example.com
          git config --global user.name CI
          V="$RUNNER_TEMP/markvault"; mkdir -p "$V"; git -C "$V" init -q .
          S="$RUNNER_TEMP/mark.json"
          ./bin/apply-adopt.sh --wiki "$V" --force --settings "$S" >/dev/null 2>&1 || true
          PIN="$(git describe --tags --always)"

          # (a) a marker recording a DIFFERENT pin must NOT fast-path
          rm -rf "$V/.githooks"; echo "v0.0.1-stale" > "$V/.engine-adopted"
          ./bin/apply-adopt.sh --wiki "$V" --settings "$S" >/dev/null 2>&1 || true
          [ -f "$V/.githooks/pre-commit" ] \
            || { echo "a stale marker fast-pathed past the steps — the fix could never reach a vault"; exit 1; }

          # (b) ...and the fast path must still work, or the marker is pointless
          rm -rf "$V/.githooks"; printf '%s\n' "$PIN" > "$V/.engine-adopted"
          ./bin/apply-adopt.sh --wiki "$V" --settings "$S" >/dev/null 2>&1 || true
          [ ! -f "$V/.githooks/pre-commit" ] \
            || { echo "the marker fast path never engages — steps run on every session"; exit 1; }

          # (c) the UPDATE path ignores the marker outright
          ./bin/adopt.sh --wiki "$V" >/dev/null 2>&1 || true
          [ -f "$V/.githooks/pre-commit" ] \
            || { echo "adopt.sh honoured the marker; an updating vault would skip corrected steps"; exit 1; }
          echo "ok: marker is pin-keyed, fast path works both ways, update path forces"

      - name: Scaffolder + lint smoke test
        run: |
          # Isolate git config (see the concurrency step above) so extracting this block
          # and running it locally cannot touch the real ~/.gitconfig.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-scaffold"
          git config --global user.email ci@example.com
          git config --global user.name CI
          # NOTE: no `protocol.file.allow=always` here any more. new-wiki.sh now scopes
          # that exception to its own submodule-add when --engine-url is a local path, so
          # neither CI nor a developer's machine needs the global loosening.
          # Isolate settings so the wire/adopt path never mutates the real ~/.claude/settings.json.
          # ensure-hook keys the boot hook on WIKI_PATH; a throwaway vault would otherwise leave a
          # permanent, un-dedupable SessionStart hook. Keep this export when copying the recipe locally.
          export CLAUDE_SETTINGS="$RUNNER_TEMP/settings.json"
          VAULT="$RUNNER_TEMP/testvault"
          ./bin/new-wiki.sh --path "$VAULT" --boundary personal \
            --email ci@example.com --git-name CI --engine-url "$PWD" --no-link-skills --no-rag
          ./bin/lint.sh --wiki "$VAULT"
          ./bin/adopt.sh --check --wiki "$VAULT"

      - name: The order update.sh prints lands both the catalog and the pin
        run: |
          # THE BIND: index.md's skills catalog is generated from the PINNED engine, so a release
          # that ADDS a skill stales it — and the one-line remedy update.sh printed could not work.
          # Gitlink-only is allowed by the concurrency guard and fails lint on the drift; gitlink +
          # index.md is refused by the guard as a canonical commit. Neither staged set commits, and
          # the only remedies left were WIKI_WORKTREE=0 and --no-verify, which is a gate teaching
          # its user to bypass it.
          #
          # The bind is the SINGLE COMMIT, not either gate. Split it and each gate is satisfied on
          # its own terms, so NOTHING here relaxes a check — what was missing is the order, and this
          # asserts the printed order actually works, step by step, ending in a clean lint.
          RUNNER_TEMP="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
          fail=0
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-seq"
          git config --global user.email ci@example.com
          git config --global user.name CI
          export CLAUDE_SETTINGS="$RUNNER_TEMP/settings-seq.json"
          # A SELF-CONTAINED probe engine to clone from. The workspace checkout cannot serve as
          # origin here: `update.sh` runs `git fetch origin main --tags`, and a PR build checks out a
          # detached merge ref with no `main` for that fetch to resolve — the fetch failed, update
          # never advanced, and every step below then failed for a reason that had nothing to do with
          # the defect. Building the origin also keeps the probe tags out of the real repository.
          PE="$RUNNER_TEMP/probe-engine"; rm -rf "$PE"
          git clone -q "$PWD" "$PE"
          git -C "$PE" checkout -q -B main
          # TWO releases differing by ONE ADDED SKILL — the only release shape that stales the
          # catalog. Real tags, because update.sh advances tag-to-tag and RE-EXECS the new tag's own
          # copy of itself, so a fixture without them would exercise a different program. The base
          # tag gets its OWN commit: tagging the checked-out HEAD can land v90.0.0 on a commit that
          # already carries a real release tag, and `git describe` then reports THAT one, so update
          # compared v1.x to v90.x, called it a MAJOR bump and refused.
          git -C "$PE" commit -q --allow-empty -m "probe base"
          git -C "$PE" tag -f v90.0.0 >/dev/null
          mkdir -p "$PE/skills/zzprobeskill"
          printf -- '---\nname: zzprobeskill\ndescription: probe\nsummary: probe\n---\n# probe\n' \
            > "$PE/skills/zzprobeskill/SKILL.md"
          git -C "$PE" add skills/zzprobeskill/SKILL.md
          git -C "$PE" commit -q -m "probe release: add a skill"
          git -C "$PE" tag -f v90.1.0 >/dev/null

          V="$RUNNER_TEMP/seqvault"; rm -rf "$V"
          ./bin/new-wiki.sh --path "$V" --boundary personal --email ci@example.com --git-name CI \
            --engine-url "$PE" --no-link-skills --no-rag >/dev/null 2>&1

          [ -x "$V/.githooks/pre-commit" ] && [ -n "$(git -C "$V" config --get core.hooksPath)" ] \
            && echo "  ok   fixture: the write-time gate is armed" \
            || { echo "  FAIL fixture: no armed pre-commit — the bind cannot reproduce"; exit 1; }

          E="$V/engine"
          git -C "$E" checkout -q v90.0.0
          "$E/bin/gen-skills-index.sh" --wiki "$V" >/dev/null
          git -C "$V" add engine index.md
          git -C "$V" -c core.hooksPath=/dev/null commit -q -m "pin v90.0.0, catalog matching" >/dev/null 2>&1 || true
          "$E/bin/gen-skills-index.sh" --check --wiki "$V" >/dev/null 2>&1 \
            && echo "  ok   fixture: baseline pinned at v90.0.0 with a matching catalog" \
            || { echo "  FAIL fixture: baseline already drifted, so nothing below is a test"; exit 1; }

          out="$("$E/bin/update.sh" --wiki "$V" 2>&1)" || true
          printf '%s\n' "$out" | grep -q 'v90.0.0 -> v90.1.0' \
            && echo "  ok   update advanced the pin to the skill-adding release" \
            || { echo "  FAIL update did not advance: $(printf '%s' "$out" | head -3)"; fail=1; }

          printf '%s' "$out" | grep -qi 'catalog' \
            && echo "  ok   ...and names the catalog it just invalidated" \
            || { echo "  FAIL update said nothing about the catalog"; fail=1; }

          git -C "$V" diff --name-only | grep -q '^index.md$' \
            && { echo "  FAIL index.md was written into gated canonical"; fail=1; } \
            || echo "  ok   ...without writing it into gated canonical"

          # THE PRECONDITION FOR EVERYTHING BELOW: the pointer commit must still be refused here.
          # If it were not, the printed sequence would be pointless and the steps would pass for a
          # reason unrelated to the order they encode.
          git -C "$V" commit engine -m "premature" >/dev/null 2>&1 \
            && { echo "  FAIL the pointer commit succeeded BEFORE the catalog landed"; fail=1; } \
            || echo "  ok   the pointer commit is refused while the catalog is stale"

          echo "  -- running the printed sequence --"
          WORK="$(WIKI_PATH="$V" "$E/bin/vault-worktree.sh" ensure 2>/dev/null | tail -1)" || WORK=""
          { [ -n "$WORK" ] && [ -d "$WORK" ]; } \
            && echo "  ok   step 1: took a worktree" \
            || { echo "  FAIL step 1: no worktree"; exit "$((fail | 1))"; }

          "$E/bin/gen-skills-index.sh" --wiki "$WORK" >/dev/null 2>&1 \
            && echo "  ok   step 2: regenerated the catalog in the worktree" \
            || { echo "  FAIL step 2: could not regenerate in the worktree"; fail=1; }

          git -C "$WORK" commit -q index.md -m "Regenerate skills catalog" >/dev/null 2>&1 \
            && echo "  ok   step 3: committed it there" \
            || { echo "  FAIL step 3: the worktree commit was refused"; fail=1; }

          int_out="$( (cd "$WORK" && WIKI_PATH="$V" "$E/bin/vault-worktree.sh" integrate 2>&1) )" && irc=0 || irc=$?
          [ "$irc" = "0" ] \
            && echo "  ok   step 4: integrated to main" \
            || { echo "  FAIL step 4: integrate refused: $(printf '%s' "$int_out" | head -2)"; fail=1; }

          git -C "$V" add engine 2>/dev/null || true
          git -C "$V" commit engine -m "Bump engine to v90.1.0" >/dev/null 2>&1 \
            && echo "  ok   step 5: the pointer commit is accepted once the catalog has landed" \
            || { echo "  FAIL step 5: the pointer commit is still refused after the sequence"; fail=1; }

          # ...and the vault ends clean, which is the whole claim.
          "$E/bin/lint.sh" --wiki "$V" >/dev/null 2>&1 \
            && echo "  ok   the vault lints clean at the end of the sequence" \
            || { echo "  FAIL the vault is still failing lint after the full sequence"; fail=1; }

          exit "$fail"


      - name: Skill-coverage matches the documented name, not an incidental word
        run: |
          # The coverage check was an unanchored `grep -q "$name"` over USAGE.md, so a skill
          # whose name is an ordinary word passed on any incidental mention: `drain` matched
          # "drainable" in an unrelated table row and the gate reported full coverage for a
          # skill nobody had documented. Same class of false pass the engine keeps finding —
          # a check that cannot distinguish its subject from a coincidence.
          fail=0
          tmp="$RUNNER_TEMP/skillcov"; rm -rf "$tmp"; mkdir -p "$tmp"
          probe="$GITHUB_WORKSPACE/skills/zzprobeskill"
          mkdir -p "$probe"
          printf -- '---\nname: zzprobeskill\ndescription: probe\n---\n# probe\n' > "$probe/SKILL.md"

          # an incidental mention of the bare word must NOT satisfy coverage
          cp "$GITHUB_WORKSPACE/USAGE.md" "$tmp/USAGE.bak"
          printf '\nA sentence mentioning zzprobeskill in passing.\n' >> "$GITHUB_WORKSPACE/USAGE.md"
          "$GITHUB_WORKSPACE/bin/lint-docs.sh" >/dev/null 2>&1 \
            && { echo "  FAIL an incidental mention counted as documentation"; fail=1; } \
            || echo "  ok   an incidental mention does not count as documentation"

          # the documented form does
          cp "$tmp/USAGE.bak" "$GITHUB_WORKSPACE/USAGE.md"
          printf '\n- **`zzprobeskill`** — documented properly.\n' >> "$GITHUB_WORKSPACE/USAGE.md"
          "$GITHUB_WORKSPACE/bin/lint-docs.sh" >/dev/null 2>&1 \
            && echo "  ok   ...and the backticked name does" \
            || { echo "  FAIL a properly documented skill still failed"; fail=1; }

          cp "$tmp/USAGE.bak" "$GITHUB_WORKSPACE/USAGE.md"; rm -rf "$probe"
          "$GITHUB_WORKSPACE/bin/lint-docs.sh" >/dev/null 2>&1 \
            && echo "  ok   ...and the repo is green once the probe is removed" \
            || { echo "  FAIL lint-docs stayed red after cleanup"; fail=1; }
          exit "$fail"

      - name: A flat list chunks on item boundaries, not on size
        run: |
          # A heading-less log — one `# ` title, a long flat list of dated entries — had no
          # structure for the `##`/`###` levels to find, so it fell through to size packing
          # and filled every chunk to the embedder's cap. Measured on a real log: 187
          # self-contained entries, median 1,475 chars, packed ~2.9 to a chunk at a median
          # 5,115. Nothing was LOST — that is the v1.55.0 fix — but one vector then had to
          # represent three unrelated days, so a query phrased from memory ranked the diluted
          # chunk below shorter topical pages: present in the index, unreachable in practice.
          python3 - <<'PY'
          import sys; sys.path.insert(0, "bin")
          import rag_chunk, re
          fail = 0

          # a flat list page: 20 self-contained items, no headings
          items = "\n".join("- **2026-07-%02d** — entry %d about topic %d, %s" % (i+1, i, i, "x"*400) for i in range(20))
          open("/tmp/flat.md", "w").write("# Log\n\n" + items + "\n")
          ch = rag_chunk.parse_file("/tmp/flat.md")[2]
          sizes = sorted(len(t) for _, _, t in ch)
          med = sizes[len(sizes)//2]
          if med < rag_chunk.MAX_CHARS / 2:
              print("  ok   median chunk %d is near the item size, not the cap" % med)
          else:
              print("  FAIL median chunk %d — still packing to the cap" % med); fail = 1
          if all(len(t) <= rag_chunk.MAX_CHARS for _, _, t in ch):
              print("  ok   no chunk exceeds the embedder cap")
          else:
              print("  FAIL a chunk exceeds MAX_CHARS"); fail = 1

          # every recorded line must point at its own first line
          lines = open("/tmp/flat.md").read().split("\n")
          bad = [ln for _, ln, t in ch if lines[ln-1].strip() and lines[ln-1].strip() not in t]
          print("  ok   every chunk's line number names its own first line" if not bad
                else "  FAIL %d chunk(s) point at the wrong line" % len(bad))
          if bad: fail = 1

          # a continuation — indented text and a fence containing a bullet — stays with its item
          page = "# t\n\n- **a** one\n  ```\n  - not an item\n  ```\n  tail\n- **b** two\n"
          open("/tmp/fence.md", "w").write(page)
          fch = rag_chunk.parse_file("/tmp/fence.md")[2]
          if all(t.count("```") % 2 == 0 for _, _, t in fch):
              print("  ok   a fenced block inside an item is never split across chunks")
          else:
              print("  FAIL a fence was split"); fail = 1

          # STRUCTURED pages must be untouched: prose sections chunk exactly as before
          prose = "# t\n\n## one\n\n" + ("word " * 2000) + "\n\n## two\n\n" + ("word " * 2000) + "\n"
          open("/tmp/prose.md", "w").write(prose)
          new = [c[2] for c in rag_chunk.parse_file("/tmp/prose.md")[2]]
          orig = rag_chunk._split_items
          rag_chunk._split_items = lambda pairs: None          # pre-change behaviour
          old = [c[2] for c in rag_chunk.parse_file("/tmp/prose.md")[2]]
          rag_chunk._split_items = orig
          if new == old:
              print("  ok   a prose page chunks exactly as it did before")
          else:
              print("  FAIL the list level changed a page that is not a list"); fail = 1

          # an item LARGER than the cap must line-pack, never hard-slice mid-line
          big = "# t\n\n- **a** " + "\n  ".join("line %d %s" % (i, "y"*100) for i in range(120)) + "\n- **b** two\n"
          open("/tmp/big.md", "w").write(big)
          bch = rag_chunk.parse_file("/tmp/big.md")[2]
          if all(len(t) <= rag_chunk.MAX_CHARS for _, _, t in bch):
              print("  ok   an over-cap item is split within itself, still under the cap")
          else:
              print("  FAIL an over-cap item produced an over-cap chunk"); fail = 1
          # ...and the split falls on line boundaries: no chunk starts mid-word
          if all(not t[:1].isspace() for _, _, t in bch):
              print("  ok   ...on line boundaries, not mid-line")
          else:
              print("  FAIL a chunk began mid-line"); fail = 1

          # content is preserved: identical ignoring whitespace
          def flat(p):
              return re.sub(r"\s+", "", "".join(t for _, _, t in rag_chunk.parse_file(p)[2]))
          a = flat("/tmp/flat.md")
          rag_chunk._split_items = lambda pairs: None
          b = flat("/tmp/flat.md")
          rag_chunk._split_items = orig
          if a == b:
              print("  ok   every non-whitespace character survives the new split")
          else:
              print("  FAIL content changed: %d chars" % (len(b) - len(a))); fail = 1

          sys.exit(fail)
          PY

      - name: The hard slice cuts at a sentence end, not at a character count
        run: |
          # The LAST level of the split chain, and the only cut that cannot fall on a line
          # boundary. A vault whose append-only log writes each entry as ONE physical line
          # bottoms the chain out: `##` and `###` are absent, the item IS the unit, and LINE
          # packing cannot reduce a single line. So an over-cap entry reached a cut at a
          # character count — mid-sentence, often mid-word — and the remainder became its own
          # embedding of a fragment that means nothing alone. Filed as an IMPROVEMENT, and
          # ranked low by its reporter: 2 items in 265 on the page they measured, and
          # rag-build.sh already announces every occurrence. Fixed because the chain is
          # otherwise complete and the failure recurs by construction — log entries only
          # get longer.
          python3 - <<'PY'
          import sys, re; sys.path.insert(0, "bin")
          import rag_chunk
          from rag_chunk import parse_file, CHUNKER_VERSION
          from rag_embed import MAX_CHARS
          fail = 0
          L = MAX_CHARS

          # NO title line. The first chunk of a titled page is the title itself, and asserting
          # on chunks[0] there tests a five-character heading — it passed for a reason that had
          # nothing to do with slicing.
          sent = "The quick brown fox jumped over the lazy dog and kept running. "
          page = "- **2026-01-01 (entry)** \u2014 " + sent * ((L // len(sent)) + 40) + "\n"
          open("/tmp/slice-log.md", "w").write(page)
          ch = parse_file("/tmp/slice-log.md")[2]

          if len(ch) > 1: print("  ok   the over-cap single-line item was sliced")
          else: print("  FAIL the fixture never exceeded the cap \u2014 nothing below is a test"); fail = 1
          if all(len(t) <= L for _, _, t in ch): print("  ok   no chunk exceeds MAX_CHARS")
          else: print("  FAIL a chunk is over the embedder's cap"); fail = 1
          if re.search(r'[.!?]["\')\]]*\s*$', ch[0][2]): print("  ok   the first chunk ends on a completed sentence")
          else: print("  FAIL still cutting mid-sentence: ...%r" % ch[0][2][-60:]); fail = 1

          squash = lambda s: re.sub(r"\s+", "", s)
          if squash("".join(t for _, _, t in ch)) == squash(page): print("  ok   every non-whitespace character survives")
          else: print("  FAIL characters were lost or duplicated"); fail = 1

          # No sentence end in the window must still cut EXACTLY at the cap, byte-for-byte as
          # before. That is the reporter's own acceptance criterion, and the reason no
          # word-boundary fallback was added on top of it.
          open("/tmp/slice-nb.md", "w").write("- **2026-01-01 (e)** \u2014 " + "x" * (L + 500) + "\n")
          nb = parse_file("/tmp/slice-nb.md")[2]
          if len(nb[0][2]) == L: print("  ok   with no boundary in the window, the cut stays at the cap")
          else: print("  FAIL an unbounded run no longer cuts at the cap: %d" % len(nb[0][2])); fail = 1

          # A page that never reaches the hard slice must be untouched by this change.
          st = "# T\n\n## A\n\n" + ("alpha beta gamma. " * 200) + "\n\n## B\n\n" + ("delta epsilon. " * 200) + "\n"
          open("/tmp/slice-st.md", "w").write(st)
          sc = parse_file("/tmp/slice-st.md")[2]
          if len(sc) >= 2 and all(len(t) <= L for _, _, t in sc): print("  ok   a heading-structured page still splits on its headings")
          else: print("  FAIL the structured page changed shape"); fail = 1

          if CHUNKER_VERSION >= 4: print("  ok   CHUNKER_VERSION bumped, so existing indexes re-chunk")
          else: print("  FAIL CHUNKER_VERSION not bumped \u2014 inert on every existing vault"); fail = 1
          sys.exit(fail)
          PY

      - name: A page without '##' headings is indexed whole, not just its first 6k
        run: |
          # REGRESSION: rag-build chunked on `## ` only, and rag_embed truncated every
          # chunk to 6000 chars. A page carrying no `##` — a flat `log.md`, one `# Log`
          # and 233k characters of dated bullets — became ONE chunk, of which ~2.5% was
          # embedded. The failure was invisible where it mattered: the record still
          # stored the WHOLE file's sha, so the reuse check reported it current and every
          # rebuild faithfully re-embedded the same stale prefix. Recall answered without
          # the vault's history and nothing said so.
          #
          # Two reasonable behaviours composing into silent loss, so the assertion is
          # about the composition: no chunk may exceed the embedder's own cap, and the
          # chunks must together cover the page. Pure python on purpose — no model, no
          # network, no venv, so the split is testable at all (it used to live inline in
          # rag-build.sh's heredoc, where nothing could reach it).
          fail=0
          export PYTHONPATH="$GITHUB_WORKSPACE/bin"
          W="$RUNNER_TEMP/chunkfix"; mkdir -p "$W"

          # A page shaped exactly like the one that broke: no `##` anywhere.
          python3 - "$W/log.md" <<'PY'
          import sys
          with open(sys.argv[1], "w") as f:
              f.write("# Log\n\n")
              for i in range(1, 2001):
                  f.write("- **2026-08-%02d** — entry %d, %s\n" % (i % 28 + 1, i, "x" * 120))
          PY

          # ── RED-BEFORE: the pre-fix split, reinstated ──────────────────────────────
          python3 - "$W/log.md" <<'PY'
          import sys
          raw = open(sys.argv[1]).read()
          lines = raw.splitlines()
          chunks, cur = [], []
          for ln in lines:
              if ln.startswith("## "):
                  chunks.append("\n".join(cur)); cur = [ln]
              else:
                  cur.append(ln)
          chunks.append("\n".join(cur))
          embedded = sum(len(c[:6000]) for c in chunks)      # what rag_embed would see
          print("  pre-fix: %d chunk(s), %d/%d chars embedded" % (len(chunks), embedded, len(raw)))
          if len(chunks) != 1 or embedded >= len(raw) * 0.10:
              sys.exit("  FAIL red-before did not reproduce the defect")
          PY
          [ $? -eq 0 ] && echo "  ok   red-before reproduces the one-chunk truncation" \
                       || { echo "  FAIL red-before"; fail=1; }

          # ── GREEN-AFTER: the shipped chunker ───────────────────────────────────────
          python3 - "$W/log.md" <<'PY' || exit 1
          import sys
          from rag_embed import MAX_CHARS
          from rag_chunk import parse_file, CHUNKER_VERSION

          path = sys.argv[1]
          body = open(path).read().splitlines()
          sha, boundary, chunks = parse_file(path)
          bad = 0

          if len(chunks) < 2:
              print("  FAIL still one chunk"); bad = 1
          over = [c for c in chunks if len(c[2]) > MAX_CHARS]
          if over:
              print("  FAIL %d chunk(s) exceed MAX_CHARS=%d" % (len(over), MAX_CHARS)); bad = 1
          else:
              print("  ok   %d chunks, none over MAX_CHARS=%d" % (len(chunks), MAX_CHARS))

          # every recorded line must name a real line, and be the line the chunk starts on
          for head, line, text in chunks:
              if not (1 <= line <= len(body)):
                  print("  FAIL line %d out of range" % line); bad = 1; break
              if not text.startswith(body[line - 1].strip()[:40]):
                  print("  FAIL chunk at line %d does not start there" % line); bad = 1; break
          else:
              print("  ok   every recorded line number points at its own first line")

          # coverage: a pointer index is worthless if it points at 2.5% of the page
          covered = sum(len(c[2]) for c in chunks)
          whole = len("\n".join(body[1:]).strip())
          if covered < whole * 0.98:
              print("  FAIL only %.1f%% of the page is embedded" % (100.0 * covered / whole)); bad = 1
          else:
              print("  ok   %.1f%% of the page is embedded" % (100.0 * covered / whole))

          if CHUNKER_VERSION < 2:
              print("  FAIL CHUNKER_VERSION must be bumped when the split changes"); bad = 1
          sys.exit(bad)
          PY
          [ $? -eq 0 ] || fail=1

          # A page that DOES use `##` must keep its exact pre-fix shape — one chunk per
          # section, plus the preamble before the first heading carrying the page title.
          # Asserted because it is the easy thing to break while fixing the split, and
          # because it silently re-chunks every page in every vault if it changes.
          printf '# T\n\n## Alpha\n\naaa\n\n## Beta\n\nbbb\n' > "$W/normal.md"
          python3 - "$W/normal.md" <<'PY' || fail=1
          import sys
          from rag_chunk import parse_file
          chunks = parse_file(sys.argv[1])[2]
          heads = [c[0] for c in chunks]
          lines = [c[1] for c in chunks]
          assert heads == ["T", "Alpha", "Beta"], heads
          assert lines == [1, 3, 7], lines
          print("  ok   `##` pages keep one chunk per section, preamble titled, lines exact")
          PY

          exit "$fail"

      - name: rag-build skips dot-directories and re-chunks when the chunker bumps
        run: |
          # TWO defects, one step, because both are about the index describing a tree it
          # does not actually have.
          #
          # (1) SKIP list. `.worktrees/` holds a full checkout of every page — that is the
          # whole point of per-session write isolation — and it was not in the skip set,
          # which enumerated names instead of skipping the class. A build run while any
          # session worktree existed indexed the vault twice and left half the index
          # pointing into a directory that is deleted at `gc`. Dangling pointers that
          # resolve fine until they don't.
          #
          # (2) REUSE predicate. It compared file sha and model. Change the chunker and
          # neither moves, so every existing vault would keep pre-fix chunking until each
          # file happened to change for some unrelated reason — the fix shipping inert,
          # which is how a fix becomes a claim. The chunker version now participates.
          fail=0
          # A stub embedder: this step is about which files get indexed and when vectors
          # are reused, not about vector quality — so it needs an endpoint, not a model.
          python3 - <<'PY' &
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class H(BaseHTTPRequestHandler):
              def do_POST(self):
                  self.rfile.read(int(self.headers.get('Content-Length', 0)))
                  b = json.dumps({"embedding": [0.1] * 8}).encode()
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(b)))
                  self.end_headers(); self.wfile.write(b)
              def log_message(self, *a): pass
          HTTPServer(('127.0.0.1', 8771), H).serve_forever()
          PY
          STUB=$!
          trap 'kill $STUB 2>/dev/null' EXIT
          for _ in $(seq 1 50); do
            python3 -c "import socket;socket.create_connection(('127.0.0.1',8771),0.2)" 2>/dev/null && break
            sleep 0.1
          done

          V="$RUNNER_TEMP/skipvault"; mkdir -p "$V/memory" "$V/.worktrees/sess/memory"
          printf -- '---\nboundary: personal\n---\n# v\n' > "$V/CLAUDE.md"
          printf -- '---\nboundary: personal\n---\n# Real\n\n## S\n\nreal content\n' > "$V/memory/real.md"
          cp "$V/memory/real.md" "$V/.worktrees/sess/memory/real.md"
          cp "$V/CLAUDE.md" "$V/.worktrees/sess/CLAUDE.md"

          export RAG_EMBED_API=ollama RAG_EMBED_URL=http://127.0.0.1:8771/api/embeddings
          ./bin/rag-build.sh --wiki "$V" >/dev/null 2>&1 || { echo "  FAIL build errored"; fail=1; }

          if grep -q '"file": *"\.worktrees' "$V/.rag/index.jsonl"; then
            echo "  FAIL a session worktree copy was indexed"; fail=1
          else
            echo "  ok   .worktrees/ is not indexed"
          fi

          # unchanged vault -> everything reused
          ./bin/rag-build.sh --wiki "$V" 2>&1 | grep -q '0 embedded' \
            && echo "  ok   an unchanged vault re-embeds nothing" \
            || { echo "  FAIL reuse did not kick in"; fail=1; }

          # strip cv from every record -> must NOT be reused, exactly as an existing
          # vault's pre-fix index will look on first run after this change
          python3 - "$V/.rag/index.jsonl" <<'PY'
          import json, sys
          p = sys.argv[1]
          out = []
          for line in open(p):
              r = json.loads(line); r.pop("cv", None); out.append(json.dumps(r))
          open(p, "w").write("\n".join(out) + "\n")
          PY
          ./bin/rag-build.sh --wiki "$V" 2>&1 | grep -q '0 embedded' \
            && { echo "  FAIL a pre-fix index was reused instead of re-chunked"; fail=1; } \
            || echo "  ok   an index without a chunker version is re-embedded"

          exit "$fail"

      - name: A spawn that did not happen is never reported as one
        run: |
          # spawn-session.sh composes an adapter the machine supplies, so the engine can
          # start a session elsewhere without knowing how one is started here. The whole
          # risk is in ONE direction: an accepted "run it separately" that reports a
          # handoff nobody performed is silently converted into a lost one — strictly
          # worse than never offering to spawn. So every way the adapter can fail to
          # produce a running session lands on the same printed-by-hand fallback, and
          # says which failure it was.
          # errexit OFF for this body, deliberately: almost every assertion here runs a
          # command whose EXPECTED result is a non-zero exit (3 = fell back to by-hand, 2 =
          # usage), so the harness default would abort on the first correct answer and report
          # one failure instead of all of them. The gate is `exit "$fail"` at the bottom; no
          # assertion is weakened by this, and every one of them still runs.
          set +e
          S="$GITHUB_WORKSPACE/bin/spawn-session.sh"
          T="$RUNNER_TEMP/spawn"; rm -rf "$T"; mkdir -p "$T/cfg" "$T/work"
          export CLAUDE_CONFIG_DIR="$T/cfg"
          export WIKI_ENGINE_SPAWN_TIMEOUT=2
          fail=0
          ck() { if [ "$1" = 0 ]; then echo "  ok   $2"; else echo "  FAIL $2"; fail=1; fi; }
          PROMPT=$'run the mining pass\nsecond line'

          # no adapter — the state of every machine that has not installed one
          export WIKI_ENGINE_SPAWN_ADAPTER="$T/cfg/absent-adapter"
          out="$("$S" --cwd "$T/work" --prompt "$PROMPT" --what 'the mining pass' 2>&1)"; rc=$?
          [ "$rc" -eq 3 ]; ck $? "no adapter: exits 3"
          printf '%s' "$out" | grep -q 'no session adapter installed'; ck $? "no adapter: names the missing adapter"
          printf '%s' "$out" | grep -q "$T/work"; ck $? "no adapter: fallback names the working directory"
          printf '%s' "$out" | grep -q 'run the mining pass'; ck $? "no adapter: fallback prints the prompt"
          printf '%s' "$out" | grep -q 'handle:'; [ $? -ne 0 ]; ck $? "no adapter: does NOT claim a spawn"

          # the happy path, and the argv contract the adapter is written against
          A="$T/cfg/ok"; cat > "$A" <<EOF
          #!/usr/bin/env bash
          printf '%s' "\$1" > "$T/got-cwd"
          printf '%s' "\$2" > "$T/got-prompt"
          printf '%s' "\${CLAUDE_SPAWN_DEPTH:-unset}" > "$T/got-depth"
          echo "pane:%7"
          EOF
          chmod +x "$A"; export WIKI_ENGINE_SPAWN_ADAPTER="$A"
          out="$("$S" --cwd "$T/work" --prompt "$PROMPT" --what 'the mining pass' 2>&1)"; rc=$?
          [ "$rc" -eq 0 ]; ck $? "adapter ok: exits 0"
          printf '%s' "$out" | grep -q 'handle: pane:%7'; ck $? "adapter ok: reports the handle"
          [ "$(cat "$T/got-cwd")" = "$T/work" ]; ck $? "adapter ok: received the exact working directory"
          [ "$(cat "$T/got-prompt")" = "$PROMPT" ]; ck $? "adapter ok: received the exact prompt, newline intact"
          [ "$(cat "$T/got-depth")" = "1" ]; ck $? "adapter ok: the child carries an incremented CLAUDE_SPAWN_DEPTH"

          # concurrency bound — the realistic double-spawn is a caller re-running this
          # after an output it read as ambiguous, which would start the same work twice
          rm -f "$T/got-cwd"
          out="$("$S" --cwd "$T/work" --prompt "$PROMPT" 2>&1)"; rc=$?
          [ "$rc" -eq 3 ]; ck $? "dedup: an identical spawn inside the window exits 3"
          printf '%s' "$out" | grep -q 'refusing to start it twice'; ck $? "dedup: says why"
          [ ! -e "$T/got-cwd" ]; ck $? "dedup: the adapter was never invoked"
          "$S" --cwd "$T/work" --prompt 'different work' >/dev/null 2>&1
          ck $? "dedup: a different prompt is not blocked"
          "$S" --cwd "$T/work" --prompt "$PROMPT" --force >/dev/null 2>&1
          ck $? "dedup: --force overrides"

          # every failure shape, all landing on the fallback rather than on a claim ------
          A="$T/cfg/boom"; printf '#!/usr/bin/env bash\necho "no pane available" >&2\nexit 9\n' > "$A"
          chmod +x "$A"; export WIKI_ENGINE_SPAWN_ADAPTER="$A"
          out="$("$S" --cwd "$T/work" --prompt 'p-boom' 2>&1)"; rc=$?
          [ "$rc" -eq 3 ]; ck $? "adapter fails: exits 3"
          printf '%s' "$out" | grep -q 'exited 9'; ck $? "adapter fails: names the exit status"
          printf '%s' "$out" | grep -q 'no pane available'; ck $? "adapter fails: relays its diagnosis"

          # a handle printed BEFORE a non-zero exit is the sharpest fail-open shape: the
          # adapter got far enough to name something and then did not start it
          A="$T/cfg/partial"; printf '#!/usr/bin/env bash\necho pane:9\nexit 1\n' > "$A"
          chmod +x "$A"; export WIKI_ENGINE_SPAWN_ADAPTER="$A"
          out="$("$S" --cwd "$T/work" --prompt 'p-partial' 2>&1)"; rc=$?
          [ "$rc" -eq 3 ]; ck $? "partial start: a handle printed before a non-zero exit is not a spawn"
          printf '%s' "$out" | grep -q 'handle: pane:9'; [ $? -ne 0 ]; ck $? "partial start: does not report the handle it printed"

          A="$T/cfg/silent"; printf '#!/usr/bin/env bash\nexit 0\n' > "$A"
          chmod +x "$A"; export WIKI_ENGINE_SPAWN_ADAPTER="$A"
          out="$("$S" --cwd "$T/work" --prompt 'p-silent' 2>&1)"; rc=$?
          [ "$rc" -eq 3 ]; ck $? "silent adapter: exit 0 with no handle is not a spawn"
          printf '%s' "$out" | grep -q 'named no handle'; ck $? "silent adapter: says the handle was missing"

          # an adapter that runs the session in the FOREGROUND would hold up the caller
          # with no status to attribute the stall to — the worst of the three outcomes
          A="$T/cfg/hang"; printf '#!/usr/bin/env bash\nsleep 60\n' > "$A"
          chmod +x "$A"; export WIKI_ENGINE_SPAWN_ADAPTER="$A"
          start="$(date +%s)"
          out="$("$S" --cwd "$T/work" --prompt 'p-hang' 2>&1)"; rc=$?
          took=$(( $(date +%s) - start ))
          [ "$rc" -eq 3 ]; ck $? "hanging adapter: exits 3"
          [ "$took" -lt 30 ]; ck $? "hanging adapter: bounded (took ${took}s against a ${WIKI_ENGINE_SPAWN_TIMEOUT}s cap)"
          printf '%s' "$out" | grep -q 'did not return within'; ck $? "hanging adapter: says it timed out"

          A="$T/cfg/noexec"; printf '#!/usr/bin/env bash\necho pane:2\n' > "$A"; chmod -x "$A"
          export WIKI_ENGINE_SPAWN_ADAPTER="$A"
          out="$("$S" --cwd "$T/work" --prompt 'p-noexec' 2>&1)"; rc=$?
          [ "$rc" -eq 3 ]; ck $? "non-executable adapter: exits 3"
          printf '%s' "$out" | grep -q 'not executable'; ck $? "non-executable adapter: names the reason"

          # re-entry sentinel — the engine's own rule for a deliberate spawn. A guard that
          # read a garbage depth as zero would be one that fails open, so it refuses.
          A="$T/cfg/depth"; printf '#!/usr/bin/env bash\ntouch "%s"\necho pane:1\n' "$T/depth-ran" > "$A"
          chmod +x "$A"; export WIKI_ENGINE_SPAWN_ADAPTER="$A"
          out="$(CLAUDE_SPAWN_DEPTH=2 "$S" --cwd "$T/work" --prompt 'p-depth' 2>&1)"; rc=$?
          [ "$rc" -eq 3 ]; ck $? "depth cap: refuses at the cap"
          [ ! -e "$T/depth-ran" ]; ck $? "depth cap: the adapter was never invoked"
          out="$(CLAUDE_SPAWN_DEPTH=notanumber "$S" --cwd "$T/work" --prompt 'p-depth2' 2>&1)"; rc=$?
          [ "$rc" -eq 3 ]; ck $? "depth cap: a non-numeric depth refuses rather than reading as zero"
          [ ! -e "$T/depth-ran" ]; ck $? "depth cap: still never invoked"


          # a knob read from the environment must be a number or it is not a bound at all:
          # `[ x -ge notanumber ]` returns non-zero, so a garbage timeout would disarm the
          # wait entirely rather than shortening it
          A="$T/cfg/depthg"; printf '#!/usr/bin/env bash\ntouch "%s"\necho pane:3\n' "$T/garbage-ran" > "$A"
          chmod +x "$A"; export WIKI_ENGINE_SPAWN_ADAPTER="$A"
          out="$(WIKI_ENGINE_SPAWN_MAX_DEPTH=abc CLAUDE_SPAWN_DEPTH=2 "$S" --cwd "$T/work" --prompt 'p-garbage' 2>&1)"; rc=$?
          [ "$rc" -eq 3 ]; ck $? "garbage knob: a non-numeric cap reverts to the default rather than disarming"
          printf '%s' "$out" | grep -q 'using the default'; ck $? "garbage knob: says it reverted"
          [ ! -e "$T/garbage-ran" ]; ck $? "garbage knob: the adapter was never invoked"

          # an adapter that traps TERM and declines to leave: `wait` on it would block
          # forever, so a timeout whose own cleanup is unbounded is not a timeout
          A="$T/cfg/stubborn"
          printf '#!/usr/bin/env bash\ntrap "" TERM\nsleep 60\n' > "$A"
          chmod +x "$A"; export WIKI_ENGINE_SPAWN_ADAPTER="$A"
          start="$(date +%s)"
          out="$("$S" --cwd "$T/work" --prompt 'p-stubborn' 2>&1)"; rc=$?
          took=$(( $(date +%s) - start ))
          [ "$rc" -eq 3 ]; ck $? "TERM-ignoring adapter: still exits 3"
          [ "$took" -lt 30 ]; ck $? "TERM-ignoring adapter: escalates to KILL and stays bounded (took ${took}s)"

          # a usage error is NOT the fallback: nothing was asked of any adapter
          "$S" --prompt 'x' >/dev/null 2>&1; [ $? -eq 2 ]; ck $? "usage: missing --cwd exits 2"
          "$S" --cwd "$T/nope" --prompt 'x' >/dev/null 2>&1; [ $? -eq 2 ]; ck $? "usage: a --cwd that does not exist exits 2"

          exit "$fail"

  # ---------------------------------------------------------------------------
  # The proposal round-trip is its own job for ONE reason: it needs full history
  # and tags (`fetch-depth: 0`) to see the `Proposal:` trailers and resolve a
  # commit to its release, and the checks job above must not pay for that on
  # every run. A depth-1 checkout would let every trailer check pass vacuously —
  # which is why lint-proposals.sh treats a shallow clone as a FAILURE rather
  # than silently skipping.
  proposals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ledger is well-formed and no trailer drifts from it
        run: ./bin/lint-proposals.sh

      - name: A released CHANGELOG heading has its tag
        run: ./bin/lint-changelog-tags.sh

      - name: The changelog-tag gate reddens on a skipped tag, not on a release in flight
        run: |
          # This gate's whole difficulty is the SECOND assertion below, not the first. Writing
          # the section precedes pushing the tag, so the entry being released has no tag for as
          # long as the release takes — and a gate blind to that would redden the merge that
          # RECORDS a release. This repo has shipped that defect twice already (a stale ledger
          # failing the arrival that staled it; the soft-wrap gate rejecting the proposals it
          # exists to receive), so proving the in-flight case stays GREEN matters more than
          # proving the skipped case goes red.
          fail=0
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/cl-gitconfig"
          git config --global user.email ci@example.com
          git config --global user.name CI
          FX="$RUNNER_TEMP/cl-fx"; rm -rf "$FX"; mkdir -p "$FX"
          E="$PWD"
          cd "$FX" && git init -q .

          mk(){ printf '# Changelog\n\n' > CHANGELOG.md
                for v in "$@"; do printf '## [%s] — 2026-01-01\n\nPatch — thing.\n\n' "$v" >> CHANGELOG.md; done
                git add CHANGELOG.md; git commit -qm "release $1"; }

          mk 1.0.0; git tag v1.0.0
          "$E/bin/lint-changelog-tags.sh" --repo . >/dev/null 2>&1 \
            && echo "  ok   a tagged release passes" \
            || { echo "  FAIL green baseline is already red"; fail=1; }

          # THE ONE THAT MATTERS: entry merged, tag not yet pushed.
          mk 1.1.0 1.0.0
          "$E/bin/lint-changelog-tags.sh" --repo . >/dev/null 2>&1 \
            && echo "  ok   a release IN FLIGHT stays green — the merge is not reddened" \
            || { echo "  FAIL the gate reddens the merge that records a release"; fail=1; }

          git tag v1.1.0
          "$E/bin/lint-changelog-tags.sh" --repo . >/dev/null 2>&1 \
            && echo "  ok   ...and still green once its tag is pushed" \
            || { echo "  FAIL green after tagging"; fail=1; }

          # Now skip one: ship 1.2.0 while 1.1.0 never got its tag.
          mk 1.2.0 1.1.0 1.0.0; git tag v1.2.0
          git tag -d v1.1.0 >/dev/null
          git rev-parse -q --verify refs/tags/v1.1.0 >/dev/null \
            && { echo "  FAIL fixture did not remove the tag — the red below proves nothing"; fail=1; } \
            || echo "  ok   fixture applied: 1.1.0 shipped past, with no tag"
          out="$("$E/bin/lint-changelog-tags.sh" --repo . 2>&1)" && rc=0 || rc=$?
          printf '%s\n' "$out" | grep -q '1\.1\.0 has a CHANGELOG section but no v1\.1\.0 tag' \
            && echo "  ok   ...gate names the skipped version" \
            || { echo "  FAIL gate silent on the skip: $out"; fail=1; }
          [ "$rc" != "0" ] || { echo "  FAIL gate exited 0 on a skipped tag"; fail=1; }

          # A shallow clone walks nothing. It must refuse, not report a clean pass.
          git clone -q --depth 1 "file://$FX" "$RUNNER_TEMP/cl-shallow"
          out="$("$E/bin/lint-changelog-tags.sh" --repo "$RUNNER_TEMP/cl-shallow" 2>&1)" && rc=0 || rc=$?
          printf '%s\n' "$out" | grep -q SHALLOW && [ "$rc" != "0" ] \
            && echo "  ok   a shallow clone is refused, not passed vacuously" \
            || { echo "  FAIL shallow clone was not refused: $out"; fail=1; }

          exit "$fail"

      - name: A shallow clone must FAIL, not pass vacuously
        run: |
          # The whole ledger gate rests on walking history. If a future checkout loses
          # fetch-depth: 0, every trailer check silently sees zero commits and goes green —
          # the same "check that can never be red" class this repo has now shipped fixes for
          # three times. Assert the tool refuses instead.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-shallow"
          git config --global user.email ci@example.com
          git config --global user.name CI
          git clone -q --depth 1 "file://$PWD" "$RUNNER_TEMP/shallow"
          # Capture, then grep. Actions runs `bash -eo pipefail`, so `lint | grep -q` takes
          # the FAILING lint's status and a matching grep still reads as a miss — which is
          # exactly how this step first went red against a tool that was working.
          L="$(./bin/lint-proposals.sh --repo "$RUNNER_TEMP/shallow" 2>&1 || true)"
          echo "$L"
          printf '%s' "$L" | grep -q "SHALLOW" \
            || { echo "FAIL: shallow clone did not report"; exit 1; }
          echo "ok: shallow clone is reported"
          ./bin/lint-proposals.sh --repo "$RUNNER_TEMP/shallow" >/dev/null 2>&1 \
            && { echo "FAIL: shallow clone passed"; exit 1; } || echo "ok: shallow clone exits non-zero"

      - name: status reports shipped / rejected / open / unknown correctly
        run: |
          # Behavioural fixture: a consumer vault pinned THREE releases behind an engine
          # that has since shipped one of its proposals, rejected another, and renamed a
          # third. Every state the skill promises a reporter is asserted here, including
          # the two that do not exist without this feature: a DECLINE reaching the
          # reporter at all, and `unknown` (never received) being distinguishable from
          # `open` (received, in progress).
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-proposals"
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main
          T="$RUNNER_TEMP/proposals"; mkdir -p "$T"
          fail=0
          chk() { if printf '%s' "$2" | grep -qF -- "$3"; then echo "  ok   $1"; else echo "  FAIL $1 — wanted: $3"; fail=1; fi; }

          SRC="$T/engine-src"; mkdir -p "$SRC"; git init -q "$SRC"
          cat > "$SRC/PROPOSALS.md" <<'EOF'
          # Proposals

          ## Ledger

          | slug | outcome | detail |
          |---|---|---|
          | `shipped-old` | shipped | derived |
          | `shipped-new` | shipped | derived |
          | `back-filled` | shipped | v1.0.0 |
          | `declined-thing` | rejected | the axis was wrong: a per-item cap cannot fix a volume failure |
          | `half-thing` | partially-accepted | shape taken, the marker machinery was not — it self-heals |
          | `open-thing` | open | filed 2026-01-01 |
          | `renamed-in` | alias | shipped-old |
          EOF
          git -C "$SRC" add -A && git -C "$SRC" commit -q -m ledger
          git -C "$SRC" commit -q --allow-empty -m "$(printf 'feat: old thing\n\nbody\n\nProposal: shipped-old\nCo-authored-by: X <x@y>\n')"
          git -C "$SRC" tag v1.0.0
          git -C "$SRC" commit -q --allow-empty -m middle
          git -C "$SRC" tag v1.5.0
          git -C "$SRC" commit -q --allow-empty -m "$(printf 'feat: new thing\n\nbody\n\nProposal: shipped-new\n')"
          git -C "$SRC" tag v2.0.0

          V="$T/vault"; mkdir -p "$V/.engine-proposal"
          git clone -q "$SRC" "$V/engine"
          git -C "$V/engine" checkout -q v1.0.0    # detached at the pin, as a submodule is
          for s in shipped-old shipped-new back-filled declined-thing half-thing open-thing renamed-in; do
            printf 'HANDOFF — engine improvement proposal\nslug: %s\n' "$s" > "$V/.engine-proposal/$s.outbox"
          done

          OUT="$(./bin/engine-proposal.sh status --vault "$V" 2>&1)"; echo "$OUT"
          chk "resolves past the pin"       "$OUT" "resolving against origin/main"
          chk "shipped at/below pin"        "$OUT" "SHIPPED in v1.0.0 — you already have it"
          chk "shipped ABOVE pin"           "$OUT" "SHIPPED in v2.0.0 — NEWER than your pin"
          chk "REJECTED is not open"        "$OUT" "REJECTED — the axis was wrong"
          chk "partially accepted"          "$OUT" "partially accepted — shape taken"
          chk "open says do not re-send"    "$OUT" "open — received and recorded upstream"
          chk "alias resolves to canonical" "$OUT" "recorded upstream under 'shipped-old'"

          OUT2="$(./bin/engine-proposal.sh status --vault "$V" --slug never-arrived 2>&1)"
          chk "unknown != open"             "$OUT2" "unknown — no row in the engine ledger"
          chk "unknown says re-send"        "$OUT2" "Re-sending is the right move"

          rm -f "$V/.engine-proposal/shipped-new.outbox"
          OUT3="$(./bin/engine-proposal.sh status --vault "$V" --slug shipped-new 2>&1)"
          chk "--slug without a local block" "$OUT3" "SHIPPED in v2.0.0"

          rm -f "$V"/.engine-proposal/*.outbox
          OUT4="$(./bin/engine-proposal.sh status --vault "$V" 2>&1)"
          chk "empty outbox is not a clean slate" "$OUT4" "not evidence that nothing is"

          if printf 'slug: real-slug\n' | ./bin/engine-proposal.sh stash --vault "$V" --slug other-slug >/dev/null 2>&1; then
            echo "  FAIL stash accepted a slug that disagrees with the block"; fail=1
          else echo "  ok   stash rejects filename/slug divergence"; fi

          # RETIREMENT (v1.46.0). `stash` still runs — deleting a documented subcommand from
          # a consumed component is breaking, and this engine reserves that for a MAJOR — but
          # it must SAY it is retired, and nothing may teach it any more. Both halves are
          # asserted, because a deprecation nobody sees is not a deprecation.
          printf 'slug: dep\nboundary: generic\n\nx\n' | ./bin/engine-proposal.sh stash --vault "$V" --slug dep 2>&1 \
            | grep -q 'is RETIRED' \
            && echo "  ok   stash warns that it is retired" \
            || { echo "  FAIL stash retired silently"; fail=1; }
          # the skill must not instruct anyone to use it (historical mentions are fine;
          # an imperative is not)
          grep -nE '^\s*[-*].*`stash`' skills/engine-proposal/SKILL.md | grep -viE 'retired' \
            && { echo "  FAIL the skill still prescribes stash"; fail=1; } \
            || echo "  ok   no skill instruction prescribes stash"
          # and submit/push must be what the skill actually tells you to run
          grep -q 'engine-proposal.sh submit' skills/engine-proposal/SKILL.md \
            && grep -q 'engine-proposal.sh push' skills/engine-proposal/SKILL.md \
            && echo "  ok   the skill teaches submit and push" \
            || { echo "  FAIL the skill does not teach the replacement"; fail=1; }

          # A slug displaced out of the final paragraph must still be RECOGNIZED. This is
          # the shape GitHub produces on every squash merge: it appends its own separator
          # and Co-authored-by footer AFTER the PR body, so the slug the author put last
          # is no longer last and %(trailers) returns nothing. The documented workflow
          # therefore produced a state lint rejected, detectable only after the merge —
          # when the sole remedy is rewriting published history. Placement is no longer
          # required; the literal line is authoritative. (#60)
          git -C "$SRC" commit -q --allow-empty -m "$(printf 'feat: squashed (#9)\n\nbody\n\nProposal: shipped-old\nCo-Authored-By: X <x@y>\n\n---------\n\nCo-authored-by: Y <y@z>\n')"
          git -C "$SRC" log -1 --format='%(trailers:key=Proposal,valueonly)' | grep -q . \
            && { echo "  FAIL fixture: git DID parse the trailer, so this proves nothing"; fail=1; } || true
          ./bin/lint-proposals.sh --repo "$SRC" >/dev/null 2>&1 \
            && echo "  ok   a slug displaced by GitHub's squash footer is still read" \
            || { echo "  FAIL lint rejects the shape its own workflow produces"; ./bin/lint-proposals.sh --repo "$SRC"; fail=1; }
          # ...and `status` must agree with lint, or a shipped proposal reads as unknown
          SO="$(./bin/engine-proposal.sh status --vault "$V" --slug shipped-old 2>&1)"
          printf '%s' "$SO" | grep -q "SHIPPED" \
            && echo "  ok   status resolves a displaced slug too" \
            || { echo "  FAIL status could not see the displaced slug:"; printf '%s\n' "$SO"; fail=1; }
          git -C "$SRC" reset -q --hard HEAD~1

          # A QUOTED example must NOT register as a citation. Under the old count-mismatch
          # scheme this errored loudly; reading literally would instead have silently
          # credited the quote, so quote-handling moved from "error out" to "don't look
          # inside fences". The slug is deliberately one with NO ledger row: if the fence
          # were read, lint would fail with "has no row in PROPOSALS.md", so a PASS here
          # can only mean the fenced line was skipped. An already-ledgered slug could not
          # discriminate — its real citation commit satisfies the check either way.
          git -C "$SRC" commit -q --allow-empty -m "$(printf 'docs: explain the convention\n\nCite it like this:\n\n```\nProposal: quoted-not-real\n```\n\nThat is all.\n')"
          ./bin/lint-proposals.sh --repo "$SRC" >/dev/null 2>&1 \
            && echo "  ok   a fenced example is not mistaken for a citation" \
            || { echo "  FAIL a quoted slug was credited as a real citation:"; ./bin/lint-proposals.sh --repo "$SRC"; fail=1; }
          # and the same line UNFENCED must still be caught, or the skip is too broad
          git -C "$SRC" reset -q --hard HEAD~1
          git -C "$SRC" commit -q --allow-empty -m "$(printf 'feat: ghost2\n\nProposal: quoted-not-real\n')"
          L="$(./bin/lint-proposals.sh --repo "$SRC" 2>&1 || true)"
          # Match the stable clause only. v1.44.1 reworded the sentence opener when the
          # citation check began resolving against the queue ("has no proposal in
          # proposals/ AND no row in ..."), which silently unhooked this assertion.
          printf '%s' "$L" | grep -q "no row in PROPOSALS.md" \
            && echo "  ok   the same slug unfenced is still caught" \
            || { echo "  FAIL fence-skipping swallowed a real citation"; fail=1; }
          git -C "$SRC" reset -q --hard HEAD~1

          git -C "$SRC" commit -q --allow-empty -m "$(printf 'feat: ghost\n\nProposal: not-in-ledger\n')"
          L="$(./bin/lint-proposals.sh --repo "$SRC" 2>&1 || true)"   # -e would abort on the expected failure
          printf '%s' "$L" | grep -q "no row in PROPOSALS.md" \
            && echo "  ok   lint catches a trailer with no ledger row" \
            || { echo "  FAIL lint missed an unledgered trailer"; fail=1; }
          git -C "$SRC" reset -q --hard HEAD~1

          ./bin/lint-proposals.sh --repo "$SRC" >/dev/null 2>&1 \
            && echo "  ok   lint passes on a well-formed ledger" \
            || { echo "  FAIL lint red on a clean fixture"; ./bin/lint-proposals.sh --repo "$SRC"; fail=1; }

          exit "$fail"

      - name: Boundary is asked of the vault, never named by the engine
        run: |
          # SCHEMA.md: each consuming wiki declares its own boundary; the engine is
          # boundary-agnostic. Two skills named a value anyway — one of them inside a
          # copy-me frontmatter template — and crossover.sh REWROTE every imported page
          # to a hardcoded literal. The consequence chain was silent end to end: a
          # mis-stamped page passes the boundary-present gate, is committed and indexed,
          # and is then dropped from semantic recall by rag-build's cross-boundary skip,
          # with no message anywhere. Latent, not observed — which is the point: the only
          # thing preventing it was a model resolving a contradiction correctly every time.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-bnd"
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main
          export CLAUDE_SETTINGS="$RUNNER_TEMP/settings-bnd.json"
          fail=0

          # A vault on a boundary the templates never named — the case that would break.
          V="$RUNNER_TEMP/bndvault"
          ./bin/new-wiki.sh --path "$V" --boundary work --email ci@example.com \
            --git-name CI --engine-url "$PWD" --no-link-skills --no-rag >/dev/null 2>&1
          [ "$(./bin/vault-boundary.sh --wiki "$V")" = "work" ] \
            || { echo "FAIL: vault-boundary did not read the declaration"; fail=1; }

          # A clean vault must PASS: a gate that is always red is one that gets bypassed.
          ./bin/lint.sh --wiki "$V" >/dev/null 2>&1 \
            && echo "  ok   clean vault passes the boundary-match gate" \
            || { echo "  FAIL clean vault is red"; ./bin/lint.sh --wiki "$V"; fail=1; }

          # ...and a mis-stamped page must FAIL, naming the file and both values.
          printf -- '---\ntitle: M\ncreated: 2026-01-01\nupdated: 2026-01-01\ntype: memory\ntags: [x]\nboundary: personal\n---\n\n# M\n\n[[a]] [[b]]\n' > "$V/memory/mis.md"
          out="$(./bin/lint.sh --wiki "$V" 2>&1 || true)"
          printf '%s' "$out" | grep -q "boundary: personal, but this vault declares work" \
            && echo "  ok   mis-stamped page is caught at write time" \
            || { echo "  FAIL mis-stamp passed the gate"; printf '%s\n' "$out"; fail=1; }
          rm -f "$V/memory/mis.md"

          # crossover must stamp the DESTINATION's boundary, not a literal. This is the
          # instance that lived in executable code rather than in skill prose.
          O="$RUNNER_TEMP/bndorigin"; mkdir -p "$O/memory"
          printf -- '---\ntitle: N\nboundary: personal\n---\n\nBody.\n' > "$O/memory/n.md"
          ./bin/crossover.sh export --vault "$O" --batch B1 memory/n.md > "$RUNNER_TEMP/bnd.txt" 2>/dev/null
          ./bin/crossover.sh import --vault "$V" < "$RUNNER_TEMP/bnd.txt" >/dev/null 2>&1
          grep -qx 'boundary: work' "$V/memory/n.md" \
            && echo "  ok   crossover stamps the destination's declared boundary" \
            || { echo "  FAIL crossover stamped: $(grep '^boundary:' "$V/memory/n.md")"; fail=1; }

          # An undeterminable destination must leave the tag ALONE rather than guess —
          # fabricating one is how the original bug did its damage.
          B="$RUNNER_TEMP/bndbare"; mkdir -p "$B"
          ./bin/crossover.sh import --vault "$B" < "$RUNNER_TEMP/bnd.txt" >/dev/null 2>&1
          grep -qx 'boundary: personal' "$B/memory/n.md" \
            && echo "  ok   no declaration -> boundary left untouched, not guessed" \
            || { echo "  FAIL a bare destination was stamped anyway"; fail=1; }

          # The lint-docs check is LOAD-BEARING, proven by reinstating the literal at each
          # of the sites that actually carried it.
          for site in skills/checkpoint/SKILL.md skills/wiki-repo/SKILL.md bin/crossover.sh; do
            cp "$site" "$RUNNER_TEMP/site.bak"
            printf '\nboundary: personal\n' >> "$site"
            ./bin/lint-docs.sh >/dev/null 2>&1 \
              && { echo "  FAIL lint-docs green with the literal reinstated in $site"; fail=1; } \
              || echo "  ok   red when $site names a boundary literal"
            cp "$RUNNER_TEMP/site.bak" "$site"
          done
          ./bin/lint-docs.sh >/dev/null \
            || { echo "  FAIL lint-docs red on a clean tree"; fail=1; }

          exit "$fail"

      - name: Adoption reconciles .gitignore, add-only
        run: |
          # scaffold/gitignore.tmpl was applied once, by new-wiki.sh, and nothing ever
          # revisited it — so every entry added to the template after a vault was
          # scaffolded never reached that vault, while adoption itself kept creating new
          # untracked paths (.engine-adopted, .githooks/). A vault got dirtier the more of
          # the engine it adopted. One entry carries a safety property outright:
          # .wiki-gates.local names the OTHER boundary's identifiers, so a vault adopting
          # the foreign-boundary gate without it is one `git add -A` from committing
          # exactly what the gate exists to keep out.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-gi"
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main
          export CLAUDE_SETTINGS="$RUNNER_TEMP/settings-gi.json"
          fail=0
          run() { WIKI="$1" ENGINE="$PWD" ADOPT_LIB="$PWD/bin/adopt-lib.sh" ADOPT_CHECK="${2:-}" \
                    bash adopt.d/40-vault-gitignore.sh; }

          # A vault that predates the newer entries, carrying its OWN entry and a
          # different spelling of a template one.
          V="$RUNNER_TEMP/gi"; mkdir -p "$V"; git -C "$V" init -q .
          printf '# mine — must survive\nscratch/\n\n# obsidian\n.obsidian/\n\n# no trailing slash\n.upkeep\n' > "$V/.gitignore"
          cp "$V/.gitignore" "$RUNNER_TEMP/gi-before"

          run "$V" >/dev/null
          for e in .rag/ .engine-proposal/ .wiki-gates.local .engine-adopted .githooks/ .worktrees/; do
            grep -qxF "$e" "$V/.gitignore" \
              || { echo "  FAIL missing entry not appended: $e"; fail=1; }
          done
          echo "  ok   missing template entries reach an existing vault"

          # The safety-critical one, called out separately because it is the reason this
          # is not cosmetic.
          grep -qxF '.wiki-gates.local' "$V/.gitignore" \
            && echo "  ok   a vault predating the foreign-boundary gate now ignores its denylist" \
            || { echo "  FAIL .wiki-gates.local not reconciled"; fail=1; }

          # ADD-ONLY: the vault's own lines survive byte-identically, as a PREFIX — so
          # nothing was reordered or rewritten either.
          head -c "$(wc -c < "$RUNNER_TEMP/gi-before")" "$V/.gitignore" \
            | diff -q - "$RUNNER_TEMP/gi-before" >/dev/null \
            && echo "  ok   the vault's own entries are untouched and unreordered" \
            || { echo "  FAIL the vault's .gitignore was rewritten"; fail=1; }

          # A different spelling must not earn a near-duplicate.
          [ "$(grep -c '^\.upkeep' "$V/.gitignore")" = "1" ] \
            && echo "  ok   a differently-spelled entry is not duplicated" \
            || { echo "  FAIL duplicate .upkeep entry"; fail=1; }

          # Idempotent: a re-run appends nothing at all.
          cp "$V/.gitignore" "$RUNNER_TEMP/gi-once"
          run "$V" >/dev/null
          diff -q "$V/.gitignore" "$RUNNER_TEMP/gi-once" >/dev/null \
            && echo "  ok   re-running appends nothing" \
            || { echo "  FAIL not idempotent"; fail=1; }

          # --check must report without writing.
          W="$RUNNER_TEMP/gi2"; mkdir -p "$W"; git -C "$W" init -q .
          printf '.obsidian/\n' > "$W/.gitignore"
          out="$(run "$W" 1)"
          printf '%s' "$out" | grep -q 'would add' || { echo "  FAIL --check said nothing"; fail=1; }
          [ "$(cat "$W/.gitignore")" = ".obsidian/" ] \
            && echo "  ok   --check reports without writing" \
            || { echo "  FAIL --check wrote to the file"; fail=1; }

          # END TO END: a freshly scaffolded + adopted vault must be CLEAN. This is the
          # assertion that would have caught the whole class — .engine-adopted and
          # .githooks/ showed as untracked on every brand-new vault.
          F="$RUNNER_TEMP/gifresh"
          ./bin/new-wiki.sh --path "$F" --boundary personal --email ci@example.com \
            --git-name CI --engine-url "$PWD" --no-link-skills --no-rag >/dev/null 2>&1
          ./bin/adopt.sh --wiki "$F" >/dev/null 2>&1
          st="$(git -C "$F" status --porcelain)"
          [ -z "$st" ] \
            && echo "  ok   a freshly scaffolded + adopted vault has a clean git status" \
            || { echo "  FAIL fresh vault is dirty:"; printf '%s\n' "$st"; fail=1; }

          exit "$fail"

      - name: gc reaps a squash-merged branch, keeps genuinely unintegrated work
        run: |
          # REGRESSION: gc judged containment with `merge-base --is-ancestor`, which is
          # equivalent to "is this merged" ONLY for the fast-forward `integrate`
          # performs. A vault whose house workflow is branch -> PR -> squash-merge lands
          # the work as a NEW commit with a different sha, so this fired on every single
          # session — unbounded wt/* accumulation, which is what v1.28.2 was cut to stop,
          # plus a "delete by hand" line that always fires and therefore stops being read.
          # The keep is fail-safe and must STAY fail-safe; what changes is that a
          # genuinely stranded branch is now worded differently from the noise.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-gcsq"
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main
          WT="$GITHUB_WORKSPACE/bin/vault-worktree.sh"
          fail=0
          V="$RUNNER_TEMP/gcsq"; mkdir -p "$V/memory"; git -C "$V" init -q .
          printf 'seed\n' > "$V/memory/seed.md"
          git -C "$V" -c core.hooksPath=/dev/null add -A
          git -C "$V" -c core.hooksPath=/dev/null commit -qm seed
          mk() {
            W="$(WIKI_PATH="$V" WIKI_WT_SESSION="$1" "$WT" ensure 2>/dev/null)"
            printf '%s\n' "$2" > "$W/memory/$2.md"
            git -C "$W" -c core.hooksPath=/dev/null add -A
            git -C "$W" -c core.hooksPath=/dev/null commit -qm "$2"
            printf '%s' "$W"
          }

          # (1) squash-merged — the reported case, and the one that used to be kept
          W1="$(mk squashed sq)"
          git -C "$V" merge -q --squash wt/squashed >/dev/null 2>&1
          git -C "$V" -c core.hooksPath=/dev/null commit -qm "squashed PR (#1)"
          out="$(WIKI_PATH="$V" "$WT" gc "$W1" 2>&1)"
          printf '%s' "$out" | grep -q "deleted wt/squashed" \
            && echo "  ok   a squash-merged branch is reaped" \
            || { echo "  FAIL squash-merged branch kept:"; printf '%s\n' "$out"; fail=1; }
          # and its content really was on main — never delete on a guess
          git -C "$V" show main:memory/sq.md >/dev/null 2>&1 \
            || { echo "  FAIL reaped a branch whose content is NOT on main"; fail=1; }

          # (2) fast-forward integrate — the v1.28.2 path must not regress. `integrate`
          # only runs from INSIDE the worktree; running it from elsewhere is a no-op that
          # silently leaves the branch unintegrated, which makes this test meaningless.
          W2="$(mk ffwd ff)"
          ( cd "$W2" && WIKI_PATH="$V" WIKI_WT_SESSION=ffwd "$WT" integrate >/dev/null 2>&1 )
          git -C "$V" merge-base --is-ancestor wt/ffwd main \
            || { echo "  FAIL fixture: integrate did not fast-forward, so the check below proves nothing"; fail=1; }
          out="$(WIKI_PATH="$V" "$WT" gc "$W2" 2>&1)"
          printf '%s' "$out" | grep -q "deleted wt/ffwd (already contained" \
            && echo "  ok   a fast-forward-integrated branch is still reaped by ancestry" \
            || { echo "  FAIL v1.28.2 path regressed:"; printf '%s\n' "$out"; fail=1; }

          # (3) genuinely unintegrated — kept, and reported DISTINGUISHABLY from the noise
          W3="$(mk stranded strand)"
          out="$(WIKI_PATH="$V" "$WT" gc "$W3" 2>&1)"
          printf '%s' "$out" | grep -q "kept wt/stranded — UNINTEGRATED CONTENT" \
            && echo "  ok   stranded work is kept and named as unintegrated" \
            || { echo "  FAIL stranded branch mis-reported:"; printf '%s\n' "$out"; fail=1; }
          git -C "$V" show wt/stranded:memory/strand.md >/dev/null 2>&1 \
            && echo "  ok   the stranded work is still recoverable" \
            || { echo "  FAIL stranded work was destroyed"; fail=1; }

          # (4) merge-tree unavailable (git < 2.38) must KEEP and say it could not tell —
          # a different report from "has unintegrated work", which is the whole point.
          FAKE="$RUNNER_TEMP/fakebin"; mkdir -p "$FAKE"
          REALGIT="$(command -v git)"
          printf '#!/bin/sh\nif [ "$1" = "-C" ]; then d=$2; shift 2; fi\nif [ "$1" = "merge-tree" ]; then echo "usage: git merge-tree" >&2; exit 129; fi\nexec %s ${d:+-C "$d"} "$@"\n' "$REALGIT" > "$FAKE/git"
          chmod +x "$FAKE/git"
          V2="$RUNNER_TEMP/gcold"; mkdir -p "$V2/memory"; git -C "$V2" init -q .
          printf 'seed\n' > "$V2/memory/seed.md"
          git -C "$V2" -c core.hooksPath=/dev/null add -A
          git -C "$V2" -c core.hooksPath=/dev/null commit -qm seed
          W4="$(WIKI_PATH="$V2" WIKI_WT_SESSION=old "$WT" ensure 2>/dev/null)"
          printf 'x\n' > "$W4/memory/x.md"
          git -C "$W4" -c core.hooksPath=/dev/null add -A
          git -C "$W4" -c core.hooksPath=/dev/null commit -qm x
          git -C "$V2" merge -q --squash wt/old >/dev/null 2>&1
          git -C "$V2" -c core.hooksPath=/dev/null commit -qm squashed
          out="$(PATH="$FAKE:$PATH" WIKI_PATH="$V2" "$WT" gc "$W4" 2>&1)"
          printf '%s' "$out" | grep -q "could not determine containment" \
            && echo "  ok   an unsupported git reports 'could not determine', not a false keep" \
            || { echo "  FAIL old-git path mis-reported:"; printf '%s\n' "$out"; fail=1; }
          git -C "$V2" rev-parse --verify wt/old >/dev/null 2>&1 \
            && echo "  ok   ...and keeps the branch" \
            || { echo "  FAIL deleted a branch it could not evaluate"; fail=1; }

          exit "$fail"

      - name: The proposal queue is the source of truth, and submit cannot leak
        run: |
          # The queue directory replaces the copy-paste channel. Two properties dominate
          # everything else here, and both are asserted by INTRODUCING the failure:
          #   1. the engine repo is PUBLIC, so `submit` must refuse a block that fails the
          #      boundary scan and must leave NOTHING behind on that path — no branch, no
          #      queue file, no marker. There is no bypass flag by design.
          #   2. the generated ledger must reproduce what the hand-maintained table said,
          #      or the correlation key means something different before and after.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-queue"
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main
          EP="$GITHUB_WORKSPACE/bin/engine-proposal.sh"
          fail=0

          # (1) the ledger is derived, and --check catches a hand-edit
          ./bin/gen-proposals-ledger.sh --repo "$GITHUB_WORKSPACE" --check >/dev/null 2>&1 \
            && echo "  ok   PROPOSALS.md is in sync with proposals/" \
            || { echo "  FAIL committed ledger is stale"; fail=1; }
          cp PROPOSALS.md "$RUNNER_TEMP/ledger.bak"
          # portable rewrite (BSD sed needs an arg to -i; GNU does not) so this step can be
          # extracted and verified on a workstation, which is how several real bugs surfaced
          sed 's/| `upkeep-sync-clones` | shipped | derived |/| `upkeep-sync-clones` | rejected | x |/' PROPOSALS.md > "$RUNNER_TEMP/l.tmp"
          mv "$RUNNER_TEMP/l.tmp" PROPOSALS.md
          ./bin/gen-proposals-ledger.sh --repo "$GITHUB_WORKSPACE" --check >/dev/null 2>&1 \
            && { echo "  FAIL a hand-edited ledger row was not detected"; fail=1; } \
            || echo "  ok   a hand-edited ledger row is caught as drift"
          cp "$RUNNER_TEMP/ledger.bak" PROPOSALS.md

          # (2) a malformed queue entry fails rather than rendering a half-row
          mkdir -p "$RUNNER_TEMP/qrepo/proposals"
          cp PROPOSALS.md "$RUNNER_TEMP/qrepo/PROPOSALS.md"
          printf -- '---\nslug: bad\noutcome: rejected\n---\n' > "$RUNNER_TEMP/qrepo/proposals/bad.md"
          ./bin/gen-proposals-ledger.sh --repo "$RUNNER_TEMP/qrepo" >/dev/null 2>&1 \
            && { echo "  FAIL a rejected entry with no reason rendered anyway"; fail=1; } \
            || echo "  ok   rejected without a reason fails the generator"
          printf -- '---\nslug: mismatch\noutcome: open\nreceived: 2026-01-01\n---\n' > "$RUNNER_TEMP/qrepo/proposals/other.md"
          rm -f "$RUNNER_TEMP/qrepo/proposals/bad.md"
          ./bin/gen-proposals-ledger.sh --repo "$RUNNER_TEMP/qrepo" >/dev/null 2>&1 \
            && { echo "  FAIL filename/slug divergence rendered anyway"; fail=1; } \
            || echo "  ok   a slug disagreeing with its filename fails the generator"

          # (3) THE SAFETY TEST — a dirty block must be refused with no side effects
          T="$RUNNER_TEMP/subq"; mkdir -p "$T"
          ENG="$T/engine"; mkdir -p "$ENG/proposals"; git -C "$ENG" init -q .
          echo seed > "$ENG/README.md"; git -C "$ENG" add -A; git -C "$ENG" commit -qm seed
          V="$T/vault"; mkdir -p "$V"; git -C "$V" init -q .
          printf -- '---\nboundary: personal\n---\n' > "$V/CLAUDE.md"; : > "$V/.gitignore"
          git -C "$V" add -A; git -C "$V" commit -qm seed
          printf 'slug: dirty\nboundary: generic\n\nreach me at someone@example.org\n' \
            | ENGINE_REPO="$ENG" "$EP" submit --vault "$V" --slug dirty >/dev/null 2>&1 \
            && { echo "  FAIL submit accepted a block that fails the scan"; fail=1; } \
            || echo "  ok   submit refuses a block that fails the boundary scan"
          [ "$(git -C "$ENG" branch --list 'proposal/*' | wc -l)" -eq 0 ] \
            && echo "  ok   refusal left no branch behind" \
            || { echo "  FAIL a branch survived a refused submit"; fail=1; }
          [ -e "$ENG/proposals/dirty.md" ] \
            && { echo "  FAIL a queue file survived a refused submit"; fail=1; } \
            || echo "  ok   refusal left no queue file"
          [ -e "$V/.engine-proposal/dirty.prepared" ] \
            && { echo "  FAIL a marker survived a refused submit"; fail=1; } \
            || echo "  ok   refusal left no marker"

          # (4) a CLEAN block prepares locally and does NOT publish
          printf 'slug: cleanq\nboundary: generic\n\nA generic problem statement.\n' \
            | ENGINE_REPO="$ENG" "$EP" submit --vault "$V" --slug cleanq >/dev/null 2>&1 \
            && echo "  ok   a clean block prepares" \
            || { echo "  FAIL a clean block was refused"; fail=1; }
          [ -f "$V/.engine-proposal/cleanq.prepared" ] \
            && echo "  ok   prepare records a local marker" \
            || { echo "  FAIL no prepared marker"; fail=1; }
          git -C "$ENG" remote -v | grep -q . \
            && { echo "  FAIL fixture gained a remote; the no-publish assertion is void"; fail=1; } \
            || echo "  ok   nothing was published (fixture has no remote at all)"

          # (5) the three local states are distinguishable WITHOUT network
          cp -R "$ENG" "$V/engine"; git -C "$V/engine" checkout -q main
          cp PROPOSALS.md "$V/engine/PROPOSALS.md"
          git -C "$V/engine" add -A; git -C "$V/engine" commit -qm ledger
          "$EP" status --vault "$V" --slug cleanq 2>&1 | grep -q 'WRITTEN LOCALLY' \
            && echo "  ok   written-locally is distinct" \
            || { echo "  FAIL written-locally not reported"; fail=1; }
          mv "$V/.engine-proposal/cleanq.prepared" "$V/.engine-proposal/cleanq.submitted"
          "$EP" status --vault "$V" --slug cleanq 2>&1 | grep -q 'SUBMITTED, not yet merged' \
            && echo "  ok   submitted-pending is distinct" \
            || { echo "  FAIL submitted-pending not reported"; fail=1; }
          "$EP" status --vault "$V" --slug never-existed 2>&1 | grep -q 'unknown' \
            && echo "  ok   never-existed is still unknown" \
            || { echo "  FAIL unknown collapsed"; fail=1; }
          # ...and a migrated slug still resolves exactly as the old table said. Uses a
          # BACK-FILLED row (explicit release:), not a `derived` one: deriving a release
          # needs a Proposal: trailer in history, which this fixture engine does not have,
          # so a derived slug would fail here for a reason that has nothing to do with the
          # migration. Asserting it anyway would be testing the fixture's limits, not the code.
          "$EP" status --vault "$V" --slug crossover-export-split-default 2>&1 | grep -q 'v1.24.0' \
            && echo "  ok   a migrated slug resolves to the release the old table named" \
            || { echo "  FAIL migration changed an existing answer"; fail=1; }

          # (6) the ENGINE-DEV work-list must exist and must not need a consumer vault.
          # Without this verb the queue is a storage format, not a work-list, and draining
          # it means ls + grep — which is the gap the proposal was explicitly closing.
          # Asserted against a FIXTURE queue, never the repo's own. The first version of
          # this test grepped the live queue for the drain instructions — which `queue`
          # only prints when something is open — and the very next commit drained the
          # queue, turning a green test red with no code change. An assertion whose truth
          # depends on ordinary repo contents is not testing the code.
          QR="$RUNNER_TEMP/queuefix"; mkdir -p "$QR/proposals"
          cp PROPOSALS.md "$QR/PROPOSALS.md"
          printf -- '---\nslug: fixture-open\noutcome: open\nreceived: 2026-01-02\n---\n' > "$QR/proposals/fixture-open.md"
          printf -- '---\nslug: fixture-done\noutcome: accepted\nreceived: 2026-01-01\nrelease: v1.0.0\n---\n' > "$QR/proposals/fixture-done.md"
          "$EP" queue --repo "$QR" >/dev/null 2>&1 \
            && echo "  ok   queue runs in the engine repo with no --vault" \
            || { echo "  FAIL queue requires a vault or failed"; fail=1; }
          "$EP" queue --repo "$QR" 2>&1 | grep -q 'fixture-open' \
            && echo "  ok   queue lists an open proposal" \
            || { echo "  FAIL queue did not list the open proposal"; fail=1; }
          "$EP" queue --repo "$QR" 2>&1 | grep -q 'fixture-done' \
            && { echo "  FAIL a resolved proposal appeared without --all"; fail=1; } \
            || echo "  ok   resolved proposals are hidden without --all"
          "$EP" queue --repo "$QR" --all 2>&1 | grep -q 'fixture-done' \
            && echo "  ok   --all reveals resolved proposals" \
            || { echo "  FAIL --all did not list resolved"; fail=1; }
          # the drain instructions must name the derived-ledger rule, since the skill's old
          # intake step hand-edited PROPOSALS.md and would now trip the drift gate
          "$EP" queue --repo "$QR" 2>&1 | grep -q 'NEVER hand-edit PROPOSALS.md' \
            && echo "  ok   queue names the derived-ledger rule at the point of use" \
            || { echo "  FAIL drain instructions omit the derived-ledger rule"; fail=1; }
          # a DRAINED queue must say so and must not print drain instructions for nothing
          rm -f "$QR/proposals/fixture-open.md"
          out_d="$("$EP" queue --repo "$QR" 2>&1)"
          printf '%s' "$out_d" | grep -q 'queue is drained' \
            && echo "  ok   a drained queue says so" \
            || { echo "  FAIL drained queue not reported"; fail=1; }
          printf '%s' "$out_d" | grep -q 'To process one' \
            && { echo "  FAIL drain instructions printed with nothing to drain"; fail=1; } \
            || echo "  ok   no drain instructions when there is nothing to drain"

          exit "$fail"

      - name: submit works in the submodule checkout it defaults to
        run: |
          # The checkout `submit` picks by default IS the vault's pinned submodule, where
          # `.git` is a FILE holding a gitdir pointer — so a `-d .git` guard rejected every
          # consumer using the documented default and told them to go find a clone they do
          # not have. Fail-closed, but what it closed was the only sanctioned upstream
          # channel, and the workaround it invited (edit the pinned submodule in place) is
          # the time bomb the skill exists to warn against.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-submod"
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main
          git config --global protocol.file.allow always
          EP="$GITHUB_WORKSPACE/bin/engine-proposal.sh"
          T="$RUNNER_TEMP/submod"; rm -rf "$T"; mkdir -p "$T"; fail=0

          git init -q --bare "$T/origin-engine.git"
          git clone -q "$T/origin-engine.git" "$T/eng-src" 2>/dev/null
          mkdir -p "$T/eng-src/bin" "$T/eng-src/proposals"
          cp "$GITHUB_WORKSPACE/bin/engine-proposal.sh" "$GITHUB_WORKSPACE/bin/gen-proposals-ledger.sh" "$T/eng-src/bin/"
          echo seed > "$T/eng-src/README.md"
          printf '<!-- proposals:start -->\n<!-- proposals:end -->\n' > "$T/eng-src/PROPOSALS.md"
          git -C "$T/eng-src" add -A; git -C "$T/eng-src" commit -qm seed; git -C "$T/eng-src" push -q origin main

          V="$T/vault"; git init -q "$V"
          printf -- '---\nboundary: personal\n---\n' > "$V/CLAUDE.md"; : > "$V/.gitignore"
          git -C "$V" add -A; git -C "$V" commit -qm seed
          git -C "$V" submodule add -q "$T/origin-engine.git" engine
          git -C "$V" commit -qm "pin engine"
          pin="$(git -C "$V/engine" rev-parse HEAD)"

          [ -f "$V/engine/.git" ] \
            && echo "  ok   fixture reproduces the shape that broke it (.git is a file)" \
            || { echo "  FAIL fixture is not a submodule; the test is void"; fail=1; }

          printf 'slug: submodq\nboundary: generic\n\nA generic problem statement.\n' > "$T/block.md"
          out="$("$EP" submit --vault "$V" --slug submodq --file "$T/block.md" 2>&1)" \
            && echo "  ok   submit accepts the pinned submodule as the engine checkout" \
            || { echo "  FAIL submit rejected the checkout it defaults to"; fail=1; }

          # the preview is the only review of MEANING in the chain; an empty box is a
          # safety surface failing silently
          printf '%s' "$out" | grep -q 'A generic problem statement' \
            && echo "  ok   the pre-push preview shows the block that becomes public" \
            || { echo "  FAIL preview box was empty"; fail=1; }

          # the pin must be restored: parking a consumer's submodule on a branch cut from
          # origin/main silently changes the version their whole vault runs at
          [ "$(git -C "$V/engine" rev-parse HEAD)" = "$pin" ] \
            && echo "  ok   the submodule is left on its pinned commit" \
            || { echo "  FAIL submit left the pinned engine on another commit"; fail=1; }
          git -C "$V/engine" rev-parse --verify -q proposal/submodq >/dev/null \
            && echo "  ok   the prepared branch survives as a ref" \
            || { echo "  FAIL prepared branch is gone"; fail=1; }

          # the derived ledger travels WITH the proposal, or the drift gate fails the
          # reporter's own pull request for a step nobody told them to run
          git -C "$V/engine" show proposal/submodq --stat --oneline | grep -q 'PROPOSALS.md' \
            && echo "  ok   the ledger is regenerated in the proposal commit" \
            || { echo "  FAIL proposal commit leaves the committed ledger stale"; fail=1; }
          git -C "$V/engine" show "proposal/submodq:PROPOSALS.md" | grep -q 'submodq' \
            && echo "  ok   the regenerated ledger carries the new open row" \
            || { echo "  FAIL no row for the arriving proposal"; fail=1; }

          # push must not depend on the environment being re-created
          [ "$(sed -n '2p' "$V/.engine-proposal/submodq.prepared")" = "$V/engine" ] \
            && echo "  ok   the marker records which checkout holds the branch" \
            || { echo "  FAIL marker does not record the engine checkout"; fail=1; }

          exit "$fail"

      - name: The release title survives punctuation inside a code span
        run: |
          # This logic lived inline in release.yml, which runs only on a version-tag push —
          # so no check ever exercised it, and it shipped wrong twice: once slicing mid-word
          # and leaving raw markdown, once cutting at a colon inside `Proposal:` and
          # publishing "<version> — the Proposal". Extracted to bin/release-title.sh
          # precisely so this step can exist.
          fail=0
          t() { printf '%s' "$1" | ./bin/release-title.sh; }
          eq() { [ "$2" = "$3" ] && echo "  ok   $1" || { echo "  FAIL $1"; echo "        got:      [$2]"; echo "        expected: [$3]"; fail=1; }; }

          # the reported defect: a colon inside a code span is NOT a clause boundary
          got="$(t 'Patch — the `Proposal:` citation convention required a placement.')"
          eq "code-span colon does not end the title" "$got" "the Proposal: citation convention required a placement"
          # ...and the same colon OUTSIDE a span still does
          got="$(t 'Minor — a new tool: it renders things. And more.')"
          eq "a real clause boundary still cuts" "$got" "a new tool"
          # emphasis markers are stripped, never treated as boundaries
          got="$(t 'Minor — **a new** `gen-x.sh` tool; it helps.')"
          eq "bold and code markers are removed" "$got" "a new gen-x.sh tool"
          # no dangling punctuation
          got="$(t 'Patch — one clause; two.')"
          eq "trailing punctuation is trimmed" "$got" "one clause"
          # headings and bullets are skipped in favour of the first prose line
          got="$(printf '### Added\n- a bullet\nreal prose here.\n' | ./bin/release-title.sh)"
          eq "headings and bullets are skipped" "$got" "real prose here"
          # long clause degrades to a word boundary + ellipsis, never a mid-word slice
          got="$(t 'Minor — aaaa bbbb cccc dddd eeee ffff gggg hhhh iiii jjjj kkkk llll mmmm nnnn oooo pppp qqqq')"
          case "$got" in *…) echo "  ok   a long clause ends in an ellipsis" ;; *) echo "  FAIL no ellipsis: [$got]"; fail=1 ;; esac
          case "$got" in *" "…|*[a-z]…) : ;; esac
          printf '%s' "$got" | grep -qE '[a-z]…$' && echo "  ok   the cap lands on a word boundary" \
            || { echo "  FAIL cap sliced mid-word or oddly: [$got]"; fail=1; }
          # an unclosed backtick must degrade, not explode
          got="$(t 'Patch — a stray `backtick that never closes, so what happens.')"
          [ -n "$got" ] && echo "  ok   an unclosed code span degrades safely" \
                        || { echo "  FAIL unclosed span produced nothing"; fail=1; }
          # every CHANGELOG section in the repo must produce a non-empty title
          miss=0
          for v in $(grep -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -d '#[] ' ); do
            n="$(awk -v ver="$v" '$0 ~ "^## \\["ver"\\]"{f=1;next} /^## \[/{f=0} f' CHANGELOG.md)"
            [ -n "$(printf '%s' "$n" | ./bin/release-title.sh)" ] || { echo "  FAIL v$v yields an empty title"; miss=1; }
          done
          [ "$miss" = 0 ] && echo "  ok   every shipped CHANGELOG section yields a title" || fail=1

          exit "$fail"

      - name: Project pages get a derived, drainable staleness signal
        run: |
          # The age is DERIVED, not read from frontmatter. The proposal keyed on `updated:`;
          # measured against a real vault, two of three active project pages disagreed with
          # git by three days, drifting toward LOOKING STALE — so a queue built on it fires
          # on pages that were in fact touched. Both directions are asserted below, because
          # a signal that only ever fires is as useless as one that never does.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-stale"
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main
          fail=0
          V="$RUNNER_TEMP/stalevault"; rm -rf "$V"; mkdir -p "$V/projects"
          # %b for the optional extra field, not %s: it may carry an escape, and printf's
          # %s emits it literally — which put `reviewed: <date>\nsummary: "x"` on ONE line
          # and made the value a malformed date. macOS date(1) parsed it leniently and the
          # runner's did not, so this passed locally and failed in CI.
          mk() { printf -- '---\ntype: project\nstatus: %s\nupdated: %s\n%bsummary: "x"\nboundary: personal\n---\n\n# %s\n' "$2" "$3" "$4" "$1" > "$V/projects/$1.md"; }
          mk old-active      active 2026-01-01 ""
          mk fresh-active    active "$(date +%Y-%m-%d)" ""
          mk old-done        done   2026-01-01 ""
          mk ancient-paused  paused 2020-01-01 ""
          mk recent-paused   paused "$(date +%Y-%m-%d)" ""
          mk bad-status      activo 2026-01-01 ""
          mk reviewed-recent active 2026-01-01 "reviewed: $(date +%Y-%m-%d)\n"

          q() { ./bin/upkeep.sh scan --wiki "$V" >/dev/null 2>&1; awk -F'\t' 'NR>1{print $3}' "$V/.upkeep/queue.tsv"; }
          has() { q | grep -q "projects/$1.md"; }

          has old-active      && echo "  ok   a long-untouched active project is queued" || { echo "  FAIL stale active not queued"; fail=1; }
          has fresh-active    && { echo "  FAIL a fresh page was queued"; fail=1; } || echo "  ok   a fresh active project is not queued"
          has old-done        && { echo "  FAIL a done project was queued"; fail=1; } || echo "  ok   done is exempt outright"
          has ancient-paused  && echo "  ok   paused fires on its own longer horizon" || { echo "  FAIL paused never fires"; fail=1; }
          has recent-paused   && { echo "  FAIL a recently-touched paused page fired"; fail=1; } || echo "  ok   paused is not judged on the active threshold"
          has bad-status      && echo "  ok   an unknown status is reported unassessable, not skipped" || { echo "  FAIL unknown status silently skipped"; fail=1; }
          # THE CLOCK RESET: an old `updated:` with a recent `reviewed:` must NOT fire, or an
          # item can never be cleared without fabricating a content edit and the queue is
          # permanently non-empty.
          has reviewed-recent && { echo "  FAIL reviewed: did not reset the clock"; fail=1; } || echo "  ok   reviewed: clears an item without a content edit"

          # drains through the EXISTING verbs; no new subcommands. Asserted HERE, while
          # old-active is genuinely queued — after the commit below every page is age 0 and
          # nothing is stale, so the same call there would fail for the wrong reason.
          ./bin/upkeep.sh done stale:old-active --wiki "$V" >/dev/null 2>&1 \
            && echo "  ok   items drain through the existing done verb" \
            || { echo "  FAIL done rejected a stale item"; fail=1; }

          # THE DERIVED SIGNAL: committing the pages today must silence the stale ones even
          # though their `updated:` still says January.
          git -C "$V" init -q .
          git -C "$V" -c core.hooksPath=/dev/null add -A
          git -C "$V" -c core.hooksPath=/dev/null commit -qm "all pages committed today"
          has old-active && { echo "  FAIL git date did not override a stale updated:"; fail=1; } \
                         || echo "  ok   git's last-commit date overrides a stale updated:"

          # thresholds are vault knobs, not constants
          # -1, not 0: every page was committed moments ago, so age is 0 and `0 > 0` is
          # false. A threshold of 0 failing here would say nothing about the knob.
          UPKEEP_STALE_ACTIVE_DAYS=-1 ./bin/upkeep.sh scan --wiki "$V" >/dev/null 2>&1
          awk -F'\t' 'NR>1{print $3}' "$V/.upkeep/queue.tsv" | grep -q 'projects/fresh-active.md' \
            && echo "  ok   the active threshold is configurable" \
            || { echo "  FAIL threshold knob had no effect"; fail=1; }

          # offline, asserted the way the other offline behaviour is
          FAKE="$RUNNER_TEMP/nonet"; mkdir -p "$FAKE"
          for c in curl wget; do printf '#!/bin/sh\necho denied >&2; exit 1\n' > "$FAKE/$c"; chmod +x "$FAKE/$c"; done
          PATH="$FAKE:$PATH" ./bin/upkeep.sh scan --wiki "$V" >/dev/null 2>&1 \
            && echo "  ok   scan runs with network tools disabled" \
            || { echo "  FAIL scan needs the network"; fail=1; }

          exit "$fail"

      - name: A project summary must name identity, not state
        run: |
          # The gate is a PROXY for a SCHEMA rule, enforced through a content-hashed
          # ratchet. Every assertion below pins a decision from the intake review, because
          # each one is a place the obvious implementation is wrong:
          #   - `done` is frozen (a terminal claim is true forever) but unknown status is
          #     NOT, or a typo'd `status: activo` buys a silent exemption;
          #   - bare `live` is not a marker — every status-gated hit it produced on a real
          #     vault was adjectival ("a live artifact", "first live candidate");
          #   - the baseline keys on sha256(summary), so rewriting a summary DROPS its
          #     exemption; a slug-keyed allowlist would outlive the text it excused.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-sumvol"
          git config --global user.email ci@example.com
          git config --global user.name CI
          G="$GITHUB_WORKSPACE/bin/lint-summary-volatility.sh"
          fail=0
          V="$RUNNER_TEMP/sumvol"; rm -rf "$V"; mkdir -p "$V/projects"
          mk() { printf -- '---\ntype: project\nstatus: %s\nsummary: "%s"\nboundary: personal\n---\n\n# x\n' "$2" "$3" > "$V/projects/$1.md"; }

          mk decaying active  "built but not deployed; still on v1.2.0"
          mk frozen   done    "the flag rename (complete)"
          mk adjectiv active  "a live artifact IS the work queue"
          mk typo     activo  "blocked on inputs"
          mk identity active  "a durable index of household records"

          out="$("$G" --wiki "$V" 2>&1)" || true
          chk() { printf '%s' "$out" | grep -q "$2" && { [ "$1" = y ] && echo "  ok   $3" || { echo "  FAIL $3"; fail=1; }; } \
                                                   || { [ "$1" = n ] && echo "  ok   $3" || { echo "  FAIL $3"; fail=1; }; }; }
          chk y 'projects/decaying.md'  "a decaying summary on an active project is flagged"
          chk n 'projects/frozen.md'    "a done project's frozen claim is skipped"
          chk n 'projects/adjectiv.md'  "adjectival 'live' is not treated as a state claim"
          chk y 'projects/typo.md'      "an unknown status flags rather than exempting"
          chk n 'projects/identity.md'  "an identity summary is clean"
          "$G" --wiki "$V" >/dev/null 2>&1 \
            && { echo "  FAIL gate exited 0 with findings"; fail=1; } || echo "  ok   findings exit non-zero"

          # the ratchet: seed, go green, then prove it is not a blanket exemption
          "$G" --wiki "$V" --seed-baseline >/dev/null 2>&1 || { echo "  FAIL seeding failed"; fail=1; }
          "$G" --wiki "$V" >/dev/null 2>&1 \
            && echo "  ok   a seeded vault is green and silent" \
            || { echo "  FAIL still red after seeding:"; "$G" --wiki "$V"; fail=1; }
          # rewriting a baselined summary into a DIFFERENT decaying claim must re-flag.
          # This is the whole argument for hashing content instead of keying on the slug.
          mk decaying active "shipped 2026-01-01, rolled out to prod"
          "$G" --wiki "$V" >/dev/null 2>&1 \
            && { echo "  FAIL a rewritten summary kept its exemption"; fail=1; } \
            || echo "  ok   rewriting a baselined summary drops its exemption"
          # ...and an untouched baselined page stays exempt (the ratchet must not reset)
          mk decaying active "built but not deployed; still on v1.2.0"
          "$G" --wiki "$V" >/dev/null 2>&1 \
            && echo "  ok   an unchanged baselined summary stays exempt" \
            || { echo "  FAIL the baseline stopped suppressing an unchanged summary"; fail=1; }
          # done -> active un-freezes a previously-safe terminal claim
          mk frozen active "the flag rename (complete)"
          "$G" --wiki "$V" 2>&1 | grep -q 'projects/frozen.md' \
            && echo "  ok   reopening a done project newly flags its frozen claim" \
            || { echo "  FAIL done -> active did not re-evaluate"; fail=1; }

          # a gate that cannot load its rules must FAIL, not pass everything
          mk frozen done "the flag rename (complete)"
          printf 'summary_volatility_markers = missing-markers.txt\n' > "$V/.wiki-gates.conf"
          # (a missing override falls back to the engine default — that is intended)
          "$G" --wiki "$V" >/dev/null 2>&1 && echo "  ok   a missing override falls back to the engine list" \
            || { echo "  FAIL fallback broke"; fail=1; }
          rm -f "$V/.wiki-gates.conf"
          EMPTY="$RUNNER_TEMP/empty-markers.txt"; : > "$EMPTY"
          printf 'summary_volatility_markers = empty-markers.txt\n' > "$V/.wiki-gates.conf"
          : > "$V/empty-markers.txt"
          "$G" --wiki "$V" >/dev/null 2>&1 \
            && { echo "  FAIL an EMPTY marker list passed every page"; fail=1; } \
            || echo "  ok   an empty marker list fails closed"
          rm -f "$V/.wiki-gates.conf" "$V/empty-markers.txt"

          # offline + model-free, asserted the way the other offline gates are
          printf '%s\n' '#!/bin/sh' 'echo "network denied" >&2; exit 1' > "$RUNNER_TEMP/curl"
          chmod +x "$RUNNER_TEMP/curl"
          PATH="$RUNNER_TEMP:$PATH" "$G" --wiki "$V" >/dev/null 2>&1 \
            && echo "  ok   runs with network tools disabled" \
            || { echo "  FAIL gate needs the network"; fail=1; }
          grep -qE '\b(claude|curl|wget)\b' "$GITHUB_WORKSPACE/bin/lint-summary-volatility.sh" \
            && { echo "  FAIL gate references a model or network verb"; fail=1; } \
            || echo "  ok   gate invokes no model and no network verb"

          exit "$fail"

      - name: The capture hook cannot deadlock a later session's integrate
        run: |
          # REGRESSION: rag-capture.sh runs at SessionEnd and appends to
          # $WIKI/raw/sessions/YYYY-MM.md in the CANONICAL checkout — necessarily, since
          # by SessionEnd the session's worktree has already been gc'd. That file was
          # TRACKED, so the next session's `integrate` hit the categorical
          # `status --porcelain -uno` check and refused; and `guard` refuses the commit
          # that would clear it. Two correct guards, jointly a deadlock with no
          # sanctioned exit, on the most-travelled path in the vault.
          #
          # Same "a check that is always red is a check that gets bypassed" failure the
          # -uno flag was introduced to fix for UNTRACKED files, one notch deeper: the
          # engine's own hook made the TRACKED half always red too.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-capint"
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main
          WT="$GITHUB_WORKSPACE/bin/vault-worktree.sh"
          CAP="$GITHUB_WORKSPACE/bin/rag-capture.sh"
          fail=0
          MON="raw/sessions/$(date +%Y-%m).md"

          # ── FIXTURE A: a vault scaffolded with the current template ────────────────
          # The cause fix: the buffer must never become tracked in the first place.
          A="$RUNNER_TEMP/capint-fresh"; mkdir -p "$A/memory" "$A/raw/sessions"
          git -C "$A" init -q .
          printf -- '---\nboundary: personal\n---\n# v\n' > "$A/CLAUDE.md"
          printf 'seed\n' > "$A/memory/seed.md"
          cp "$GITHUB_WORKSPACE/scaffold/gitignore.tmpl" "$A/.gitignore"
          git -C "$A" -c core.hooksPath=/dev/null add -A
          git -C "$A" -c core.hooksPath=/dev/null commit -qm seed
          ( cd "$A" && WIKI_PATH="$A" "$CAP" >/dev/null 2>&1 )
          [ -f "$A/$MON" ] || { echo "  FAIL fixture: capture wrote nothing"; fail=1; }
          if git -C "$A" ls-files --error-unmatch "$MON" >/dev/null 2>&1; then
            echo "  FAIL capture buffer is TRACKED — it will dirty canonical every session"; fail=1
          else
            echo "  ok   capture buffer is untracked in a fresh vault"
          fi
          # IGNORED, not merely untracked — otherwise the first `git add -A` in any
          # consumer script sweeps it straight back into the repo and the fix undoes itself.
          git -C "$A" check-ignore -q "$MON" \
            && echo "  ok   capture buffer is gitignored" \
            || { echo "  FAIL capture buffer is not ignored"; fail=1; }

          # ── FIXTURE B: a LEGACY vault, buffer already committed ────────────────────
          # This is the reported case and the one the fixture must not erase: gitignore
          # does not untrack an already-tracked file, so every existing vault still has a
          # TRACKED buffer after adopting the fix. If this fixture let the hook create the
          # monthly file fresh, it would be UNTRACKED — invisible to `-uno` — and the
          # deadlock could never reproduce, so the test would pass against the bug.
          V="$RUNNER_TEMP/capint"; mkdir -p "$V/memory" "$V/raw/sessions"
          git -C "$V" init -q .
          printf -- '---\nboundary: personal\n---\n# v\n' > "$V/CLAUDE.md"
          printf 'seed\n' > "$V/memory/seed.md"
          cp "$GITHUB_WORKSPACE/scaffold/gitignore.tmpl" "$V/.gitignore"
          printf -- '---\ntype: raw\nboundary: personal\n---\n\n# Session capture\n' > "$V/$MON"
          git -C "$V" -c core.hooksPath=/dev/null add -A
          git -C "$V" -c core.hooksPath=/dev/null add -f "$MON"     # as a pre-fix vault has it
          git -C "$V" -c core.hooksPath=/dev/null commit -qm seed
          git -C "$V" ls-files --error-unmatch "$MON" >/dev/null 2>&1 \
            || { echo "  FAIL fixture: legacy buffer is not tracked, so this proves nothing"; fail=1; }
          ( cd "$V" && WIKI_PATH="$V" "$CAP" >/dev/null 2>&1 )
          [ -n "$(git -C "$V" status --porcelain -uno)" ] \
            || { echo "  FAIL fixture: capture left canonical clean, so this proves nothing"; fail=1; }

          # integrate must survive it — the reported deadlock.
          W="$(WIKI_PATH="$V" WIKI_WT_SESSION=s1 "$WT" ensure 2>/dev/null)"
          printf 'work\n' > "$W/memory/work.md"
          git -C "$W" -c core.hooksPath=/dev/null add memory/work.md
          git -C "$W" -c core.hooksPath=/dev/null commit -qm work
          out="$( cd "$W" && WIKI_PATH="$V" WIKI_WT_SESSION=s1 "$WT" integrate 2>&1 )" || true
          if git -C "$V" show main:memory/work.md >/dev/null 2>&1; then
            echo "  ok   integrate lands work despite a live capture buffer"
          else
            echo "  FAIL integrate deadlocked:"; printf '%s\n' "$out" | sed 's/^/    /'; fail=1
          fi
          # the capture buffer must survive integrate untouched — never discard scratch
          grep -q . "$V/$MON" \
            && echo "  ok   capture buffer preserved across integrate" \
            || { echo "  FAIL integrate destroyed the capture buffer"; fail=1; }

          # (3) the precise check must STILL refuse a REAL overlap. A fix that merely
          # mutes the check is worse than the deadlock: it would let a fast-forward
          # run at a tree with conflicting local edits.
          printf 'canonical edit\n' >> "$V/memory/seed.md"       # dirty a TRACKED path...
          W2="$(WIKI_PATH="$V" WIKI_WT_SESSION=s2 "$WT" ensure 2>/dev/null)"
          printf 'worktree edit\n' >> "$W2/memory/seed.md"       # ...that the ff also changes
          git -C "$W2" -c core.hooksPath=/dev/null add memory/seed.md
          git -C "$W2" -c core.hooksPath=/dev/null commit -qm collide
          # `|| rc=$?`, never a bare assignment then `$?` — this step runs under `bash -e`,
          # which aborts on the expected non-zero before the status can be read. Verifying
          # locally under a plain `bash` hides it: the harness is more permissive than
          # production, so the check silently never runs.
          rc=0
          out="$( cd "$W2" && WIKI_PATH="$V" WIKI_WT_SESSION=s2 "$WT" integrate 2>&1 )" || rc=$?
          if [ "$rc" -ne 0 ] && printf '%s' "$out" | grep -q 'memory/seed.md'; then
            echo "  ok   a genuine overlap is still refused, naming the file"
          else
            echo "  FAIL overlapping dirt was not refused (rc=$rc):"; printf '%s\n' "$out" | sed 's/^/    /'; fail=1
          fi
          grep -q 'canonical edit' "$V/memory/seed.md" \
            && echo "  ok   the canonical edit was not clobbered" \
            || { echo "  FAIL clobbered an uncommitted canonical edit"; fail=1; }

          # (4) non-overlapping dirt must NOT block — the over-breadth half.
          git -C "$V" checkout -- memory/seed.md 2>/dev/null || true
          printf 'unrelated\n' > "$V/memory/unrelated.md"
          git -C "$V" -c core.hooksPath=/dev/null add memory/unrelated.md
          git -C "$V" -c core.hooksPath=/dev/null commit -qm unrelated
          printf 'dirty\n' >> "$V/memory/unrelated.md"           # tracked + dirty, untouched by the ff
          W3="$(WIKI_PATH="$V" WIKI_WT_SESSION=s3 "$WT" ensure 2>/dev/null)"
          printf 'more\n' > "$W3/memory/other.md"
          git -C "$W3" -c core.hooksPath=/dev/null add memory/other.md
          git -C "$W3" -c core.hooksPath=/dev/null commit -qm other
          out="$( cd "$W3" && WIKI_PATH="$V" WIKI_WT_SESSION=s3 "$WT" integrate 2>&1 )" || true
          if git -C "$V" show main:memory/other.md >/dev/null 2>&1; then
            echo "  ok   dirt on an unrelated tracked path does not block integrate"
          else
            echo "  FAIL over-broad refusal persists:"; printf '%s\n' "$out" | sed 's/^/    /'; fail=1
          fi
          grep -q 'dirty' "$V/memory/unrelated.md" \
            && echo "  ok   the unrelated edit survived" \
            || { echo "  FAIL lost an unrelated uncommitted edit"; fail=1; }

          exit "$fail"

      - name: A git-describe ref is tolerated, migrated, and then rejected
        run: |
          # The convention is `ref: <latest release tag>` (SCHEMA) and nothing enforced
          # it, so ingest commonly wrote the full describe form vX.Y.Z-<N>-g<sha>. That
          # can never equal a clean tag, so EVERY such page was flagged for refresh
          # forever — a queue whose one real item sits among dozens of false ones is not
          # a queue anyone drains. Same "a signal that always fires stops being read"
          # failure as the always-kept gc branch and the always-red integrate check.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-ref"
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main
          fail=0
          C="$RUNNER_TEMP/refrepos/proj"; mkdir -p "$C"; git init -q "$C"
          ( cd "$C" && echo a > a && git add -A && git commit -qm a && git tag v1.0.0 \
              && echo b > b && git add -A && git commit -qm b )
          DESC="$(git -C "$C" describe --tags)"        # v1.0.0-1-g<sha>
          SHA="$(git -C "$C" rev-parse --short HEAD)"
          V="$RUNNER_TEMP/refvault"; mkdir -p "$V/repos"
          # (1) describe-form ref for the CURRENT tag — the false flag
          printf -- '---\ntitle: P\ntype: repo\nboundary: personal\nsources:\n  repo: proj\n  ref: %s\n  sha: %s\n---\n\n# P\n\n[[a]] [[b]]\n' "$DESC" "$SHA" > "$V/repos/proj.md"
          # (2) genuinely behind — must STILL be flagged, or the fix is just a mute button
          printf -- '---\ntitle: Q\ntype: repo\nboundary: personal\nsources:\n  repo: proj\n  ref: v0.9.0\n  sha: %s\n---\n\n# Q\n\n[[a]] [[b]]\n' "$SHA" > "$V/repos/behind.md"

          scan() { UPKEEP_REPOS_ROOT="$RUNNER_TEMP/refrepos" ./bin/upkeep.sh scan --wiki "$V" >/dev/null 2>&1
                   awk -F'\t' '$2=="refresh"{print $3}' "$V/.upkeep/queue.tsv" 2>/dev/null; }
          q="$(scan)"
          printf '%s' "$q" | grep -q 'repos/proj.md' \
            && { echo "  FAIL a describe ref for the current tag is still false-flagged"; fail=1; } \
            || echo "  ok   a describe ref for the current tag is not flagged"
          printf '%s' "$q" | grep -q 'repos/behind.md' \
            && echo "  ok   a page genuinely behind the latest tag is still flagged" \
            || { echo "  FAIL the real drift was muted along with the noise"; fail=1; }

          # The gate must be RED before migration and GREEN after — and the migration
          # ships in the same release precisely so the gate lands at zero. Shipping the
          # gate alone would hand every affected vault a backlog it cannot commit past.
          out="$(./bin/lint.sh --wiki "$V" 2>&1 || true)"
          printf '%s' "$out" | grep -q 'is a git-describe string' \
            && echo "  ok   lint rejects a describe-form ref" \
            || { echo "  FAIL lint accepted a describe ref"; fail=1; }

          WIKI="$V" ENGINE="$PWD" ADOPT_LIB="$PWD/bin/adopt-lib.sh" ADOPT_CHECK=1 \
            bash adopt.d/50-normalize-repo-refs.sh | grep -q 'would normalise' \
            && echo "  ok   --check reports the migration" \
            || { echo "  FAIL --check said nothing"; fail=1; }
          grep -qF "$DESC" "$V/repos/proj.md" \
            && echo "  ok   --check did not write" \
            || { echo "  FAIL --check modified the page"; fail=1; }

          WIKI="$V" ENGINE="$PWD" ADOPT_LIB="$PWD/bin/adopt-lib.sh" ADOPT_CHECK="" \
            bash adopt.d/50-normalize-repo-refs.sh >/dev/null
          grep -qE '^  ref: v1\.0\.0$' "$V/repos/proj.md" \
            && echo "  ok   the ref is normalised to its base tag" \
            || { echo "  FAIL normalisation wrong: $(grep 'ref:' "$V/repos/proj.md")"; fail=1; }
          # sha is the field that carries the commit offset; it must be untouched
          grep -qE "^  sha: $SHA$" "$V/repos/proj.md" \
            && echo "  ok   sha is untouched, so nothing was lost" \
            || { echo "  FAIL sha was altered"; fail=1; }

          cp "$V/repos/proj.md" "$RUNNER_TEMP/once"
          WIKI="$V" ENGINE="$PWD" ADOPT_LIB="$PWD/bin/adopt-lib.sh" ADOPT_CHECK="" \
            bash adopt.d/50-normalize-repo-refs.sh >/dev/null
          diff -q "$V/repos/proj.md" "$RUNNER_TEMP/once" >/dev/null \
            && echo "  ok   migration is idempotent" \
            || { echo "  FAIL second run changed the page again"; fail=1; }

          ./bin/lint.sh --wiki "$V" 2>&1 | grep -q 'no repo page records a git-describe ref' \
            && echo "  ok   the gate is green after migration — it lands at zero" \
            || { echo "  FAIL gate still red after migration"; fail=1; }

          # ...and the real drift survives all of it.
          scan | grep -q 'repos/behind.md' \
            && echo "  ok   the genuine drift is still queued after migration" \
            || { echo "  FAIL real drift lost"; fail=1; }

          exit "$fail"

      - name: sync-clones fast-forwards only, and scan stays offline
        run: |
          # upkeep/verify measure freshness against the LOCAL clone's HEAD, offline by
          # design. A lagging clone therefore produces a FALSE NEGATIVE: the page
          # refreshes and `verified:` is stamped against a sha behind the real release,
          # so the vault reports a clean fully-verified state that is quietly wrong —
          # invisible in exactly the output meant to surface staleness. sync-clones is
          # the opt-in network step; the detector must stay offline.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-sync"
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main
          T="$RUNNER_TEMP/sync"; mkdir -p "$T"; fail=0
          mkr() {
            git init -q --bare "$T/up/$1"
            git clone -q "$T/up/$1" "$T/repos/$1" 2>/dev/null
            ( cd "$T/repos/$1" && echo v1 > f && git add -A && git commit -qm c1 && git push -q -u origin main )
          }
          for r in cleanff dirty detached noupstream diverged uptodate; do mkr "$r"; done
          for r in cleanff dirty detached diverged; do
            git clone -q "$T/up/$r" "$T/tmp-$r"
            ( cd "$T/tmp-$r" && echo v2 > f && git commit -qam c2 && git push -q )
          done
          ( cd "$T/repos/dirty" && echo local-edit > f )
          ( cd "$T/repos/detached" && git checkout -q --detach HEAD )
          ( cd "$T/repos/noupstream" && git checkout -qb orphan )
          ( cd "$T/repos/diverged" && echo mine > g && git add -A && git commit -qm local-only )
          V="$T/v"; mkdir -p "$V/repos"
          for r in cleanff dirty detached noupstream diverged uptodate; do
            printf -- '---\ntitle: %s\ntype: repo\nboundary: personal\nsources:\n  repo: %s\n  ref: v1\n  sha: x\n---\n\n# %s\n\n[[a]] [[b]]\n' "$r" "$r" "$r" > "$V/repos/$r.md"
          done
          run() { UPKEEP_REPOS_ROOT="$T/repos" ./bin/upkeep.sh --wiki "$V" sync-clones "$@"; }

          # --check must not fetch or modify anything.
          b_clean="$(git -C "$T/repos/cleanff" rev-parse HEAD)"
          run --check | grep -q 'would' || { echo "  FAIL --check reported nothing"; fail=1; }
          [ "$(git -C "$T/repos/cleanff" rev-parse HEAD)" = "$b_clean" ] \
            && echo "  ok   --check modifies nothing" \
            || { echo "  FAIL --check moved a clone"; fail=1; }

          out="$(run)"
          printf '%s\n' "$out"
          # Each refusal must be SKIPPED AND NAMED — silence would recreate the original
          # bug one level up, with the operator again believing everything is current.
          for pat in "skip   dirty.*uncommitted" "skip   detached.*detached HEAD" \
                     "skip   noupstream.*tracks no upstream" "skip   diverged.*diverged from"; do
            printf '%s' "$out" | grep -qE "$pat" \
              && echo "  ok   reported: $pat" \
              || { echo "  FAIL not reported: $pat"; fail=1; }
          done
          printf '%s' "$out" | grep -q 'synced cleanff' \
            && echo "  ok   a clean tracking clone fast-forwards" \
            || { echo "  FAIL cleanff did not sync"; fail=1; }

          # ...and none of the refused clones was touched IN ANY WAY.
          [ "$(cat "$T/repos/dirty/f")" = "local-edit" ] \
            && echo "  ok   the dirty clone's local edit survived" \
            || { echo "  FAIL a dirty clone was modified"; fail=1; }
          git -C "$T/repos/detached" symbolic-ref -q HEAD >/dev/null \
            && { echo "  FAIL a detached clone was re-attached"; fail=1; } \
            || echo "  ok   the detached clone is still detached"
          git -C "$T/repos/diverged" log --oneline -1 | grep -q local-only \
            && echo "  ok   the diverged clone kept its local commit" \
            || { echo "  FAIL a diverged clone lost work"; fail=1; }

          # Idempotent.
          run | grep -q '0 synced' \
            && echo "  ok   a second run is a no-op" \
            || { echo "  FAIL not idempotent"; fail=1; }

          # THE VAULT'S OWN CHECKOUT IS NEVER PULLED. A vault that documents itself has a
          # page whose clone IS the tree a session is working in.
          S="$T/selfv"; mkdir -p "$S/repos"; git init -q "$S"
          printf -- '---\ntitle: self\ntype: repo\nboundary: personal\nsources:\n  repo: selfv\n  ref: v1\n  sha: x\n---\n\n# self\n\n[[a]] [[b]]\n' > "$S/repos/selfv.md"
          UPKEEP_REPOS_ROOT="$T" ./bin/upkeep.sh --wiki "$S" sync-clones 2>&1 \
            | grep -q "own checkout" \
            && echo "  ok   the vault's own checkout is skipped by name" \
            || { echo "  FAIL the vault's own checkout was not skipped"; fail=1; }

          # ASSERTED AT THE COMMAND LEVEL, not merely by outcome: the verb must never
          # issue a force, a stash, a rebase, or a plain pull. `pull` is excluded because
          # it consults pull.rebase — what it does would depend on operator config rather
          # than on this code — and `merge` appears only as `merge --ff-only`, which
          # cannot create a commit and runs only after is-ancestor has proven the case.
          body="$(awk '/^  sync-clones\)/{f=1} f{print} f&&/^    ;;/{exit}' bin/upkeep.sh \
                  | grep -vE '^\s*#')"
          for bad in 'git .*--force' 'git .*stash' 'git .*rebase' 'git .*[^-]pull'; do
            printf '%s' "$body" | grep -qE "$bad" \
              && { echo "  FAIL sync-clones issues a forbidden command: $bad"; fail=1; } \
              || echo "  ok   never issues: $bad"
          done
          printf '%s' "$body" | grep -q 'merge --ff-only' \
            || { echo "  FAIL the ff-only merge went missing"; fail=1; }

          # scan and verify-status MUST stay offline. Proven with a git that dies on any
          # network verb — if either reached the network, this goes red.
          FAKE="$RUNNER_TEMP/nonet"; mkdir -p "$FAKE"
          REALGIT="$(command -v git)"
          printf '#!/bin/sh\nfor a in "$@"; do case "$a" in fetch|ls-remote|pull|push) echo "NETWORK BLOCKED" >&2; exit 99;; esac; done\nexec %s "$@"\n' "$REALGIT" > "$FAKE/git"
          chmod +x "$FAKE/git"
          PATH="$FAKE:$PATH" UPKEEP_REPOS_ROOT="$T/repos" ./bin/upkeep.sh --wiki "$V" scan >/dev/null 2>&1 \
            && echo "  ok   scan still works with the network blocked" \
            || { echo "  FAIL scan reached the network"; fail=1; }
          PATH="$FAKE:$PATH" ./bin/verify-status.sh --wiki "$V" >/dev/null 2>&1 \
            && echo "  ok   verify-status still works with the network blocked" \
            || { echo "  FAIL verify-status reached the network"; fail=1; }

          exit "$fail"

      - name: A repo page whose clone cannot be found is reported, not skipped
        run: |
          # The scan resolved a clone by joining the repos root to the page's declared
          # sources.repo and swallowed a miss with a bare `continue` — so a page whose
          # clone sits under a DIFFERENT directory name (a rename, a disambiguating
          # prefix, a second checkout) was dropped from the freshness comparison with no
          # row of any kind emitted about it. Fail-open, and disguised rather than merely
          # quiet: the same page still appears via the verify: path, which needs no clone,
          # so the operator drains it and concludes it was attended to.
          #
          # It also changed what a clean queue MEANS — from "every repo page matches its
          # clone" to "every repo page whose clone I could find matches".
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-unres"
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main
          T="$RUNNER_TEMP/unres"; rm -rf "$T"; mkdir -p "$T/repos"; fail=0

          # a clone that exists, under a name that is NOT the page's sources.repo
          git init -q "$T/repos/other-name"
          ( cd "$T/repos/other-name" && echo v1 > f && git add -A && git commit -qm c1 )
          # a clone that resolves and IS stale, so the working path is proven in the same run
          git init -q "$T/repos/good"
          ( cd "$T/repos/good" && echo v1 > f && git add -A && git commit -qm c1 )

          V="$T/v"; mkdir -p "$V/repos"
          printf -- '---\ntitle: mismatch\ntype: repo\nboundary: personal\nsources:\n  repo: canonical-name\n  ref: v1\n  sha: deadbee\n---\n\n# mismatch\n' > "$V/repos/mismatch.md"
          printf -- '---\ntitle: good\ntype: repo\nboundary: personal\nsources:\n  repo: good\n  ref: v1\n  sha: deadbee\n---\n\n# good\n' > "$V/repos/good.md"

          out="$(UPKEEP_REPOS_ROOT="$T/repos" ./bin/upkeep.sh --wiki "$V" scan 2>&1)"
          printf '%s\n' "$out"
          rows="$(UPKEEP_REPOS_ROOT="$T/repos" ./bin/upkeep.sh --wiki "$V" list 2>&1)"
          printf '%s\n' "$rows"

          printf '%s' "$rows" | grep -q '^unresolvable:mismatch' \
            && echo "  ok   the unlocatable clone is reported as its own state" \
            || { echo "  FAIL the page was silently dropped from the scan"; fail=1; }
          printf '%s' "$rows" | grep -q 'refresh:good' \
            && echo "  ok   a resolvable stale page still queues normally" \
            || { echo "  FAIL the working path regressed"; fail=1; }
          # the row must not read as ordinary drift, and must name both remedies
          printf '%s' "$rows" | grep -q 'freshness unknown' \
            && echo "  ok   the row says freshness is unknown, not up to date" \
            || { echo "  FAIL the row does not distinguish unknown from current"; fail=1; }
          printf '%s' "$out" | grep -q 'no locatable clone' \
            && echo "  ok   the scan summary says a clean queue means less than it looks" \
            || { echo "  FAIL scan summary hides the unassessed pages"; fail=1; }

          # sync-clones holds the same doctrine — a skip is a reported outcome — and was
          # silent about exactly this case while naming dirty trees and detached HEADs
          sc="$(UPKEEP_REPOS_ROOT="$T/repos" ./bin/upkeep.sh --wiki "$V" sync-clones --check 2>&1)"
          printf '%s' "$sc" | grep -q 'no clone at' \
            && echo "  ok   sync-clones names the clone it could not find" \
            || { echo "  FAIL sync-clones skipped it silently"; fail=1; }

          # and the item is drainable like any other
          UPKEEP_REPOS_ROOT="$T/repos" ./bin/upkeep.sh --wiki "$V" done unresolvable:mismatch >/dev/null \
            && echo "  ok   the row drains through the normal verb" \
            || { echo "  FAIL the row cannot be drained"; fail=1; }

          exit "$fail"

      - name: gc sweeps orphan wt/* branches, and never a live one
        run: |
          # A wt/* branch was only ever evaluated as a SIDE EFFECT of retiring its
          # worktree, and the bare sweep looks only for stale worktrees — so a branch
          # whose worktree was already gone (crashed session, worktree removed some other
          # way) was unreapable by ANY invocation and simply accumulated. Third route to
          # the same unbounded growth v1.28.2 and v1.38.0 were each cut to stop; found in
          # the wild on a vault whose orphan was provably contained by both tests and
          # still needed deleting by hand.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-orphan"
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main
          WT="$GITHUB_WORKSPACE/bin/vault-worktree.sh"
          fail=0
          V="$RUNNER_TEMP/orphan"; mkdir -p "$V/memory"; git -C "$V" init -q .
          printf 'seed\n' > "$V/memory/seed.md"
          git -C "$V" -c core.hooksPath=/dev/null add -A
          git -C "$V" -c core.hooksPath=/dev/null commit -qm seed
          mk() {
            W="$(WIKI_PATH="$V" WIKI_WT_SESSION="$1" "$WT" ensure 2>/dev/null)"
            printf '%s\n' "$2" > "$W/memory/$2.md"
            git -C "$W" -c core.hooksPath=/dev/null add -A
            git -C "$W" -c core.hooksPath=/dev/null commit -qm "$2"
            printf '%s' "$W"
          }

          # (a) orphan whose content IS on main (squash-merged), worktree already gone
          W1="$(mk orphaned sq)"
          git -C "$V" merge -q --squash wt/orphaned >/dev/null 2>&1
          git -C "$V" -c core.hooksPath=/dev/null commit -qm "squashed (#1)"
          git -C "$V" worktree remove --force "$W1"
          # (b) orphan holding REAL work — must be kept, and still readable afterwards
          W2="$(mk stranded strand)"
          git -C "$V" worktree remove --force "$W2"
          # (c) a LIVE worktree's branch — the sweep must not even assess it
          W3="$(mk live alive)"

          out="$(WIKI_PATH="$V" "$WT" gc 2>&1)"
          printf '%s\n' "$out"
          printf '%s' "$out" | grep -q 'deleted wt/orphaned' \
            && echo "  ok   an orphan branch with no worktree is finally reaped" \
            || { echo "  FAIL orphan branch still unreapable"; fail=1; }
          git -C "$V" show main:memory/sq.md >/dev/null 2>&1 \
            || { echo "  FAIL reaped an orphan whose content is NOT on main"; fail=1; }

          printf '%s' "$out" | grep -q 'kept wt/stranded — UNINTEGRATED CONTENT' \
            && echo "  ok   an orphan holding real work is kept and named" \
            || { echo "  FAIL stranded orphan mis-reported"; fail=1; }
          git -C "$V" show wt/stranded:memory/strand.md >/dev/null 2>&1 \
            && echo "  ok   ...and its work is still readable" \
            || { echo "  FAIL stranded work destroyed"; fail=1; }

          # The live branch must be skipped BY DECISION, not merely because `branch -D`
          # would have refused — so assert the count excludes it, not just the outcome.
          printf '%s' "$out" | grep -q 'assessed 2 orphan branch(es)' \
            && echo "  ok   a checked-out branch is excluded from the sweep by decision" \
            || { echo "  FAIL live branch was assessed"; printf '%s\n' "$out"; fail=1; }
          [ -d "$W3" ] && git -C "$V" rev-parse --verify -q wt/live >/dev/null \
            && echo "  ok   the live worktree and its branch are untouched" \
            || { echo "  FAIL a live session's worktree or branch was disturbed"; fail=1; }

          # Idempotent: a second sweep reaps nothing new and keeps reporting the stranded one.
          out2="$(WIKI_PATH="$V" "$WT" gc 2>&1)"
          printf '%s' "$out2" | grep -q 'deleted' \
            && { echo "  FAIL second sweep deleted something"; fail=1; } \
            || echo "  ok   a second sweep is a no-op"

          exit "$fail"

      - name: ensure never reattaches to a stale base without saying so
        run: |
          # Reattaching to a surviving wt/<session> branch was reported as plain success:
          # exit 0, a valid path, genuine isolation — only the BASE was wrong, and nothing
          # surfaced that until merge time, when append-only pages conflict. Fail-open.
          #
          # And it is the NORMAL case for a squash-merging vault, not an edge case: the
          # branch is retained because its work is not an ancestor of main, so it grows
          # staler with every merge in the session — stale precisely BECAUSE its work
          # already landed.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-reattach"
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main
          T="$RUNNER_TEMP/reattach"; rm -rf "$T"; mkdir -p "$T"; fail=0
          VW="$GITHUB_WORKSPACE/bin/vault-worktree.sh"

          # a vault WITH an origin, since the base is origin/main
          git init -q --bare "$T/origin.git"
          git clone -q "$T/origin.git" "$T/vault" 2>/dev/null
          V="$T/vault"; printf 'log\n' > "$V/log.md"
          git -C "$V" add -A; git -C "$V" commit -qm seed; git -C "$V" push -q -u origin main
          export WIKI_PATH="$V"

          # (1) work lands by SQUASH merge, so the branch tip is not an ancestor of main
          W="$(WIKI_WT_SESSION=s1 "$VW" ensure 2>/dev/null)"
          printf 'session-entry\n' >> "$W/log.md"; git -C "$W" commit -qam "session work"
          git -C "$V" merge -q --squash wt/s1; git -C "$V" commit -qm squashed
          printf 'x\n' > "$V/other.md"; git -C "$V" add -A; git -C "$V" commit -qm "peer file"
          git -C "$V" push -q origin main
          git -C "$V" worktree remove --force "$W"

          out="$(WIKI_WT_SESSION=s1 "$VW" ensure 2>&1 >/dev/null)"
          W2="$(WIKI_WT_SESSION=s1 "$VW" ensure 2>/dev/null)"
          printf '%s\n' "$out"
          printf '%s' "$out" | grep -q 'held nothing origin/main lacks' \
            && echo "  ok   a branch whose content already landed is cut fresh, not reattached behind" \
            || { echo "  FAIL reattached to a branch with nothing left to protect"; fail=1; }
          [ "$(git -C "$W2" rev-parse HEAD)" = "$(git -C "$V" rev-parse origin/main)" ] \
            && echo "  ok   the returned worktree is level with origin/main" \
            || { echo "  FAIL the returned base is behind origin/main"; fail=1; }
          WIKI_WT_SESSION=s1 "$VW" gc "$W2" >/dev/null 2>&1 || true

          # (2) a branch that DOES hold work is never reset — it is kept, reattached, and
          # the distance is REPORTED rather than swallowed
          W="$(WIKI_WT_SESSION=s2 "$VW" ensure 2>/dev/null)"
          printf 'unmerged\n' > "$W/stranded.md"; git -C "$W" add -A; git -C "$W" commit -qm stranded
          printf 'peer\n' >> "$V/log.md"; git -C "$V" commit -qam "peer append"; git -C "$V" push -q origin main
          git -C "$V" worktree remove --force "$W"
          out2="$(WIKI_WT_SESSION=s2 "$VW" ensure 2>&1 >/dev/null)"
          printf '%s\n' "$out2"
          printf '%s' "$out2" | grep -q 'BEHIND origin/main' \
            && echo "  ok   the reattach reports how far behind the base is" \
            || { echo "  FAIL reattach reported plain success on a stale base"; fail=1; }
          printf '%s' "$out2" | grep -q 'rebase' \
            && echo "  ok   ...and says what to do about it" \
            || { echo "  FAIL no remedy offered"; fail=1; }
          git -C "$V" show-ref --verify --quiet refs/heads/wt/s2 \
            && echo "  ok   the branch holding work survives" \
            || { echo "  FAIL a branch holding unmerged work was destroyed"; fail=1; }
          [ -f "$T/vault/.worktrees/s2/stranded.md" ] \
            && echo "  ok   the unmerged work is still there" \
            || { echo "  FAIL unmerged work was lost"; fail=1; }

          exit "$fail"

      - name: A fresh cut says when canonical holds work the base lacks
        run: |
          # The reported staleness above is a COLLISION — loud, and the base gets
          # questioned. This is the quiet half: a worktree cut off origin/main omits
          # commits that live only in local main, so a SEARCH for that work prints
          # nothing and exits 0, which is indistinguishable from "nobody wrote it yet".
          # The session then duplicates work that already exists, and it lands as
          # content rather than as a conflict. No fetch can surface it — the commits
          # were never pushed — so the only remedy is saying so at cut time.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-freshcut"
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main
          T="$RUNNER_TEMP/freshcut"; rm -rf "$T"; mkdir -p "$T"; fail=0
          VW="$GITHUB_WORKSPACE/bin/vault-worktree.sh"

          git init -q --bare "$T/origin.git"
          git clone -q "$T/origin.git" "$T/vault" 2>/dev/null
          V="$T/vault"; printf 'log\n' > "$V/log.md"
          git -C "$V" add -A; git -C "$V" commit -qm seed; git -C "$V" push -q -u origin main
          export WIKI_PATH="$V"

          # (1) the ordinary habit: an earlier session committed and left the push for later
          printf 'prior coverage of the topic\n' > "$V/note.md"
          git -C "$V" add -A; git -C "$V" commit -qm "committed, not pushed"

          out="$(WIKI_WT_SESSION=f1 "$VW" ensure 2>&1 >/dev/null)"
          W="$(WIKI_WT_SESSION=f1 "$VW" ensure 2>/dev/null)"
          printf '%s\n' "$out"
          printf '%s' "$out" | grep -q 'main holds 1 commit(s) origin/main lacks' \
            && echo "  ok   the fresh cut reports the work its base omits" \
            || { echo "  FAIL a base omitting local work was reported as plain success"; fail=1; }
          printf '%s' "$out" | grep -qi 'search' \
            && echo "  ok   ...naming READS, the failure mode that actually applies" \
            || { echo "  FAIL the warning speaks only of merge-time conflicts"; fail=1; }
          printf '%s' "$out" | grep -q 'rebase main' \
            && echo "  ok   ...and offers the remedy against local main" \
            || { echo "  FAIL no remedy offered"; fail=1; }

          # the base is still origin/main: this warns, it must never silently re-base
          [ "$(git -C "$W" rev-parse HEAD)" = "$(git -C "$V" rev-parse origin/main)" ] \
            && echo "  ok   the promise ('off origin/main') is kept, not quietly changed" \
            || { echo "  FAIL ensure changed its base selection"; fail=1; }

          # (2) reuse is the same blind spot: a peer can integrate without pushing mid-session
          out2="$(WIKI_WT_SESSION=f1 "$VW" ensure 2>&1 >/dev/null)"
          printf '%s' "$out2" | grep -q 'origin/main lacks' \
            && echo "  ok   reuse reports it too — no fetch can surface a local-only commit" \
            || { echo "  FAIL a reused worktree hid work committed since the cut"; fail=1; }

          # (3) SILENCE when there is nothing to say — a warning on every cut is no warning
          git -C "$V" push -q origin main
          out3="$(WIKI_WT_SESSION=f2 "$VW" ensure 2>&1 >/dev/null)"
          printf '%s' "$out3" | grep -q 'lacks' \
            && { echo "  FAIL warned about a base that omits nothing"; fail=1; } \
            || echo "  ok   a level base is not warned about"

          exit "$fail"

      - name: A project claim is visible presence, and never a lock
        run: |
          # Two collision classes are already covered — vault edits collide as merge
          # conflicts, working trees are isolated per session. The uncovered class is the
          # work performed OUTSIDE version control: investigation both sessions repeat, and
          # commands issued against external systems, where they contend silently.
          #
          # The property under test is that this stays VISIBILITY. It rides the lease
          # record rather than a store of its own, so liveness is decided in one place; and
          # it must never block, because a gate that blocks at the wrong moment trains its
          # user to force past it, which removes the gate entirely.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-claim"
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main
          T="$RUNNER_TEMP/claim"; rm -rf "$T"; mkdir -p "$T/v"; fail=0
          V="$T/v"; git -C "$V" init -q .; printf 'seed\n' > "$V/a.md"
          git -C "$V" add -A; git -C "$V" commit -qm seed
          export WIKI_PATH="$V"
          WIKI_WT_SESSION=alpha ./bin/vault-worktree.sh ensure >/dev/null 2>&1
          WIKI_WT_SESSION=beta  ./bin/vault-worktree.sh ensure >/dev/null 2>&1

          WIKI_WT_SESSION=alpha ./bin/vault-worktree.sh claim proj-x >/dev/null 2>&1
          out="$(WIKI_WT_SESSION=beta ./bin/vault-worktree.sh claim proj-x 2>&1)"; rc=$?
          printf '%s\n' "$out"
          printf '%s' "$out" | grep -q "session alpha is also on project 'proj-x'" \
            && echo "  ok   a second session on one project is told who else is there" \
            || { echo "  FAIL the overlap was not reported"; fail=1; }
          printf '%s' "$out" | grep -qE 'active [0-9]+m ago' \
            && echo "  ok   ...with the holder's activity age" \
            || { echo "  FAIL no activity age reported"; fail=1; }
          [ "$rc" = "0" ] \
            && echo "  ok   and it does NOT block — advisory, not a lock" \
            || { echo "  FAIL claim refused (rc=$rc); this is presence, not mutual exclusion"; fail=1; }

          # different projects must not gate each other, or the signal becomes noise
          out2="$(WIKI_WT_SESSION=beta ./bin/vault-worktree.sh claim proj-y 2>&1)"
          printf '%s' "$out2" | grep -q 'also on project' \
            && { echo "  FAIL warned about a different project"; fail=1; } \
            || echo "  ok   two sessions on two projects never gate each other"

          # a claim rides the LEASE — one record, one liveness rule
          grep -q '^project=proj-y$' "$V/.worktrees/.leases/beta.lease" \
            && echo "  ok   the claim is recorded on the session's existing lease" \
            || { echo "  FAIL a parallel claim store appeared"; fail=1; }
          WIKI_WT_SESSION=beta ./bin/vault-worktree.sh peers | grep -q 'proj-y' \
            && echo "  ok   peers reports the project" \
            || { echo "  FAIL peers does not show claims"; fail=1; }

          # a session that provably ended is reported STALE, not silently reaped: a session
          # that died mid-work is exactly what a human should be able to see
          git -C "$V" worktree remove --force "$V/.worktrees/alpha"
          git -C "$V" branch -D wt/alpha >/dev/null 2>&1
          rep="$(WIKI_WT_SESSION=beta ./bin/vault-worktree.sh claim 2>&1)"
          printf '%s\n' "$rep"
          printf '%s' "$rep" | grep -q 'alpha .* STALE' \
            && echo "  ok   a dead session's claim is shown as stale, not deleted" \
            || { echo "  FAIL a dead claim vanished or still reads as live"; fail=1; }
          out3="$(WIKI_WT_SESSION=beta ./bin/vault-worktree.sh claim proj-x 2>&1)"
          printf '%s' "$out3" | grep -q 'also on project' \
            && { echo "  FAIL warned about a session that has finished"; fail=1; } \
            || echo "  ok   ...and no longer warns about it, so no manual cleanup is needed"

          exit "$fail"

      - name: A bare status sees every local record, not just the retired one
        run: |
          # The slug-collection loop globbed *.outbox — the LEGACY copy-paste artifact the
          # supported path no longer produces — so the bare listing enumerated exactly the
          # artifact class that had been retired and ignored the markers submit/push write.
          # Fail-open: a confident, well-formed "no proposals" while submitted markers sat
          # beside it, which is the duplicate-resend trap this subcommand exists to prevent.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-bare"
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main
          T="$RUNNER_TEMP/bare"; rm -rf "$T"; mkdir -p "$T/vault/.engine-proposal"; fail=0
          V="$T/vault"; git -C "$V" init -q .
          printf -- '---\nboundary: personal\n---\n' > "$V/CLAUDE.md"
          git -C "$V" add -A; git -C "$V" commit -qm seed
          # status reads an engine checkout; this repo is one
          ln -s "$GITHUB_WORKSPACE" "$V/engine"

          printf 'proposal/alpha\n' > "$V/.engine-proposal/alpha.submitted"
          printf 'proposal/beta\n'  > "$V/.engine-proposal/beta.prepared"
          out="$(./bin/engine-proposal.sh status --vault "$V" 2>&1)"
          printf '%s\n' "$out"
          printf '%s' "$out" | grep -q 'SUBMITTED, not yet merged' \
            && echo "  ok   a submitted marker appears in the bare listing" \
            || { echo "  FAIL a pushed proposal is invisible without --slug"; fail=1; }
          printf '%s' "$out" | grep -q 'WRITTEN LOCALLY' \
            && echo "  ok   a prepared marker appears too" \
            || { echo "  FAIL a prepared proposal is invisible without --slug"; fail=1; }

          # both markers for one slug is the normal end state — prepare then push — and
          # must read as ONE proposal, not two
          printf 'proposal/alpha\n' > "$V/.engine-proposal/alpha.prepared"
          n="$(./bin/engine-proposal.sh status --vault "$V" 2>&1 | grep -cE '^  alpha ')"
          [ "$n" = "1" ] \
            && echo "  ok   a slug with both markers is reported once" \
            || { echo "  FAIL slug reported $n times"; fail=1; }

          # and the empty case must not imply a clean slate
          rm -f "$V"/.engine-proposal/*
          e="$(./bin/engine-proposal.sh status --vault "$V" 2>&1)"
          printf '%s' "$e" | grep -q 'not evidence that nothing is' \
            && echo "  ok   an empty result still says it is not proof of nothing outstanding" \
            || { echo "  FAIL the empty case implies a clean slate"; fail=1; }
          printf '%s' "$e" | grep -q 'submitted or prepared markers' \
            && echo "  ok   ...and names what it actually scanned" \
            || { echo "  FAIL the empty message still describes only the outbox"; fail=1; }

          exit "$fail"

      - name: A hook wired into an event with two same-matcher entries lands once
        run: |
          # The writer used `map`, which visits EVERY entry, so an event already holding two
          # entries that share the requested matcher received the command TWICE — the hook
          # then ran twice per event, doubling every side effect it has. Fail-open in the
          # worst way: the write printed one success line, a `--check` afterwards printed
          # nothing, and re-running — the natural way to confirm wiring — was a silent no-op
          # that read as confirmation. Nothing the tool printed ever said "two".
          T="$RUNNER_TEMP/ensure-hook-dupes"; rm -rf "$T"; mkdir -p "$T"; fail=0
          cmds()  { jq -c '[.hooks.TestEvent[].hooks[].command]' "$1"; }
          n_new() { jq '[.hooks.TestEvent[].hooks[] | select(.command == "echo NEW")] | length' "$1"; }

          # two matcher-LESS entries: the ordinary shape for an event that takes no matcher
          printf '%s' '{"hooks":{"TestEvent":[{"hooks":[{"type":"command","command":"echo group-one"}]},{"hooks":[{"type":"command","command":"echo group-two"}]}]}}' > "$T/a.json"
          ./bin/ensure-hook.sh --event TestEvent --command 'echo NEW' --settings "$T/a.json"
          cmds "$T/a.json"
          [ "$(n_new "$T/a.json")" = "1" ] \
            && echo "  ok   matcher-less: the command landed in exactly one entry" \
            || { echo "  FAIL wired $(n_new "$T/a.json") times across matcher-less entries"; fail=1; }

          # ...and it is still ADD-ONLY: neither pre-existing command may be disturbed
          [ "$(cmds "$T/a.json")" = '["echo group-one","echo NEW","echo group-two"]' ] \
            && echo "  ok   ...appended to the FIRST matching entry, nothing else touched" \
            || { echo "  FAIL add-only violated: $(cmds "$T/a.json")"; fail=1; }

          # not specific to matcher-less events — two entries carrying the same matcher token
          printf '%s' '{"hooks":{"TestEvent":[{"matcher":"startup","hooks":[{"type":"command","command":"echo g1"}]},{"matcher":"startup","hooks":[{"type":"command","command":"echo g2"}]}]}}' > "$T/b.json"
          ./bin/ensure-hook.sh --event TestEvent --matcher startup --command 'echo NEW' --settings "$T/b.json"
          [ "$(n_new "$T/b.json")" = "1" ] \
            && echo "  ok   same-matcher entries: wired once" \
            || { echo "  FAIL wired $(n_new "$T/b.json") times across same-matcher entries"; fail=1; }

          # re-running stays the documented no-op, and does not drift the file
          before="$(cat "$T/a.json")"
          out="$(./bin/ensure-hook.sh --event TestEvent --command 'echo NEW' --settings "$T/a.json" 2>&1)"
          { [ -z "$out" ] && [ "$before" = "$(cat "$T/a.json")" ]; } \
            && echo "  ok   re-running is still a silent no-op" \
            || { echo "  FAIL re-run was not a no-op: $out"; fail=1; }

          # --check must now SAY something about a doubled hook, whatever created it: this
          # defect, a hand edit, or two tools wiring the same command. Silence here is what
          # let the duplicate above pass for correct wiring.
          printf '%s' '{"hooks":{"TestEvent":[{"hooks":[{"type":"command","command":"echo NEW"}]},{"hooks":[{"type":"command","command":"echo NEW"}]}]}}' > "$T/dupe.json"
          keep="$(cat "$T/dupe.json")"
          chk="$(./bin/ensure-hook.sh --event TestEvent --command 'echo NEW' --settings "$T/dupe.json" --check 2>&1)"; rc=$?
          printf '%s\n' "$chk"
          printf '%s' "$chk" | grep -q 'duplicate' \
            && echo "  ok   --check reports the count greater than one" \
            || { echo "  FAIL --check is silent about a doubled hook"; fail=1; }
          [ "$rc" = "0" ] \
            && echo "  ok   ...and still exits 0, so it can never block a session start" \
            || { echo "  FAIL --check exited $rc"; fail=1; }
          [ "$keep" = "$(cat "$T/dupe.json")" ] \
            && echo "  ok   ...and reports without writing: add-only never removes a hook" \
            || { echo "  FAIL --check mutated the settings file"; fail=1; }

          # a command under two DISJOINT matchers is legitimate and never double-fires —
          # flagging it would make the new report noise the day it shipped
          printf '%s' '{"hooks":{"TestEvent":[{"matcher":"startup","hooks":[{"type":"command","command":"echo NEW"}]},{"matcher":"resume","hooks":[{"type":"command","command":"echo NEW"}]}]}}' > "$T/disjoint.json"
          d="$(./bin/ensure-hook.sh --event TestEvent --matcher startup --command 'echo NEW' --settings "$T/disjoint.json" --check 2>&1)"
          [ -z "$d" ] \
            && echo "  ok   disjoint matchers are not reported as duplicates" \
            || { echo "  FAIL false duplicate on disjoint matchers: $d"; fail=1; }

          # ...but OVERLAPPING ones are, and that is not a false positive: this is the
          # partial-overlap append the tool documents (add-only cannot collapse an existing
          # NARROWER matcher), and on a startup event both entries really do fire. Pinned so
          # a later reader does not "fix" the report by silencing this case.
          printf '%s' '{"hooks":{"TestEvent":[{"matcher":"startup","hooks":[{"type":"command","command":"echo NEW"}]},{"matcher":"startup|resume","hooks":[{"type":"command","command":"echo NEW"}]}]}}' > "$T/overlap.json"
          v="$(./bin/ensure-hook.sh --event TestEvent --matcher startup --command 'echo NEW' --settings "$T/overlap.json" --check 2>&1)"
          printf '%s' "$v" | grep -q '2 times per event' \
            && echo "  ok   overlapping matchers that really do double-fire are reported" \
            || { echo "  FAIL overlap went unreported: $v"; fail=1; }

          exit "$fail"

      - name: A hook can state its own timeout, and one wired without a big enough timeout is reported
        run: |
          # A hook that names no `timeout` inherits the HOST's window. That window is short
          # at SessionEnd — a hook was observed cancelled at about one second — and
          # `rag-capture.sh` at a workspace root takes seconds, because `touched()` runs git
          # in every sibling repo. The engine documented that wiring with no timeout, so the
          # capture was cancelled on exactly the machines with the most to capture, and the
          # failure is invisible: the hook is still wired, the script never reaches its own
          # output line, and an empty buffer reads as a quiet month. The tool could not even
          # express the field. It can now — and, because add-only must not edit a hook the
          # user already has, the pre-timeout wiring is REPORTED rather than repaired.
          T="$RUNNER_TEMP/ensure-hook-timeout"; rm -rf "$T"; mkdir -p "$T"; fail=0
          to() { jq -c '[.hooks.TestEvent[].hooks[] | select(.command == "echo SLOW") | .timeout]' "$1"; }

          printf '%s' '{}' > "$T/new.json"
          ./bin/ensure-hook.sh --event TestEvent --command 'echo SLOW' --timeout 30 --settings "$T/new.json" >/dev/null
          [ "$(to "$T/new.json")" = "[30]" ] \
            && echo "  ok   --timeout is written into the hook object" \
            || { echo "  FAIL timeout absent from a newly wired hook: $(to "$T/new.json")"; fail=1; }

          # ...and omitting it still writes NO timeout key, so every existing caller and
          # every already-wired settings.json is byte-for-byte unaffected.
          printf '%s' '{}' > "$T/bare.json"
          ./bin/ensure-hook.sh --event TestEvent --command 'echo SLOW' --settings "$T/bare.json" >/dev/null
          [ "$(to "$T/bare.json")" = "[null]" ] \
            && echo "  ok   no --timeout still writes no timeout key" \
            || { echo "  FAIL a timeout appeared with no --timeout: $(to "$T/bare.json")"; fail=1; }

          # A malformed value is refused BEFORE any write. `"timeout": "30"` or `0` is worse
          # than none: the field is present, so it reads as handled while the host falls back
          # to its default or cancels at once. The message must name the VALUE — asserting
          # only "exit 2" would pass on a build where --timeout was never implemented.
          for bad in 0 -5 abc 1.5 ''; do
            printf '%s' '{}' > "$T/bad.json"; keep="$(cat "$T/bad.json")"
            # `&& rc=0 || rc=$?` and not `; rc=$?`: this step runs under `bash -e`, where a
            # bare assignment from a command that exits non-zero kills the step before the
            # assertion is ever read. The first version did exactly that.
            out="$(./bin/ensure-hook.sh --event TestEvent --command 'echo SLOW' --timeout "$bad" --settings "$T/bad.json" 2>&1)" && rc=0 || rc=$?
            { [ "$rc" = "2" ] && [ "$keep" = "$(cat "$T/bad.json")" ] \
                && printf '%s' "$out" | grep -q 'timeout must be'; } \
              && echo "  ok   --timeout '$bad' refused (exit 2), file untouched" \
              || { echo "  FAIL --timeout '$bad' exited $rc: $out"; fail=1; }
          done

          # THE REPORTED CASE: already wired, timeout-less — the state of every vault that
          # copied the old snippet. No write, exit 0, and it must SAY so.
          printf '%s' '{"hooks":{"TestEvent":[{"hooks":[{"type":"command","command":"echo SLOW"}]}]}}' > "$T/stale.json"
          keep="$(cat "$T/stale.json")"
          out="$(./bin/ensure-hook.sh --event TestEvent --command 'echo SLOW' --timeout 30 --settings "$T/stale.json" 2>&1)" && rc=0 || rc=$?
          printf '%s\n' "$out"
          printf '%s' "$out" | grep -q 'wired without a timeout' \
            && echo "  ok   an already-wired timeout-less hook is reported" \
            || { echo "  FAIL wired-without-timeout went unreported: $out"; fail=1; }
          [ "$keep" = "$(cat "$T/stale.json")" ] \
            && echo "  ok   ...without editing the user's hook (still add-only)" \
            || { echo "  FAIL the report came with a write"; fail=1; }
          [ "$rc" = "0" ] \
            && echo "  ok   ...and exits 0, so it can never block a session" \
            || { echo "  FAIL exited $rc"; fail=1; }

          # A user who already chose a LARGER timeout has solved it. Reporting that would
          # make the new message noise on exactly the vaults that got it right.
          printf '%s' '{"hooks":{"TestEvent":[{"hooks":[{"type":"command","command":"echo SLOW","timeout":60}]}]}}' > "$T/big.json"
          out="$(./bin/ensure-hook.sh --event TestEvent --command 'echo SLOW' --timeout 30 --settings "$T/big.json" 2>&1)"
          [ -z "$out" ] \
            && echo "  ok   a larger existing timeout is left alone, silently" \
            || { echo "  FAIL false report against a sufficient timeout: $out"; fail=1; }

          exit "$fail"

      - name: lint-docs catches a documented hook snippet that states no timeout
        run: |
          # The gate is only worth having if it can go red. Its first version could not: it
          # toggled on ANY line containing a fence, and USAGE.md quotes one mid-sentence
          # inside a table cell — an odd fence count, so the real hook snippet was read as
          # prose and a doc with no timeout at all passed. Prove the red directly.
          fail=0
          ./bin/lint-docs.sh >/dev/null 2>&1 \
            && echo "  ok   the live docs pass as they stand" \
            || { echo "  FAIL lint-docs is red before the fixture is applied"; fail=1; }

          cp USAGE.md "$RUNNER_TEMP/USAGE.keep"
          perl -0pi -e 's/",\n      "timeout": 30\n/"\n/' USAGE.md
          grep -q '"timeout": 30' USAGE.md \
            && { echo "  FAIL the fixture did not remove the timeout — the red below proves nothing"; fail=1; } \
            || echo "  ok   fixture applied: the snippet now states no timeout"

          out="$(./bin/lint-docs.sh 2>&1)" && rc=0 || rc=$?
          cp "$RUNNER_TEMP/USAGE.keep" USAGE.md
          printf '%s\n' "$out" | grep -q 'no "timeout"' \
            && echo "  ok   ...and lint-docs names the file and line" \
            || { echo "  FAIL lint-docs said nothing about the missing timeout: $out"; fail=1; }
          [ "$rc" != "0" ] \
            && echo "  ok   ...and exits non-zero, so CI fails on it" \
            || { echo "  FAIL lint-docs exited 0 with a timeout-less snippet"; fail=1; }

          ./bin/lint-docs.sh >/dev/null 2>&1 \
            && echo "  ok   docs restored, gate green again" \
            || { echo "  FAIL the restore did not put USAGE.md back"; fail=1; }
          exit "$fail"

      - name: A handoff skill cannot site the Expected-versus-fix rule on one surface only
        run: |
          # The defect was ASYMMETRY: the rule lived in the intake section, which only the
          # maintainer reads, so a reporter got no chance to catch their own unreachable
          # Expected before submitting. A gate against that must go red when either surface
          # loses it, AND must not merely pin the sentence that happens to be there now —
          # otherwise the next rewrite fails a better wording while a fenced example passes.
          # Both directions are proven here; the middle one is the case a break-it-once test
          # would have missed.
          fail=0
          ./bin/lint-docs.sh >/dev/null 2>&1 \
            && echo "  ok   the live docs pass as they stand" \
            || { echo "  FAIL lint-docs is red before any fixture"; fail=1; }

          S=skills/engine-proposal/SKILL.md
          cp "$S" "$RUNNER_TEMP/SKILL.keep"

          # 1. drop the reporter-facing site -> red, and it says how many sites it found
          perl -0pi -e 's/^- \*\*Then read your own Expected.*\n//m' "$S"
          grep -qF 'Then read your own Expected' "$S" \
            && { echo "  FAIL fixture 1 did not apply — the red below proves nothing"; fail=1; } \
            || echo "  ok   fixture 1: reporter-facing site removed"
          out="$(./bin/lint-docs.sh 2>&1)" && rc=0 || rc=$?
          printf '%s\n' "$out" | grep -q 'sites the Expected-versus-fix rule in 1 section' \
            && echo "  ok   ...gate names the single-siting and counts it" \
            || { echo "  FAIL gate said nothing about siting: $out"; fail=1; }
          [ "$rc" != "0" ] || { echo "  FAIL gate exited 0 with the rule sited once"; fail=1; }
          cp "$RUNNER_TEMP/SKILL.keep" "$S"

          # 2. blank the template's Expected field -> red on its own, independently of 1
          perl -0pi -e 's/^  If you copied this from another tool.*\n  lets it say this.*\n//m' "$S"
          grep -qF 'lets it say this' "$S" \
            && { echo "  FAIL fixture 2 did not apply"; fail=1; } \
            || echo "  ok   fixture 2: template Expected back to a bare placeholder"
          out="$(./bin/lint-docs.sh 2>&1)" && rc=0 || rc=$?
          printf '%s\n' "$out" | grep -q 'without relating it to the suggested fix' \
            && echo "  ok   ...gate names the template field" \
            || { echo "  FAIL gate silent on the template: $out"; fail=1; }
          [ "$rc" != "0" ] || { echo "  FAIL gate exited 0 with a bare Expected field"; fail=1; }
          cp "$RUNNER_TEMP/SKILL.keep" "$S"

          # 3. NEAR-MISS, the one that matters: reword the rule, keep it sited -> must stay
          # GREEN. A gate that reddens here is asserting today's prose, not the property.
          perl -0pi -e 's/^- \*\*Then read your own Expected against your own suggested fix, before you send it\.\*\*.*$/- **Compare the two fields yourself.** Can the fix you wrote deliver the Expected you wrote? If not, the Expected is the one to keep./m' "$S"
          grep -qF 'Compare the two fields yourself' "$S" \
            && echo "  ok   fixture 3: rule reworded, still sited on both surfaces" \
            || { echo "  FAIL fixture 3 did not apply"; fail=1; }
          ./bin/lint-docs.sh >/dev/null 2>&1 \
            && echo "  ok   ...still green: the gate asserts the property, not the sentence" \
            || { echo "  FAIL a correct rewrite was rejected — the gate is wording-pinned"; fail=1; }
          cp "$RUNNER_TEMP/SKILL.keep" "$S"

          # 4. NEAR-MISS the other way: present, but only inside a fence -> must stay RED.
          # A fenced block is a template or a quoted example; it instructs nobody.
          perl -0pi -e 's/^- \*\*Then read your own Expected.*\n/```\ncheck the Expected against the suggested fix\n```\n/m' "$S"
          ./bin/lint-docs.sh >/dev/null 2>&1 \
            && { echo "  FAIL a fenced mention counted as an instruction surface"; fail=1; } \
            || echo "  ok   fixture 4: a quoted example does not count as a site"
          cp "$RUNNER_TEMP/SKILL.keep" "$S"

          ./bin/lint-docs.sh >/dev/null 2>&1 \
            && echo "  ok   docs restored, gate green again" \
            || { echo "  FAIL the restore did not put $S back"; fail=1; }
          exit "$fail"

      - name: rag-capture refuses a non-vault out loud, and never guesses a boundary
        run: |
          # The boundary read was a bare `grep ... 2>/dev/null` under `set -euo pipefail`.
          # grep exits 1 on no-match and 2 on a missing file; pipefail propagated that out
          # of the command substitution and -e aborted the assignment — so a WIKI_PATH
          # pointing at a directory that EXISTS but is not a vault exited non-zero with
          # NOTHING on stdout or stderr, while the missing-directory case one line above
          # printed "error: no vault at <path>". The documented caller is a SessionEnd hook
          # whose exit status and stderr nobody reads, so the observable was identical to a
          # correctly-wired capture on a quiet session: an operator who moved, renamed or
          # re-cloned their vault lost capture permanently with no signal anywhere.
          #
          # The naive repair would have been WORSE than the bug. A dead `BOUND="personal"`
          # fallback sat on the next line, unreachable only because -e killed the script
          # first; merely silencing the abort would have stamped a GUESSED boundary onto
          # every capture file, and rag-build's cross-boundary filter drops a mis-stamped
          # page from recall silently. So this gate asserts the MESSAGE and the absence of
          # a guess, not just the exit status — a silent non-zero exit is the state fixed.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-ragvault"
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main
          T="$RUNNER_TEMP/ragvault"; rm -rf "$T"; mkdir -p "$T"; fail=0

          # the cwd a SessionEnd hook would report — a real repo, so nothing downstream
          # of the boundary read is what refuses
          R="$T/repo"; mkdir -p "$R"; git -C "$R" init -q .
          git -C "$R" commit -q --allow-empty -m seed
          HOOK="{\"cwd\":\"$R\"}"

          # run WIKI -> sets rc/out/err. `|| rc=$?` is not decoration: GitHub runs this
          # step as `bash -e {0}`, every case below expects a NON-ZERO exit, and a bare
          # `out="$(...)"` is a plain assignment — so -e would kill the step at the first
          # refusal, before rc=$? ran, and the gate would abort with no assertion output
          # at all. That is this step's own subject matter, so it is worth stating: a test
          # for a silent `set -e` abort is exactly the thing that can die of one. Guarding
          # with `||` rather than toggling `set +e` keeps the helper correct whether or not
          # the caller has -e on, so running the body by hand measures what CI measures.
          run() {
            rc=0
            out="$(printf '%s' "$HOOK" | WIKI_PATH="$1" ./bin/rag-capture.sh 2>"$T/err")" || rc=$?
            err="$(cat "$T/err" 2>/dev/null || true)"
          }

          # 1. a directory that exists, has the capture tree, and has NO CLAUDE.md at all
          mkdir -p "$T/nocm/raw/sessions"
          run "$T/nocm"
          [ "$rc" != "0" ] \
            && echo "  ok   a directory with no CLAUDE.md is refused" \
            || { echo "  FAIL captured into a directory that is not a vault"; fail=1; }
          printf '%s' "$err" | grep -q "$T/nocm/CLAUDE.md" \
            && echo "  ok   ...and the refusal names the file it looked in" \
            || { echo "  FAIL refusal is silent or does not name the file (stderr: [$err])"; fail=1; }
          printf '%s' "$err" | grep -q "boundary:" \
            && echo "  ok   ...and names the declaration it wanted" \
            || { echo "  FAIL refusal does not name the missing declaration (stderr: [$err])"; fail=1; }
          [ -z "$(ls -A "$T/nocm/raw/sessions")" ] \
            && echo "  ok   ...and wrote nothing" \
            || { echo "  FAIL a capture file was written into a non-vault"; fail=1; }

          # 2. a CLAUDE.md that exists but carries no declaration — the hand-edited case
          mkdir -p "$T/nobnd/raw/sessions"
          printf '# notes\n\nno declaration here\n' > "$T/nobnd/CLAUDE.md"
          run "$T/nobnd"
          [ "$rc" != "0" ] && [ -n "$err" ] \
            && echo "  ok   a CLAUDE.md with no declaration is refused, loudly" \
            || { echo "  FAIL exit=$rc stderr=[$err] — silent non-zero exit is the defect"; fail=1; }
          [ -z "$(ls -A "$T/nobnd/raw/sessions")" ] \
            && echo "  ok   ...and wrote nothing" \
            || { echo "  FAIL a capture file was written with a guessed boundary"; fail=1; }
          grep -q 'boundary: personal' "$T/nobnd/raw/sessions"/*.md 2>/dev/null \
            && { echo "  FAIL the boundary was GUESSED rather than read"; fail=1; } \
            || echo "  ok   ...and did not guess a boundary to stamp it with"

          # 3. the neighbouring missing-directory case must still refuse the same way —
          #    the two must not diverge again
          run "$T/does-not-exist"
          [ "$rc" != "0" ] && printf '%s' "$err" | grep -q "$T/does-not-exist" \
            && echo "  ok   a missing directory still refuses by name" \
            || { echo "  FAIL exit=$rc stderr=[$err]"; fail=1; }

          # 4. a real vault must still CAPTURE, stamped with the boundary it DECLARES —
          #    a gate that only proves refusal would pass on a script that refuses always
          V="$T/vault"; mkdir -p "$V/raw/sessions"
          printf -- '---\nboundary: research\n---\n\n# v\n' > "$V/CLAUDE.md"
          run "$V"
          [ "$rc" = "0" ] \
            && echo "  ok   a real vault still captures" \
            || { echo "  FAIL a valid vault was refused: exit=$rc stderr=[$err]"; fail=1; }
          grep -rq 'boundary: research' "$V/raw/sessions" \
            && echo "  ok   ...stamped with the boundary the vault declares, not a literal" \
            || { echo "  FAIL capture file missing or stamped with the wrong boundary"; fail=1; }

          exit "$fail"

      - name: Consecutive sessions must not re-file the same repo block
        run: |
          # REGRESSION: the selection window is a flat lookback (RAG_CAPTURE_SINCE hours
          # back from the moment of capture) while the hook fires at the END OF EVERY
          # SESSION. Those units do not divide the day the same way, so two sessions ending
          # inside one window both look back over the whole of it and both write the same
          # repo. Three captures over two repos produced six identical blocks and three
          # distinct facts — the buffer grew as (sessions x repos in window) rather than as
          # work done. Each block was true; the ATTRIBUTION was not, and this buffer feeds
          # distillation and is indexed for recall.
          #
          # Declined: making the window "since the previous capture". That boundary is
          # GLOBAL while the unit is per-session, and peer sessions are a shipped feature —
          # whichever ended first would claim the interval and a long session ending later
          # would report a window shorter than its own life. Over-capture is noise;
          # under-capture loses the session the user just had.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-window"
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main
          T="$RUNNER_TEMP/window"; rm -rf "$T"; mkdir -p "$T/ws"; fail=0
          V="$T/vault"; mkdir -p "$V/raw/sessions"
          printf -- '---\nboundary: personal\n---\n\n# v\n' > "$V/CLAUDE.md"
          for r in alpha beta; do
            git init -q "$T/ws/$r"
            ( cd "$T/ws/$r"; printf 'x\n' > f; git add f; git commit -qm "work in $r" )
          done

          for i in 1 2 3; do ( cd "$T/ws" && WIKI_PATH="$V" "$GITHUB_WORKSPACE/bin/rag-capture.sh" >/dev/null 2>&1 ) || true; done
          buf="$(ls "$V/raw/sessions"/*.md 2>/dev/null | head -1 || true)"
          [ -n "$buf" ] \
            && echo "  ok   fixture: a buffer exists to measure" \
            || { echo "  FAIL no buffer written"; exit 1; }
          full="$(grep -cE '^## .*@main' "$buf" 2>/dev/null || true)"; full="${full:-0}"
          [ "$full" -eq 2 ] \
            && echo "  ok   three identical sessions file the two facts once each" \
            || { echo "  FAIL $full full block(s) for 2 distinct facts"; grep -E '^## ' "$buf"; fail=1; }
          # INVERTED at v1.65.0. This asserted the opposite — that a repeat session left an
          # `unchanged since` line so "a session happened here" stayed true. That line was
          # the right answer to DUPLICATED blocks, and the wrong rate once anything fans out
          # headless one-shots: one block per one-shot, each structurally empty. The session
          # is now evidenced on stdout at the moment it is suppressed instead of in a buffer
          # nobody wants to read. Do not restore this without re-reading that trade.
          [ "$(grep -c 'unchanged since' "$buf" 2>/dev/null || true)" -eq 0 ] \
            && echo "  ok   ...and a repeat that observed nothing new appends nothing at all" \
            || { echo "  FAIL a content-free repeat still filed a block"; grep -E '^## ' "$buf"; fail=1; }

          ( cd "$T/ws/alpha" && printf 'y\n' > g && git add g && git commit -qm "new work" ) >/dev/null 2>&1
          ( cd "$T/ws" && WIKI_PATH="$V" "$GITHUB_WORKSPACE/bin/rag-capture.sh" >/dev/null 2>&1 ) || true
          full2="$(grep -cE '^## .*alpha@main' "$buf" 2>/dev/null || true)"; full2="${full2:-0}"
          [ "$full2" -eq 2 ] \
            && echo "  ok   ...while genuinely new work files a fresh block" \
            || { echo "  FAIL alpha has $full2 block(s); new work was suppressed or duplicated"; fail=1; }

          exit "$fail"

      - name: A capture carrying nothing appends nothing, and says so
        run: |
          # REGRESSION: SessionEnd fires once per session, which is the right rate for
          # interactive work and wrong the moment a harness fans out headless one-shots. A
          # one-shot that runs a single query touches no repo, so the block it files is
          # structurally empty. Measured on a consuming vault: 79 blocks in 21 minutes, 65
          # of them the two content-free shapes, crowding out the 14 that carried a keeper.
          #
          # The gate keys on the block's EMPTINESS, not on a session attribute the harness
          # may not expose. Every assertion below has a stated precondition, because
          # "appended nothing" and "the script died before writing" look identical from the
          # buffer alone — so the substantive cases run in the SAME fixture as the
          # suppressed ones, and a run that suppressed must still say so on stdout.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-empty"
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main
          CAP="$GITHUB_WORKSPACE/bin/rag-capture.sh"
          T="$RUNNER_TEMP/emptyblock"; rm -rf "$T"; mkdir -p "$T/ws"; fail=0
          V="$T/vault"; mkdir -p "$V/raw/sessions"
          printf -- '---\nboundary: personal\n---\n\n# v\n' > "$V/CLAUDE.md"
          blocks() { grep -c '^## ' "$1" 2>/dev/null || echo 0; }

          # 1. nothing touched -> no block, no buffer file, and an explicit reason
          out="$(cd "$T/ws" && WIKI_PATH="$V" "$CAP" 2>&1)" || true
          [ "$(ls -1 "$V/raw/sessions" 2>/dev/null | wc -l)" -eq 0 ] \
            && echo "  ok   a session with no repo activity writes no buffer at all" \
            || { echo "  FAIL a content-free run created a buffer: $out"; fail=1; }
          case "$out" in
            *"nothing to append"*) echo "  ok   ...and says so, so silence is not mistaken for a broken hook" ;;
            *) echo "  FAIL suppression was silent: [$out]"; fail=1 ;;
          esac

          # 2. PRECONDITION for every assertion above: real work must still file a block.
          #    Without this the whole step would pass on a script that appends nothing ever.
          git init -q "$T/ws/alpha"
          ( cd "$T/ws/alpha"; printf 'x\n' > f; git add f; git commit -qm "real work" )
          ( cd "$T/ws" && WIKI_PATH="$V" "$CAP" >/dev/null 2>&1 ) || true
          buf="$(ls "$V/raw/sessions"/*.md 2>/dev/null | head -1 || true)"
          [ -n "$buf" ] && [ "$(grep -cE '^## .*alpha@main' "$buf" 2>/dev/null || true)" -eq 1 ] \
            && echo "  ok   real repo state still files a full block, unchanged" \
            || { echo "  FAIL the fixture cannot discriminate: real work filed nothing"; fail=1; }

          # 3. the reported case: fan-out of one-shots over an unchanged tree adds zero
          before="$(blocks "$buf")"
          for i in 1 2 3 4 5; do ( cd "$T/ws" && WIKI_PATH="$V" "$CAP" >/dev/null 2>&1 ) || true; done
          after="$(blocks "$buf")"
          [ "$before" -eq "$after" ] \
            && echo "  ok   5 further content-free runs add 0 blocks (was +1 each)" \
            || { echo "  FAIL fan-out grew the buffer $before -> $after"; fail=1; }

          # 4. --note is real content: a session worth keeping can still force a block
          ( cd "$T/ws" && WIKI_PATH="$V" "$CAP" --note "keeper" >/dev/null 2>&1 ) || true
          [ "$(grep -c '^Note (' "$buf" 2>/dev/null || true)" -eq 1 ] \
            && echo "  ok   ...while --note still files a session that touched no repo" \
            || { echo "  FAIL --note was suppressed along with the empty block"; fail=1; }

          # 5. the suppression must not swallow attribution that rides ALONGSIDE content.
          #    A MIXED session — one repo with new state, another already recorded — still
          #    names the second on its `unchanged since` line, because there the line is
          #    carried with content rather than instead of it. Unpinned until now, and the
          #    docs had already drifted on exactly this point: a verify pass found SCHEMA.md
          #    and this script's own comment claiming the line was gone outright.
          git init -q "$T/ws/beta"
          ( cd "$T/ws/beta"; printf 'b\n' > f; git add f; git commit -qm "beta work" )
          ( cd "$T/ws" && WIKI_PATH="$V" "$CAP" >/dev/null 2>&1 ) || true   # file beta once
          ( cd "$T/ws/alpha"; printf 'y\n' > g; git add g; git commit -qm "newer alpha" ) >/dev/null 2>&1
          ( cd "$T/ws" && WIKI_PATH="$V" "$CAP" >/dev/null 2>&1 ) || true   # alpha new, beta not
          [ "$(grep -c 'beta@main.*unchanged since' "$buf" 2>/dev/null || true)" -ge 1 ] \
            && echo "  ok   a mixed session still names the repo that had nothing new" \
            || { echo "  FAIL suppression swallowed attribution in a mixed session"; grep -E '^## ' "$buf"; fail=1; }

          exit "$fail"

      - name: Capture must not scale with a harness's fan-out
        run: |
          # REGRESSION, reported separately from the step above and fixed by the same
          # change (51ef084, v1.65.0) before the report was intaken. Pinned rather than
          # closed on paper, because "it does not reproduce" is a statement about today.
          #
          # The shape here is NOT the one above and that is the whole point. The step above
          # fans out over a workspace whose repos exist but are unchanged; this one fans out
          # over throwaway directories containing no repository AT ANY DEPTH, outside the
          # vault — what a harness that runs one headless one-shot per query actually
          # creates. Both reach the suppression, by different routes through the selection
          # logic, and only one of them was covered.
          #
          # Reported consequence was downstream: rag-build indexes raw/sessions, so the
          # blocks became chunks competing with curated notes — 144 chunks, 9.4% of one
          # vault's whole index, from a single day. That is asserted here at the BUFFER
          # layer: no block written is no chunk to index, and the embedding pass needs a
          # venv and a model download that do not belong in this job.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-fanout"
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main
          CAP="$GITHUB_WORKSPACE/bin/rag-capture.sh"
          T="$RUNNER_TEMP/fanout"; rm -rf "$T"; mkdir -p "$T"; fail=0
          V="$T/vault"; mkdir -p "$V/raw/sessions"
          printf -- '---\nboundary: personal\n---\n\n# v\n' > "$V/CLAUDE.md"

          # PRECONDITION: a session with a real repo must still file a block. Without it,
          # "0 blocks" below is satisfied by a capture that is simply broken — and a
          # never-worked capture and a fixed one look identical from an empty buffer.
          mkdir -p "$T/work/real"; git init -q "$T/work/real"
          ( cd "$T/work/real"; printf 'x\n' > f; git add f; git commit -qm "real work" )
          ( cd "$T/work" && WIKI_PATH="$V" "$CAP" >/dev/null 2>&1 ) || true
          buf="$(ls "$V/raw/sessions"/*.md 2>/dev/null | head -1 || true)"
          base="$(grep -c '^## ' "${buf:-/dev/null}" 2>/dev/null || true)"; base="${base:-0}"
          [ "$base" -eq 1 ] \
            && echo "  ok   fixture: real repo work files a block, so 0 below means suppressed" \
            || { echo "  FAIL fixture cannot discriminate: real work filed $base block(s)"; exit 1; }

          # THE REPORTED SHAPE: N ephemeral harness dirs, no repo at any depth
          for i in $(seq 1 30); do
            d="$T/harness-cwd-$i"; mkdir -p "$d"
            ( cd "$d" && WIKI_PATH="$V" "$CAP" >/dev/null 2>&1 ) || true
          done
          after="$(grep -c '^## ' "${buf:-/dev/null}" 2>/dev/null || true)"; after="${after:-0}"
          [ "$after" -eq "$base" ] \
            && echo "  ok   30 ephemeral harness invocations add 0 blocks (was +1 each)" \
            || { echo "  FAIL buffer scaled with fan-out: $base -> $after"; fail=1; }

          # and specifically none of the shape the report counted 110 of
          [ "$(grep -c 'no repo activity found' "${buf:-/dev/null}" 2>/dev/null || true)" -eq 0 ] \
            && echo "  ok   ...and none of them is the content-free shape the report counted" \
            || { echo "  FAIL content-free blocks present"; grep -E '^## ' "$buf"; fail=1; }

          exit "$fail"

      - name: A verdict must be about the tree the operator is standing in
        run: |
          # REGRESSION: a tool whose whole output is a VERDICT bound $WIKI_PATH directly, so a bare
          # run from inside a session worktree answered confidently about the CANONICAL checkout and
          # said nothing about which tree it had chosen. `lint.sh` printed `lint: all checks passed`,
          # exit 0, empty stderr, while the worktree it was run from carried a real violation — and
          # `pre-commit` lints the committed tree (`lint.sh --wiki "$ROOT"`), so the hook failed on
          # what the hand-run had just called clean. That reads as a broken hook, not as two tools
          # answering about two trees.
          #
          # wiki-root-lib.sh already states the rule: only tools whose target is TRACKED VAULT
          # CONTENT resolve through resolve_wiki_root. These four are; they had simply never been
          # converted. The last of them WRITES, and its own comment claimed a protection its code
          # never invoked.
          #
          # Every assertion below is paired with its opposite, because "targets the worktree" and
          # "targets canonical" are each provable only against the other.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-tree"
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main
          BIN="$GITHUB_WORKSPACE/bin"
          T="$RUNNER_TEMP/treeresolve"; rm -rf "$T"; mkdir -p "$T"; fail=0

          # a vault that is a git repo, with one linked worktree of itself
          V="$T/vault"; mkdir -p "$V/memory" "$V/projects" "$V/repos"
          printf -- '---\nboundary: personal\n---\n\n# v\n' > "$V/CLAUDE.md"
          # three notes, each linking the other two: memory lint requires >=2 outbound links, and
          # mutual links keep the link gate clean so the ONLY violation in play is the planted one
          for n in a b c; do
            case "$n" in a) l1=b; l2=c;; b) l1=a; l2=c;; c) l1=a; l2=b;; esac
            printf -- '---\ntitle: %s\ntype: memory\nstatus: current\nboundary: personal\n---\n\n# %s\n\nbody linking [[%s]] and [[%s]].\n' "$n" "$n" "$l1" "$l2" > "$V/memory/$n.md"
          done
          printf -- '# index\n\n<!-- skills:start -->\n<!-- skills:end -->\n\n<!-- projects:start -->\n<!-- projects:end -->\n' > "$V/index.md"
          ( cd "$V" && WIKI_PATH="$V" "$BIN/gen-skills-index.sh" >/dev/null 2>&1; WIKI_PATH="$V" "$BIN/gen-projects-index.sh" >/dev/null 2>&1 ) || true
          git init -q "$V"
          ( cd "$V" && git add -A && git commit -qm init )
          WT="$T/wt"; ( cd "$V" && git worktree add -q "$WT" -b wt/test )

          # plant a violation in the WORKTREE only — canonical stays clean, so a verdict of
          # "all checks passed" is TRUE of canonical and FALSE of the tree cwd is in
          sed -i.bak 's/^boundary: personal$/boundary: work/' "$WT/memory/a.md" && rm -f "$WT/memory/note.md.bak"

          # 1. PRECONDITION: canonical really is clean, or every assertion below is vacuous
          ( cd "$V" && WIKI_PATH="$V" "$BIN/lint.sh" >/dev/null 2>"$T/e1" ) && canon_ok=1 || canon_ok=0
          [ "$canon_ok" = "1" ] && [ ! -s "$T/e1" ] \
            && echo "  ok   fixture: canonical passes, and says nothing about targeting" \
            || { echo "  FAIL fixture: canonical does not pass cleanly"; cat "$T/e1"; exit 1; }

          # 2. the reported defect: a bare run from the worktree must judge THE WORKTREE
          out="$( cd "$WT" && WIKI_PATH="$V" "$BIN/lint.sh" 2>"$T/e2" )" && rc=0 || rc=1
          [ "$rc" = "1" ] \
            && echo "  ok   a bare run from a worktree fails on that worktree's violation" \
            || { echo "  FAIL bare run reported success about a different tree"; echo "$out" | tail -3; fail=1; }
          case "$out" in
            *"boundary: work, but this vault declares personal"*)
              echo "  ok   ...red for the RIGHT reason — the violation planted in that worktree" ;;
            *) echo "  FAIL red, but not for the planted violation"; echo "$out" | tail -5; fail=1 ;;
          esac
          grep -q "targeting $WT" "$T/e2" \
            && echo "  ok   ...and names the tree it chose, unprompted, on stderr" \
            || { echo "  FAIL no announcement: [$(cat "$T/e2")]"; fail=1; }

          # 3. explicit --wiki is never second-guessed, from the same cwd
          ( cd "$WT" && WIKI_PATH="$V" "$BIN/lint.sh" --wiki "$V" >/dev/null 2>"$T/e3" ) \
            && echo "  ok   --wiki still wins from inside a worktree, silently" \
            || { echo "  FAIL --wiki no longer targets what it names"; cat "$T/e3"; fail=1; }

          # 4. an UNRELATED repo must not retarget — engine dev happens with $WIKI_PATH exported
          ( cd "$GITHUB_WORKSPACE" && WIKI_PATH="$V" "$BIN/lint.sh" >/dev/null 2>"$T/e4" ) \
            && [ ! -s "$T/e4" ] \
            && echo "  ok   cwd in an unrelated repo still targets \$WIKI_PATH, silently" \
            || { echo "  FAIL retargeted (or announced) outside the vault's own repo"; cat "$T/e4"; fail=1; }

          # 5. the same defect in the sibling that WRITES. --seed-baseline only writes when there is
          #    something to grandfather, so plant one; without it the write never fires and the
          #    assertion passes against a tool that did nothing.
          mkdir -p "$WT/projects" "$V/projects"
          cat > "$WT/projects/p.md" <<'EOF'
          ---
          title: p
          type: project
          status: active
          summary: "shipping v1.2.3 this week"
          boundary: personal
          ---

          # p
          EOF
          cp "$WT/projects/p.md" "$V/projects/p.md"
          ( cd "$WT" && WIKI_PATH="$V" "$BIN/lint-summary-volatility.sh" --seed-baseline --quiet >"$T/o5" 2>&1 ) || true
          [ -f "$WT/.wiki-gates-summary-baseline" ] \
            && echo "  ok   --seed-baseline writes into the worktree it was run from" \
            || { echo "  FAIL the seed did not land in the worktree: $(cat "$T/o5")"; fail=1; }
          [ ! -f "$V/.wiki-gates-summary-baseline" ] \
            && echo "  ok   ...and not into the shared canonical tree" \
            || { echo "  FAIL a worktree seed dirtied canonical — the clobber worktrees prevent"; fail=1; }

          # 6. the verdict tool the drain loop itself runs
          ( cd "$WT" && WIKI_PATH="$V" "$BIN/verify-status.sh" >/dev/null 2>"$T/e6" ) || true
          grep -q "targeting $WT" "$T/e6" \
            && echo "  ok   verify-status resolves and announces the same way" \
            || { echo "  FAIL verify-status still answers about \$WIKI_PATH silently"; fail=1; }

          exit "$fail"

      - name: Maintenance must not leave an access footprint the capture reads as work
        run: |
          # REGRESSION: rag-capture selects a repo when it sees a fetch or checkout inside
          # its window — the mtime of FETCH_HEAD or the HEAD reflog — because a session
          # spent READING a repo writes nothing else. `upkeep.sh sync-clones` performs that
          # identical action on every clone it manages, for maintenance, so one sweep
          # stamped the whole workspace as worked and the next capture recorded repos
          # nobody had opened, into a buffer that feeds distillation and recall.
          #
          # Same trap v1.54.0 rejected the index mtime for — a tool perturbing the signal
          # another tool reads as evidence — except across two verbs of one engine.
          #
          # The fix belongs in the WRITER: the reader cannot tell a fetch by a person from
          # a fetch by a tool, but the tool knows what it did and restores the timestamps
          # it disturbed. Content is untouched; only the timing footprint goes back.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-footprint"
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main
          T="$RUNNER_TEMP/footprint"; rm -rf "$T"; mkdir -p "$T"; fail=0
          V="$T/vault"; mkdir -p "$V/raw/sessions" "$V/repos"
          printf -- '---\nboundary: personal\n---\n\n# v\n' > "$V/CLAUDE.md"
          WS="$T/repos"; mkdir -p "$WS"
          for name in quiet-repo behind-repo; do
            git init -q --bare "$T/$name.git"
            git clone -q "$T/$name.git" "$WS/$name" 2>/dev/null
            ( cd "$WS/$name"; printf 'x\n' > f; git add f
              GIT_COMMITTER_DATE="2026-07-01T12:00:00" GIT_AUTHOR_DATE="2026-07-01T12:00:00" git commit -qm old
              git push -q origin main 2>/dev/null )
            printf -- '---\ntype: repo\nsources:\n  - repo: %s\n    ref: aaaaaaa\n    sha: aaaaaaa\n    ingested: 2026-01-01\nboundary: personal\n---\n' "$name" > "$V/repos/$name.md"
          done
          # an upstream commit for behind-repo, dated OLD on purpose: a fresh one fires the
          # COMMIT clause — a change signal, and always has been — which would mask whether
          # the ACCESS footprint under test is actually suppressed.
          git clone -q "$T/behind-repo.git" "$T/pusher" 2>/dev/null
          ( cd "$T/pusher"; printf 'y\n' > g; git add g
            GIT_COMMITTER_DATE="2026-07-02T12:00:00" GIT_AUTHOR_DATE="2026-07-02T12:00:00" git commit -qm new
            git push -q origin main 2>/dev/null )

          # AGE THE CLONES. A fixture built seconds ago stamps every .git file "now", so a
          # fix that dates something back to the repo's own last head change is
          # indistinguishable from no fix — the reference is as fresh as what it replaces.
          for n in quiet-repo behind-repo; do
            rm -rf "$WS/$n/.git/logs" "$WS/$n/.git/FETCH_HEAD"
            find "$WS/$n/.git" -exec touch -t 202607011200 {} + 2>/dev/null || true
          done

          # Keep the output of both tools. Discarding it is how the first version of this
          # step died on the runner with NOTHING printed: a bare `x="$(grep -c ...)"` under
          # `bash -e` aborts when the glob matches no file, and the evidence that would
          # have explained it had been sent to /dev/null.
          sweep="$(UPKEEP_REPOS_ROOT="$WS" WIKI_PATH="$V" "$GITHUB_WORKSPACE/bin/upkeep.sh" sync-clones 2>&1 || true)"
          cap="$(cd "$WS" && WIKI_PATH="$V" "$GITHUB_WORKSPACE/bin/rag-capture.sh" 2>&1 || true)"
          # v1.65.0 changed what "no footprint" LOOKS like. This used to require a buffer to
          # exist and then count zero repo blocks in it. A capture that observes nothing now
          # writes no buffer at all, so that precondition became unsatisfiable by
          # construction — and "no buffer" cannot, on its own, tell an invisible sweep from
          # a capture that died. The capture's own report is the better evidence: it states
          # positively that it found no repo activity, where a sweep that HAD left a
          # footprint would instead say it appended an entry. The control that proves the
          # capture still works at all is assertion 3 below, which requires the operator's
          # own fetch to file a block in this same fixture.
          case "$cap" in
            *"nothing to append"*"no repo activity"*)
              echo "  ok   a maintenance sweep leaves no repo looking worked-in" ;;
            *) echo "  FAIL the sweep was visible to the capture"; \
               echo "       sweep: $sweep"; echo "       capture: $cap"; fail=1 ;;
          esac
          buf="$(ls "$V/raw/sessions"/*.md 2>/dev/null | head -1 || true)"
          blocks="$(grep -cE '^## .*@main' "${buf:-/dev/null}" 2>/dev/null || true)"; blocks="${blocks:-0}"
          [ "$blocks" -eq 0 ] \
            && echo "  ok   ...and filed no repo block for it, buffer or no buffer" \
            || { echo "  FAIL $blocks repo block(s) after a sweep"; grep -E '^## ' "$buf"; fail=1; }

          # the suppression must not cost the verb its job
          [ "$(git -C "$WS/behind-repo" log --oneline | grep -c new)" -gt 0 ] \
            && echo "  ok   ...while still fast-forwarding the clone that was behind" \
            || { echo "  FAIL sync-clones stopped fast-forwarding"; fail=1; }

          # ...nor the clause its purpose: an operator's own fetch is still access.
          # THIS IS THE CONTROL for the two assertions above: they claim the sweep was
          # invisible, and a capture that saw nothing and a capture that is broken make that
          # claim identically. Only a run that DOES file a block, in this same fixture,
          # separates them. `buf` is re-resolved here because the suppressed runs above
          # deliberately left no buffer to hold.
          git -C "$WS/quiet-repo" fetch --quiet
          ( cd "$WS" && WIKI_PATH="$V" "$GITHUB_WORKSPACE/bin/rag-capture.sh" >/dev/null 2>&1 ) || true
          buf="$(ls "$V/raw/sessions"/*.md 2>/dev/null | head -1 || true)"
          [ -n "$buf" ] && grep -qE '^## .*quiet-repo@main' "$buf" \
            && echo "  ok   ...and a fetch by the OPERATOR is still captured" \
            || { echo "  FAIL the fix silenced genuine access too (buf=${buf:-<none>})"; fail=1; }

          exit "$fail"

      - name: The capture hook cannot hang on an stdin nobody closes
        run: |
          # REGRESSION: the hook payload was read from stdin with no bound. `[ -t 0 ]`
          # guards the TERMINAL case, and a closed pipe reaches EOF on its own — but an
          # OPEN pipe with no writer that ever closes it fails the tty test exactly as a
          # genuine payload does, and the read never returns. No output, no exit status,
          # nothing written; a hook that hangs also holds up whatever waits on it, and a
          # stall has no status to attribute it to.
          #
          # THIS IS THE ENVIRONMENT THAT CANNOT SHOW THE BUG, which is why it needs a
          # fixture: a runner hands each step an stdin that reaches EOF, so every existing
          # capture step passes without redirecting. The fifo below supplies the state a
          # supervisor, a cron wrapper, or a surrounding pipeline supplies in the field.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-ragstdin"
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main
          T="$RUNNER_TEMP/ragstdin"; rm -rf "$T"; mkdir -p "$T"; fail=0
          V="$T/vault"; mkdir -p "$V/raw/sessions"
          printf -- '---\nboundary: personal\n---\n\n# v\n' > "$V/CLAUDE.md"
          R="$T/payload-repo"; mkdir -p "$R"; git -C "$R" init -q .
          git -C "$R" commit -q --allow-empty -m seed

          # 1. an open pipe nobody closes: must fall back to the no-payload path, promptly
          mkfifo "$T/p"
          ( exec sleep 60 > "$T/p" ) & holder=$!
          start=$SECONDS; rc=0
          ( cd "$R" && WIKI_PATH="$V" "$GITHUB_WORKSPACE/bin/rag-capture.sh" ) < "$T/p" >/dev/null 2>&1 || rc=$?
          elapsed=$((SECONDS - start))
          kill "$holder" 2>/dev/null || true; wait "$holder" 2>/dev/null || true
          [ "$elapsed" -lt 20 ] \
            && echo "  ok   returned in ${elapsed}s instead of waiting forever" \
            || { echo "  FAIL still blocked on an open pipe (${elapsed}s)"; fail=1; }
          [ "$rc" = "0" ] \
            && echo "  ok   ...with a status the caller can read" \
            || { echo "  FAIL exit=$rc — a timeout must mean 'no payload', not failure"; fail=1; }
          grep -rq 'repo: payload-repo' "$V/raw/sessions" \
            && echo "  ok   ...and captured through the \$PWD fallback that already existed" \
            || { echo "  FAIL nothing was captured after the bounded read"; fail=1; }

          # 2. a real payload must still be READ — a bound that discards the hook JSON
          #    would pass case 1 and break the wired path
          rm -f "$V/raw/sessions"/*.md
          printf '{"cwd":"%s"}' "$R" | ( cd "$GITHUB_WORKSPACE" && WIKI_PATH="$V" ./bin/rag-capture.sh ) >/dev/null 2>&1 \
            && echo "  ok   a payload that arrives and closes is still captured" \
            || { echo "  FAIL the wired hook path broke"; fail=1; }
          grep -rq 'repo: payload-repo' "$V/raw/sessions" \
            && echo "  ok   ...and the repo came from the payload, not from \$PWD" \
            || { echo "  FAIL the hook JSON was discarded by the bounded read"; fail=1; }

          exit "$fail"

      - name: Workspace capture selects repos on session activity, not on being dirty
        run: |
          # REGRESSION: the workspace-root scan selected a child repo on a PERSISTENT
          # property — "the working tree is dirty" — not a session-scoped one. An untracked
          # directory some tool creates and nobody commits made its repo touched on EVERY
          # run from then on, while the repo the session was actually about (read-only work:
          # fetches, a diff, a review) had a clean tree and old commits and was skipped.
          # Fail-open: the capture succeeds and looks correct, and the block it indexes for
          # recall says the work happened somewhere it did not.
          #
          # Both directions are pinned here because a fix for either one alone is wrong:
          # dropping untracked-only dirt (the report's cheap option) would also stop
          # capturing a brand-new project whose first session has no commits yet.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig-ragtouch"
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main
          CAP="$GITHUB_WORKSPACE/bin/rag-capture.sh"
          T="$RUNNER_TEMP/ragtouch"; rm -rf "$T"; mkdir -p "$T/ws"; fail=0
          V="$T/vault"; mkdir -p "$V"
          printf -- '---\nboundary: personal\n---\n# v\n' > "$V/CLAUDE.md"
          OLD=202001010000            # fixed, so the fixture never drifts with the clock
          ODATE='2020-01-01T00:00:00+0000'

          mkrepo() {                 # a child repo whose only commit is far outside the window
            d="$T/ws/$1"; mkdir -p "$d"; git -C "$d" init -q .
            printf 'seed\n' > "$d/f.txt"; git -C "$d" add f.txt
            GIT_AUTHOR_DATE="$ODATE" GIT_COMMITTER_DATE="$ODATE" git -C "$d" commit -qm "old $1"
          }
          age() { find "$T/ws/$1" -exec touch -t "$OLD" {} + ; }   # nothing here was touched

          # ── must NOT be captured: dirt that has sat there indefinitely ──────────────
          mkrepo stale-untracked
          mkdir -p "$T/ws/stale-untracked/.some-tool-dir"
          printf 'x\n' > "$T/ws/stale-untracked/.some-tool-dir/cfg"
          age stale-untracked
          mkrepo stale-modified                       # the tracked half of the same problem:
          printf 'edit\n' >> "$T/ws/stale-modified/f.txt"   # dirty for months, untouched today
          age stale-modified
          mkrepo untouched-clean
          age untouched-clean

          # ── must BE captured: work that happened inside the window ──────────────────
          mkrepo edited-now; age edited-now
          printf 'edit\n' >> "$T/ws/edited-now/f.txt"        # tracked file edited this session
          mkrepo created-now; age created-now
          printf 'new\n' > "$T/ws/created-now/brand-new.txt" # new file, nothing committed yet
          mkrepo fetched-now                                 # read-only work, tree stays clean
          git clone -q "$T/ws/fetched-now" "$T/origin" 2>/dev/null
          git -C "$T/ws/fetched-now" remote add origin "$T/origin"
          age fetched-now
          git -C "$T/ws/fetched-now" fetch -q origin         # writes FETCH_HEAD, touches no file
          mkrepo switched-now
          git -C "$T/ws/switched-now" branch probe
          age switched-now
          git -C "$T/ws/switched-now" checkout -q probe      # writes the HEAD reflog only
          [ -n "$(git -C "$T/ws/switched-now" status --porcelain)" ] \
            && { echo "  FAIL fixture: the branch switch dirtied the tree"; fail=1; }
          [ -z "$(git -C "$T/ws/fetched-now" status --porcelain)" ] \
            && [ -z "$(git -C "$T/ws/untouched-clean" status --porcelain)" ] \
            || { echo "  FAIL fixture: a repo meant to be clean is dirty"; fail=1; }
          [ -n "$(git -C "$T/ws/stale-untracked" status --porcelain)" ] \
            || { echo "  FAIL fixture: the stale repo is not dirty, so this proves nothing"; fail=1; }

          # </dev/null on every run: the script reads hook JSON from stdin, so it blocks
          # forever on an stdin that is an open pipe rather than at EOF. Whether a runner's
          # stdin is one or the other is not this gate's business to depend on.
          WIKI_PATH="$V" "$CAP" --repo "$T/ws" </dev/null >/dev/null
          got="$(grep -ho 'repo: [a-z-]*' "$V/raw/sessions/"*.md | sed 's/repo: //' | sort -u | tr '\n' ' ')"
          echo "  captured: $got"
          for r in edited-now created-now fetched-now switched-now; do
            case " $got " in *" $r "*) echo "  ok   $r captured";;
              *) echo "  FAIL $r was worked in inside the window and was not captured"; fail=1;; esac
          done
          for r in stale-untracked stale-modified untouched-clean; do
            case " $got " in *" $r "*)
              echo "  FAIL $r was not touched this session and was captured"; fail=1;;
              *) echo "  ok   $r skipped";; esac
          done

          # and it must stay skipped on every later run, which is the unbounded-in-time half
          rm -f "$V/raw/sessions/"*.md
          WIKI_PATH="$V" "$CAP" --repo "$T/ws" </dev/null >/dev/null
          grep -q 'repo: stale-untracked' "$V/raw/sessions/"*.md \
            && { echo "  FAIL the same untouched repo is re-captured every run, forever"; fail=1; } \
            || echo "  ok   a permanently-dirty repo does not reappear on the next run"

          # The age test must never be what silences capture. On a platform whose date(1)
          # does neither form of the arithmetic, dirt has to count again — over-capturing is
          # noise, under-capturing loses the session — so this pins the fallback direction.
          N="$RUNNER_TEMP/nodate"; mkdir -p "$N"
          printf '#!/bin/sh\nfor a in "$@"; do case "$a" in -v*|-d*) exit 1;; esac; done\nexec %s "$@"\n' \
            "$(command -v date)" > "$N/date"
          chmod +x "$N/date"
          rm -f "$V/raw/sessions/"*.md
          PATH="$N:$PATH" WIKI_PATH="$V" "$CAP" --repo "$T/ws" </dev/null >/dev/null
          grep -q 'repo: stale-untracked' "$V/raw/sessions/"*.md \
            && echo "  ok   with no window arithmetic available it captures any dirt again" \
            || { echo "  FAIL a date(1) without either form makes the scan capture less, silently"; fail=1; }

          exit "$fail"
